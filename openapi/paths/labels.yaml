# Fragmento OpenAPI del contexto Etiquetas (labels).
#
# Lo fusiona el integrador en openapi/v1.yaml; NO se edita v1.yaml aquí. Las rutas son relativas a
# la base /api/v1 (igual que el resto del contrato). Puerta: app interna Flutter (/app/*).
tags:
  - name: labels
    description: Etiquetas QR firmadas de un pedido y distribución de claves públicas

paths:
  /app/labels/public-keys:
    get:
      tags: [labels]
      operationId: getLabelPublicKeys
      summary: Public keys bundle for offline QR verification
      description: >
        Devuelve el conjunto de claves públicas vigentes (activa + anteriores aún aceptadas) que la
        app usa para verificar la firma Ed25519 de los QR sin conexión. Solo claves públicas.
      responses:
        '200':
          description: Bundle of currently accepted public keys
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicKeyBundle'

  /app/orders/{orderNumber}/labels:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    get:
      tags: [labels]
      operationId: getShipmentLabels
      summary: Emitted labels of an order
      description: >
        Etiquetas ya emitidas del pedido, para reimprimir o sincronizar la app offline. Cada etiqueta
        trae su contenido de QR firmado y su ZPL.
      responses:
        '200':
          description: Labels already emitted for the order (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
    post:
      tags: [labels]
      operationId: emitShipmentLabels
      summary: Emit the label batch for an order
      description: >
        Emite una etiqueta por cada producto físico de cada línea del pedido: arma el payload, lo firma
        y renderiza su ZPL. Reemitir una etiqueta ya emitida es un conflicto (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitLabelsRequest'
      responses:
        '201':
          description: Labels emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '409':
          description: A label with the same identity was already emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid input

  /app/orders/{orderNumber}/labels/reprint:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    post:
      tags: [labels]
      operationId: reprintShipmentLabels
      summary: Reprint the labels of an order
      description: >
        Revoca las etiquetas vigentes del pedido (quedan en la base, marcadas como revocadas para
        auditoría) y emite un lote nuevo con identidades nuevas. Se usa cuando una etiqueta se dañó o
        cambió el contenido del producto. Requiere un motivo (ADR 004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprintLabelsRequest'
      responses:
        '201':
          description: New labels emitted; previous labels revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '422':
          description: Invalid input

  /integrations/orders/{orderNumber}/labels/pre-emit:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    post:
      tags: [labels]
      operationId: preEmitOrderLabels
      summary: Pre-emit the labels of an order when a plan is published
      description: >
        Pre-emisión disparada por el worker/integrador al publicarse un plan
        (planning.plan_published): deja las etiquetas firmadas y renderizadas listas antes de preparar
        el pedido. Idempotente: si el pedido ya tiene etiquetas vigentes, no reemite (responde 200 con
        el estado actual). Puerta de procesos internos (integrations).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitLabelsRequest'
      responses:
        '200':
          description: Labels pre-emitted (or already present; idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '422':
          description: Invalid input

  /app/orders/{orderNumber}/labels/zpl:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    get:
      tags: [labels]
      operationId: getShipmentLabelsZpl
      summary: Concatenated ZPL for the order labels
      description: >
        ZPL de todas las etiquetas del pedido, concatenado y listo para enviar a la impresora Zebra.
      responses:
        '200':
          description: Raw ZPL stream for the Zebra printer
          content:
            application/x-zpl:
              schema:
                type: string
        '404':
          description: The order has no emitted labels

  /app/orders/{orderNumber}/dispatch-lines:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    get:
      tags: [labels]
      operationId: getOrderDispatchLines
      summary: Dispatch lines of an order (per-product labeling screen)
      description: >
        Líneas de despacho de la orden para la pantalla de etiquetado por producto: cada producto con
        nombre + imagen servible, origen y destino humanos (cero uuid), el envío al que pertenece
        (shipment_id opaco para agrupar + shipment_reference legible), si está AUTORIZADA (plan publicado)
        y el estado de su etiqueta. Forma n-a-n (destino por línea): hoy una orden es un envío (destino
        único), pero el contrato soporta el split real producto→destino.
      responses:
        '200':
          description: Dispatch lines with per-line product, origin, destination, authorization and label status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchLinesResponse'

  /app/labels/{labelId}/resolve:
    parameters:
      - name: labelId
        in: path
        required: true
        description: Id (ULID) de la etiqueta escaneada
        schema:
          type: string
    get:
      tags: [labels]
      operationId: resolveLabelUnit
      summary: Resolve a scanned label to its physical unit (online fallback)
      description: >
        FALLBACK ONLINE: resuelve una etiqueta escaneada (su id/ULID del QR) al producto físico (unit_id) y su
        envío. El flujo normal es offline-first: la app mapea label_id→unit_id desde lo que ya cacheó
        (EmittedLabel para el preparador, UnitTracking para el chofer). Este endpoint es solo para una
        etiqueta no cacheada.
      responses:
        '200':
          description: Resolution (resolved=false si no se pudo atar al producto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelUnitResolution'

components:
  parameters:
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      description: Número de pedido
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: label_already_emitted
            message:
              type: string

    EmitLabelsRequest:
      type: object
      required: [origin, destination, lines]
      properties:
        origin:
          type: string
          maxLength: 64
          description: Nodo de origen
        destination:
          type: string
          maxLength: 64
          description: Nodo de destino
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmitLabelLine'

    ReprintLabelsRequest:
      allOf:
        - $ref: '#/components/schemas/EmitLabelsRequest'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              maxLength: 255
              description: Motivo de la reimpresión; queda registrado al revocar el lote anterior

    EmitLabelLine:
      type: object
      required: [sku, name, quantity]
      properties:
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
          description: Nombre del producto; no viaja en el QR (ADR 004)
        quantity:
          type: integer
          minimum: 1
          description: Unidades del producto en la línea
        pieces_per_unit:
          type: integer
          minimum: 1
          default: 1
          description: Piezas (cajas) por unidad; una etiqueta por pieza

    LabelCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmittedLabel'

    EmittedLabel:
      type: object
      required: [order_number, label_id, key_id, sku, line_number, qr_content, zpl, emitted_at, revoked]
      properties:
        order_number:
          type: string
        label_id:
          type: string
          description: Identidad de negocio (campo `id` del payload), única por producto físico
        key_id:
          type: integer
          description: Clave con la que se firmó (campo `k` del QR)
        sku:
          type: string
        line_number:
          type: integer
        qr_content:
          type: string
          description: JSON firmado exacto que lleva el QR
        zpl:
          type: string
          description: Representación ZPL para la impresora Zebra
        emitted_at:
          type: integer
          description: Marca de tiempo de emisión (epoch en segundos)
        revoked:
          type: boolean
          description: true si la etiqueta fue revocada (p. ej. por reimpresión) y ya no es válida
        revoked_at:
          type: integer
          nullable: true
          description: Marca de tiempo de revocación (epoch en segundos), o null si está vigente
        revoked_reason:
          type: string
          nullable: true
          description: Motivo de la revocación, o null si está vigente
        product_name:
          type: string
          nullable: true
          description: >-
            Nombre humano del producto, resuelto por SKU (líneas del envío / catálogo). null si no se pudo
            resolver.
        image_url:
          type: string
          nullable: true
          description: >-
            URL servible ABSOLUTA de la imagen del producto (resuelta por SKU). null si no hay imagen.
        origin:
          type: object
          required: [code, name]
          description: Origen de despacho. `code` es el código embebido en el QR; `name` es el nombre de nodo si el código matchea la red.
          properties:
            code:
              type: string
              description: Código de origen del QR (free-form; suele ser un code de nodo)
            name:
              type: string
              nullable: true
              description: Nombre humano del nodo de origen si `code` matchea network; si no, null (mostrar name ?? code)
        destination:
          type: object
          required: [type, name, address]
          description: Destino del envío de la orden (nombres humanos, sin uuid).
          properties:
            type:
              type: string
              nullable: true
              enum: [home, store, warehouse]
              description: >-
                home = domicilio del cliente; store = tienda/punto de retiro; warehouse = centro de
                distribución/almacén. null si no se pudo determinar el envío.
            name:
              type: string
              nullable: true
              description: Nombre del destino (cliente en home; nombre del nodo en store/warehouse)
            address:
              type: string
              nullable: true
              description: Dirección (solo en home; null en nodo)
        unit_id:
          type: string
          nullable: true
          description: >-
            UUID del PRODUCTO FÍSICO (shipment_units) de esta etiqueta, resuelto por correlación. La app mapea
            label_id→unit_id localmente (offline) para escanear contra el producto real. Mismo valor que
            UnitTracking.unit_id. null si no se pudo atar (p. ej. la línea del envío no coincide).
        shipment_id:
          type: string
          nullable: true
          description: UUID del envío del producto (opaco), o null
        unit:
          type: object
          required: [index, total]
          description: Índice de unidad del producto dentro de su línea
          properties:
            index: { type: integer }
            total: { type: integer }
        piece:
          type: object
          required: [index, total]
          description: Índice de pieza del producto dentro de su unidad
          properties:
            index: { type: integer }
            total: { type: integer }

    LabelUnitResolution:
      type: object
      description: Resolución de una etiqueta escaneada (ULID) al producto físico + envío (fallback online).
      required: [label_id, resolved, unit_id, shipment_id, sku, product_name, line_number, unit, piece]
      properties:
        label_id: { type: string }
        resolved:
          type: boolean
          description: true si se pudo atar al producto
        unit_id:
          type: string
          nullable: true
          description: UUID del producto físico, o null si no se resolvió
        shipment_id: { type: string, nullable: true }
        sku: { type: string, nullable: true }
        product_name: { type: string, nullable: true }
        line_number: { type: integer, nullable: true }
        unit:
          type: object
          nullable: true
          properties: { index: { type: integer }, total: { type: integer } }
        piece:
          type: object
          nullable: true
          properties: { index: { type: integer }, total: { type: integer } }

    DispatchLinesResponse:
      type: object
      required: [order_reference, destinations, data]
      properties:
        order_reference:
          type: string
          description: Número/referencia legible del pedido
        destinations:
          type: array
          description: Resumen de grupos por envío/destino (para agrupar en la UI multishipping)
          items:
            type: object
            required: [shipment_reference, destination, line_count]
            properties:
              shipment_reference:
                type: string
                nullable: true
              destination:
                $ref: '#/components/schemas/DispatchDestination'
              line_count:
                type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/DispatchLine'

    DispatchLine:
      type: object
      required: [sku, product_name, image_url, quantity, pieces_per_unit, line_number, origin, destination, shipment_id, shipment_reference, authorized, authorized_reason, label_status]
      properties:
        sku:
          type: string
        product_name:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
          description: URL servible absoluta de la imagen del producto, o null
        quantity:
          type: integer
        pieces_per_unit:
          type: integer
          description: Productos por unidad; 1 por defecto si no se conoce
        line_number:
          type: integer
          description: Posición 1-based de la línea en la orden
        origin:
          type: object
          required: [code, name]
          properties:
            code:
              type: string
            name:
              type: string
              nullable: true
              description: Nombre de nodo si `code` matchea network; si no, null (mostrar name ?? code). Vacío en líneas pending.
        destination:
          $ref: '#/components/schemas/DispatchDestination'
        shipment_id:
          type: string
          nullable: true
          description: Clave OPACA de agrupación del envío (no se muestra)
        shipment_reference:
          type: string
          nullable: true
          description: Referencia legible del envío (mostrable como título del grupo)
        authorized:
          type: boolean
          description: true si el envío está en un plan publicado
        authorized_reason:
          type: string
          nullable: true
          description: Motivo si authorized=false (p. ej. "sin plan publicado")
        label_status:
          type: string
          enum: [pending, emitted, revoked]

    DispatchDestination:
      type: object
      required: [type, name, address]
      properties:
        type:
          type: string
          nullable: true
          enum: [home, store, warehouse]
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
          description: Dirección (solo en home)

    PublicKeyBundle:
      type: object
      required: [active_key_id, keys]
      properties:
        active_key_id:
          type: integer
          nullable: true
          description: Id de la clave activa, o null si no hay ninguna configurada
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PublicKey'

    PublicKey:
      type: object
      required: [id, public_key]
      properties:
        id:
          type: integer
          description: Id de la clave (campo `k` del QR)
        public_key:
          type: string
          description: Clave pública Ed25519 en base64
