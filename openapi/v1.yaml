        authorized_reason:
          type: string
          nullable: true
          description: Motivo si authorized=false (p. ej. "sin plan publicado")
        label_status:
          type: string
          enum:
          - pending
          - emitted
          - revoked
    DispatchDestination:
      type: object
      required:
      - type
      - name
      - address
      properties:
        type:
          type: string
          nullable: true
          enum:
          - home
          - store
          - warehouse
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
          description: Dirección (solo en home)
    PublicKeyBundle:
      type: object
      required:
      - open
      - active_key_id
      - keys
      properties:
        open:
          type: boolean
          description: >-
            Modo ABIERTO de etiquetas. Cuando es true, la app NO debe verificar la firma Ed25519 de
            NINGÚN QR (ni las k:0 nuevas ni las k:1 ya impresas) y valida por pertenencia (order_reference):
            así una etiqueta impresa nunca se rechaza por un problema de clave. Cuando es false, se verifica
            la firma de las etiquetas con k >= 1 contra las claves públicas de abajo.
        active_key_id:
          type: integer
          nullable: true
          description: Id de la clave activa, o null si no hay ninguna configurada
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PublicKey'
    PublicTracking:
      type: object
      description: Vista pública del seguimiento (sin PII)
      required:
      - status
      - remaining_stops
      - route_position
      - eta
      - last_position
      - position_is_live
      - stops_message
      properties:
        status:
          $ref: '#/components/schemas/VisibleStatus'
        remaining_stops:
          type: integer
          minimum: 0
          description: Paradas que el camión atiende antes de llegar a la del cliente
        route_position:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Posición del envío en la secuencia de la ruta publicada (1 es la primera parada)
        eta:
          type:
          - string
          - 'null'
          format: date-time
        last_position:
          oneOf:
          - $ref: '#/components/schemas/TruckPosition'
          - type: 'null'
        position_is_live:
          type:
          - boolean
          - 'null'
          description: True si la última posición es fresca (ventana en vivo), false si es solo la última conocida, null si no hay posición.
        stops_message:
          type: string
          description: Mensaje al cliente en español, p. ej. "Tu pedido está a 3 paradas."
    QueueNotificationRequest:
      type: object
