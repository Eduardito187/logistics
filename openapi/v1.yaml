        unit_price_cents:
          type: integer
        qty:
          type: integer
        subtotal_cents:
          type: integer
    CommerceOpenCartRequest:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          maxLength: 255
        customer_id:
          type: [string, 'null']
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; defaults to BOB when omitted.
    CommerceAddItemRequest:
      type: object
      required: [sku, product_name, unit_price_cents]
      properties:
        sku:
          type: string
          maxLength: 255
        product_name:
          type: string
          maxLength: 255
        unit_price_cents:
          type: integer
          minimum: 0
          description: Unit price in cents, already resolved by the storefront.
        quantity:
          type: integer
          minimum: 1
          default: 1
    CommerceUpdateItemQtyRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          description: New quantity; 0 removes the line.

    CommerceShipTo:
      type: object
      required: [customer_name, address_text]
      properties:
        customer_name:
          type: string
          maxLength: 255
        address_text:
          type: string
          maxLength: 1000
        reference:
          type: [string, 'null']
          maxLength: 1000
        phone:
          type: [string, 'null']
          maxLength: 40
        email:
          type: [string, 'null']
          format: email
          maxLength: 180
    CommerceOrderLine:
      type: object
      required: [sku, product_name, unit_price_cents, quantity]
      properties:
        sku:
          type: string
          maxLength: 255
        product_name:
          type: string
          maxLength: 255
        unit_price_cents:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 1
    CommercePlaceOrderRequest:
      type: object
      required: [ship_to, lines]
      properties:
        customer_id:
          type: [string, 'null']
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; defaults to BOB when omitted.
        financing:
          type: string
          enum: [cash, credit_with_initial, credit_without_initial]
          default: cash
          description: >-
            Forma de financiamiento. Determina qué habilita el paso a procesando: contado = pago capturado;
            crédito sin inicial = firma de contrato; crédito con inicial = firma de contrato + pago del inicial.
        ship_to:
          $ref: '#/components/schemas/CommerceShipTo'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CommerceOrderLine'
    CommerceCreditSignalRequest:
      type: object
      description: Señal de crédito (firma de contrato / pago de inicial) reportada por el POS/sistema de crédito.
      properties:
        reference:
          type: [string, 'null']
          maxLength: 120
          description: Referencia externa opcional del POS/sistema de crédito (nro. de contrato, comprobante).
    CommerceCheckoutAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        customer_name:
          type: string
        currency:
          type: string
    CommerceOrder:
      type: object
      required: [id, status, currency, total_cents, shipment_requested, ship_to, lines]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          description: Order status (e.g. pending, paid, fulfilling, cancelled).
        currency:
          type: string
        total_cents:
          type: integer
        shipment_requested:
          type: boolean
        ship_to:
          $ref: '#/components/schemas/CommerceShipTo'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CommerceOrderLine'

    CommerceAck:
      type: object
      description: Acknowledgement of an accepted asynchronous write (202).
      required: [accepted]
      properties:
        accepted:
          type: boolean
      additionalProperties: true
    CommercePriceQuote:
      type: object
      required: [sku, channel, net_cents, tax_cents, gross_cents, currency]
      properties:
        sku:
          type: string
        channel:
          type: string
          enum: [retail, b2b, c2c]
        net_cents:
          type: integer
        tax_cents:
          type: integer
          description: Total taxes included in the gross amount.
        gross_cents:
          type: integer
        currency:
          type: string
        tax_breakdown:
          type: object
          properties:
            iva_cents:
              type: integer
            iva_basis_points:
              type: integer
            it_cents:
              type: integer
            it_basis_points:
              type: integer
    CommercePriceView:
      type: object
      required: [price_list_id, sku, gross_amount_cents, currency]
      properties:
        price_list_id:
          type: string
          format: uuid
        sku:
          type: string
        gross_amount_cents:
          type: integer
        currency:
          type: string
    CommercePriceList:
      type: object
      required: [id, name, currency, channel, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        channel:
          type: string
          enum: [retail, b2b, c2c]
        status:
          type: string
          enum: [draft, active, archived]
    CommerceCreatePriceListRequest:
      type: object
      required: [name, channel]
      properties:
        name:
          type: string
          maxLength: 255
        channel:
          type: string
          enum: [retail, b2b, c2c]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217; defaults to BOB when omitted.
    CommerceSetPriceRequest:
      type: object
      required: [sku, gross_amount_cents]
      properties:
        sku:
          type: string
          maxLength: 255
        gross_amount_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3

    CommerceAccount:
      type: object
      required: [id, type, user_id, display_name, status, addresses]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [person, company, seller_person]
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        tax_id:
          type: [string, 'null']
        status:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/CommerceAddress'
    CommerceAddress:
      type: object
      required: [label, recipient, line1, city, is_default]
      properties:
        label:
          type: string
        recipient:
          type: string
        line1:
          type: string
        line2:
          type: [string, 'null']
        city:
          type: string
        state:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        is_default:
          type: boolean
    CommerceRegisterAccountRequest:
      type: object
      required: [type, user_id, display_name]
      properties:
        type:
          type: string
          enum: [person, company, seller_person]
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        tax_id:
          type: [string, 'null']
    CommerceAddAddressRequest:
      type: object
      required: [label, recipient, line1, city]
      properties:
        label:
          type: string
        recipient:
          type: string
        line1:
          type: string
        line2:
          type: [string, 'null']
        city:
          type: string
        state:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        is_default:
          type: boolean

    CommerceCheckoutRequest:
      type: object
      required:
      - cart_id
      - ship_to
      properties:
        cart_id:
          type: string
          format: uuid
        ship_to:
          $ref: '#/components/schemas/CommerceShipTo'
    CommerceEvaluatePromotionsRequest:
      type: object
      required:
      - subtotal_cents
      - channel
      properties:
        subtotal_cents:
          type: integer
          minimum: 0
        channel:
          type: string
          enum:
          - Retail
          - B2B
          - C2C
        coupon_code:
          type:
          - string
          - 'null'
          maxLength: 64
    CommerceAppliedPromotion:
      type: object
      required:
      - promotion_id
      - name
      - discount_cents
      - free_shipping
      properties:
        promotion_id:
          type: string
          format: uuid
        name:
          type: string
        discount_cents:
          type: integer
        free_shipping:
          type: boolean
    CommerceDiscountQuote:
      type: object
      required:
      - applied
      - total_discount_cents
      - free_shipping
      properties:
        applied:
          type: array
          items:
            $ref: '#/components/schemas/CommerceAppliedPromotion'
        total_discount_cents:
          type: integer
        free_shipping:
          type: boolean
    CommercePromotionConditions:
      type: object
      properties:
        min_subtotal_cents:
          type: integer
        channel:
          type:
          - string
          - 'null'
          enum:
          - Retail
          - B2B
          - C2C
          - null
        starts_at:
          type:
          - string
          - 'null'
        ends_at:
          type:
          - string
          - 'null'
    CommercePromotionView:
      type: object
      required:
      - id
      - name
      - type
      - value
      - currency
      - status
      - version
      - is_coupon
      - free_shipping
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type:
          - string
          - 'null'
        type:
          type: string
          enum:
          - percentage_off
          - fixed_amount_off
          - free_shipping
        value:
          type: integer
          description: Basis points (percentage), cents (fixed amount) or 0 (free shipping).
        currency:
          type: string
        conditions:
          $ref: '#/components/schemas/CommercePromotionConditions'
        status:
          type: string
          enum:
          - draft
          - active
          - expired
        version:
          type: integer
        is_coupon:
          type: boolean
        free_shipping:
          type: boolean
    CommerceCreatePromotionRequest:
      type: object
      required:
      - name
      - type
      - value
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum:
          - percentage_off
          - fixed_amount_off
          - free_shipping
        value:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        code:
          type:
          - string
          - 'null'
          maxLength: 64
        min_subtotal_cents:
          type: integer
          minimum: 0
        channel:
          type:
          - string
          - 'null'
          enum:
          - Retail
          - B2B
          - C2C
          - null
        starts_at:
          type:
          - string
          - 'null'
        ends_at:
          type:
          - string
          - 'null'
    CommerceChangePromotionRulesRequest:
      type: object
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - percentage_off
          - fixed_amount_off
          - free_shipping
        value:
          type: integer
          minimum: 0
        min_subtotal_cents:
          type: integer
          minimum: 0
        channel:
          type:
          - string
          - 'null'
          enum:
          - Retail
          - B2B
          - C2C
          - null
        starts_at:
          type:
          - string
          - 'null'
        ends_at:
          type:
          - string
          - 'null'
    CommerceInvoiceLine:
      type: object
      required:
      - description
      - quantity
      - unit_price_cents
      - line_total_cents
      properties:
        description:
          type: string
        quantity:
          type: integer
        unit_price_cents:
          type: integer
        line_total_cents:
          type: integer
    CommerceInvoice:
      type: object
      required:
      - id
      - order_id
      - customer_name
      - currency
      - lines
      - net_cents
      - iva_cents
      - total_cents
      - status
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        number:
          type:
          - string
          - 'null'
        customer_name:
          type: string
        customer_tax_id:
          type:
          - string
          - 'null'
        currency:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CommerceInvoiceLine'
        net_cents:
          type: integer
        iva_cents:
          type: integer
        total_cents:
          type: integer
        status:
          type: string
          enum:
          - draft
          - issued
          - cancelled
        issued_at:
          type:
          - string
          - 'null'

    CommerceSearchItem:
      type: object
      required:
      - id
      - name
      - canonical_sku
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        canonical_sku:
          type: string
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
    CommerceSearchResult:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommerceSearchItem'
        next_cursor:
          type:
          - string
          - 'null'
        total:
          type:
          - integer
          - 'null'
          description: Total hit count, present only on the first page.
    CommerceSearchFacet:
      type: object
      required:
      - count
      properties:
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        count:
          type: integer

    CommerceMoney:
      type: object
      required:
      - cents
      - currency
      properties:
        cents:
          type: integer
        currency:
          type: string
    CommercePayment:
      type: object
      required:
      - id
      - order_id
      - amount
      - method
      - status
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/CommerceMoney'
        method:
          type: string
        status:
          type: string
        gateway_ref:
          type:
          - string
          - 'null'
    CommerceInitiatePaymentRequest:
      type: object
      required:
      - order_id
      - amount_cents
      - method
      properties:
        order_id:
          type: string
          format: uuid
        amount_cents:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217; defaults to BOB when omitted.
        method:
          type: string
          maxLength: 64

    CommerceCancelOrderRequest:
      type: object
      description: Optional reason for the cancellation (free text).
      properties:
        reason:
          type: string
          maxLength: 500

  parameters:
    CarrierTripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XAppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Installed app version (MAJOR.MINOR.PATCH). Below the configured minimum the API answers 426.
      schema:
        type: string
        example: 1.4.2
    XAppBuild:
      name: X-App-Build
      in: header
      required: false
      schema:
        type: string
    XAppPlatform:
      name: X-App-Platform
      in: header
      required: false
      schema:
        type: string
        enum:
        - android
        - ios
        - web
    XDeviceModel:
      name: X-Device-Model
      in: header
      required: false
      schema:
        type: string
        maxLength: 120
    XDeviceOsVersion:
      name: X-Device-Os-Version
      in: header
      required: false
      schema:
        type: string
        maxLength: 120
    CommerceAccountId:
      name: account
      in: path
      required: true
      description: Account id.
      schema:
        type: string
        format: uuid

    CommerceCartId:
      name: cart
      in: path
      required: true
      description: Cart id.
      schema:
        type: string
        format: uuid
    CommerceCartSku:
      name: sku
      in: path
      required: true
      description: Line SKU within the cart.
      schema:
        type: string

    PageNumber:
      name: page
      in: query
      required: false
      description: >-
        1-based page number for offset pagination (E-02). When present, the response is sliced and a
        `meta` object is added. Omitting all pagination params returns the full collection unchanged.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Page size for offset or cursor pagination (max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor for cursor pagination (E-02), taken from a previous response's
        `meta.next_cursor`. Preferred over `page` for large, growing collections.
      schema:
        type: string
    GeofenceId:
      name: geofenceId
      in: path
      required: true
      description: UUID v7 de la geocerca
      schema:
        type: string
        format: uuid
    CapacityDate:
      name: date
      in: query
      required: true
      description: Slot date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    CapacityMunicipalityId:
      name: municipality_id
      in: query
      required: false
      description: Municipality (coverage area) that owns the bucket. Exactly one of municipality_id/zone_id/node_id must be provided. The municipality is the primary axis of capacity management.
      schema:
        type: string
        format: uuid
    CapacityNodeId:
      name: node_id
      in: query
      required: false
      description: Node that owns the bucket. Exactly one of municipality_id/zone_id/node_id must be provided.
      schema:
        type: string
        format: uuid
    CapacityTimeSlot:
      name: time_slot
      in: query
      required: true
      description: Time slot within the same day, HH:MM-HH:MM.
      schema:
        type: string
        pattern: ^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$
        example: 09:00-13:00
    CapacityUnit:
      name: unit
      in: query
      required: true
      description: Capacity unit of the bucket.
      schema:
        $ref: '#/components/schemas/CapacityUnit'
    CapacityZoneId:
      name: zone_id
      in: query
      required: false
      description: Zone that owns the bucket. Exactly one of municipality_id/zone_id/node_id must be provided.
      schema:
        type: string
        format: uuid
    CarrierId:
      name: carrierId
      in: path
      required: true
      description: UUID v7 del transportista
      schema:
        type: string
        format: uuid
    ExecutionShipmentId:
      name: shipmentId
      in: path
      required: true
      description: Shipment UUID
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Offline idempotency key for the scan; a resend with the same key does not duplicate the fact.
        REQUIRED for every write scan: send it here or in the body field idempotency_key. A write with
        neither is rejected with 422.
      schema:
        type: string
        maxLength: 128
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      description: Número de pedido
      schema:
        type: string
    OutboxMessageId:
      name: id
      in: path
      required: true
      description: Outbox message id (UUID v7).
      schema:
        type: string
        format: uuid
    OutboxPage:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    OutboxPerPage:
      name: per_page
      in: query
      required: false
      description: Page size (max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    OutboxStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by message status.
      schema:
        $ref: '#/components/schemas/OutboxStatus'
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PromiseId:
      name: promiseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Promise identifier (UUID v7).
    SettingAt:
      name: at
      in: query
      required: false
      description: ISO 8601 date to read the value as of. Defaults to now.
      schema:
        type: string
        format: date-time
    SettingKey:
      name: key
      in: path
      required: true
      description: Namespaced setting key, e.g. coverage.default_service_days.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        example: coverage.default_service_days
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: UUID v7 de la liquidación
      schema:
        type: string
        format: uuid
    TrackingShipmentId:
      name: shipmentId
      in: path
      required: true
      description: UUID del envío
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      description: Vehicle UUID
      schema:
        type: string
        format: uuid
  responses:
    CarrierTripState:
      description: Resulting trip state
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/CarrierTripState'
    UpgradeRequired:
      description: >-
        Installed app version is below the minimum (code=upgrade_required). Applies to every /app/* operation
        except /app/app-config; requests without X-App-Version always pass. Every /app/* response carries
        the X-Min-App-Version header when a minimum is configured.
      headers:
        X-Min-App-Version:
          description: Minimum supported app version.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                min_app_version:
                  type: string
                installed_version:
                  type: string
                  nullable: true
                update_url:
                  type: string
                  nullable: true
    AppAuthValidationError:
      description: Credentials or payload failed validation (Laravel ValidationException shape).
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            - errors
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    BusinessRuleError:
      description: Business rule violation (no capacity, invalid transition, expired reservation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromiseError'
    CapacityValidationError:
      description: Input validation or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapacityError'
    CarrierScopeForbidden:
      description: >-
        Forbidden (RFC 7807, code=forbidden): the account is not office (admin/supervisor) nor a carrier,
        the carrier account is not linked to a carrier, the resource belongs to another carrier, or the
        action is reserved to office roles.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CarriersNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeliveryState:
      description: The resulting delivery state after the scan
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Delivery'
