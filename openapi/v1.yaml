        name:
          type: string
        type:
          $ref: '#/components/schemas/NodeType'
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        status:
          $ref: '#/components/schemas/NodeStatus'
        department:
          allOf:
          - $ref: '#/components/schemas/Department'
          nullable: true
          description: Department the node sits in, or null when unassigned.
    NodeCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        meta:
