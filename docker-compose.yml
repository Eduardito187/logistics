# ============================================================
# docker-compose.yml — logistics (DESARROLLO)
# ============================================================
# Containers prefijados `dismac_lg_*` y puertos propios para correr en paralelo
# con dis-commerce (8090/3316/6389) y el resto de proyectos Dismac.
#
# PRODUCCIÓN: este archivo es el BASE. Para prod se compone con el override
# `.docker/compose/docker-compose.prod.yml` (límites de CPU/RAM + deja de publicar
# los puertos de postgres/valkey/pgbouncer al host, B-4/M-12):
#   docker compose -f docker-compose.yml -f .docker/compose/docker-compose.prod.yml up -d
# ============================================================

name: dismac-logistics

# ------------------------------------------------------------
# Rotación de logs de contenedor (M-13 auditoría).
# Sin esto el driver json-file crece sin tope en disco. 10 MB × 3 archivos por
# servicio = ~30 MB máximos de logs por contenedor. Para producción con shipping
# a Loki/ELK se mantiene igual (el canal JSON ya lo soporta) o se cambia el driver.
# ------------------------------------------------------------
x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

x-php: &php
    build:
        context: .
        dockerfile: .docker/php/Dockerfile
        target: dev
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    image: dismac/logistics-app:dev
    volumes:
        - .:/var/www/html:cached
        - vendor:/var/www/html/vendor
    environment:
        APP_ENV: local
        DB_CONNECTION: pgsql
        # La app apunta a PgBouncer (transaction pooling, C-3) en vez de a postgres
        # directo: multiplexa miles de conexiones de cliente sobre un pool pequeño de
        # conexiones reales a PostgreSQL. El host/puerto los fija el conector de la app
        # (config/database.php, a cargo de otro agente) → pgbouncer:6432.
        DB_HOST: pgbouncer
        DB_PORT: 6432
        DB_DATABASE: logistics
        DB_USERNAME: logistics
        DB_PASSWORD: logistics
        REDIS_HOST: valkey
        REDIS_PORT: 6379
    depends_on:
        pgbouncer:
            condition: service_healthy
        valkey:
            condition: service_healthy
    networks:
        - dismac_lg
    logging: *default-logging

services:
    # -------------------- Aplicación PHP-FPM --------------------
    app:
        <<: *php
        container_name: dismac_lg_app
        restart: unless-stopped
        volumes:
            - .:/var/www/html:cached
            - vendor:/var/www/html/vendor
            - composer_cache:/home/logistics/.composer/cache

    # -------------------- Nginx (web server) --------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: dismac_lg_nginx
        restart: unless-stopped
        ports:
            - "${DOCKER_APP_PORT:-8110}:80"
        volumes:
            - .:/var/www/html:cached
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- PostgreSQL + PostGIS --------------------
    # PostGIS resuelve zonas de cobertura (polígonos), geocercas y distancias (ADR 003).
    #
    # TUNING (C-3b auditoría): los defaults de la imagen (shared_buffers≈128MB,
    # work_mem≈4MB, max_wal_size mínimo) no sirven a escala. Se sobreescriben con `-c`
    # en el command (preserva el postgresql.conf autogenerado de la imagen —
    # listen_addresses='*', rutas de datos— y solo ajusta los parámetros de rendimiento).
    # Todos los valores son parametrizables por entorno; los defaults están dimensionados
    # para un contenedor MEDIANO de ~4 GB de RAM (ver docs y .docker/postgres/README no
    # requerido; la guía vive en estos comentarios):
    #   - PG_SHARED_BUFFERS        25% RAM            (4GB → 1GB)
    #   - PG_EFFECTIVE_CACHE_SIZE  ~70% RAM           (4GB → 3GB)   solo planner, no reserva
    #   - PG_WORK_MEM              por operación de sort/hash       (16MB)
    #   - PG_MAINTENANCE_WORK_MEM  VACUUM/CREATE INDEX              (256MB)
    #   - PG_MAX_WAL_SIZE / MIN    tamaño del WAL entre checkpoints (2GB / 512MB)
    #   - PG_MAX_CONNECTIONS       acorde a PgBouncer (el pooling absorbe el fan-out)
    # shared_preload_libraries='pg_stat_statements' habilita la vista de queries lentas
    # (M-6); la extensión se crea en el init SQL (.docker/postgres/init/02-*.sql).
    # Subir shared_buffers/work_mem sin RAM proporcional lleva a OOM: ajustar junto con
    # el límite de memoria del contenedor (ver override de prod) y medir (Fase 4).
    postgres:
        image: postgis/postgis:17-3.5-alpine
        container_name: dismac_lg_postgres
        restart: unless-stopped
        command:
            - "postgres"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "max_connections=${PG_MAX_CONNECTIONS:-100}"
            - "-c"
            - "shared_buffers=${PG_SHARED_BUFFERS:-1GB}"
            - "-c"
            - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}"
            - "-c"
            - "work_mem=${PG_WORK_MEM:-16MB}"
            - "-c"
            - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}"
            - "-c"
            - "max_wal_size=${PG_MAX_WAL_SIZE:-2GB}"
            - "-c"
            - "min_wal_size=${PG_MIN_WAL_SIZE:-512MB}"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "wal_compression=on"
            # SSD/NVMe: el acceso aleatorio cuesta casi lo mismo que el secuencial y la
            # concurrencia de I/O es alta. En discos giratorios subir random_page_cost.
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            # pg_stat_statements: top 10k sentencias normalizadas, sin trackear planes.
            - "-c"
            - "pg_stat_statements.max=10000"
            - "-c"
            - "pg_stat_statements.track=top"
            # Slow query log (M-6): registra toda sentencia > 500ms. 0 = log todas (debug),
            # -1 = apagado. Parametrizable.
            - "-c"
            - "log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}"
        ports:
            - "${DOCKER_DB_PORT:-5442}:5432"
        environment:
            POSTGRES_DB: logistics
            POSTGRES_USER: logistics
            POSTGRES_PASSWORD: logistics
            TZ: America/La_Paz
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./.docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- PgBouncer (pool de conexiones, C-3a) --------------------
    # Transaction pooling delante de PostgreSQL. PHP-FPM (max_children×réplicas) +
    # workers de supervisor agotan fácil las ~100 conexiones de PG, y cada conexión
    # nueva es cara. PgBouncer multiplexa miles de conexiones de cliente sobre un pool
    # pequeño de conexiones reales, reusadas por transacción.
    #
    # CONVENCIÓN (coordinada con el conector de la app): escucha en 6432, usuario/clave/db
    # `logistics` (los mismos de postgres). La app apunta a `pgbouncer:6432`.
    #
    # OJO transaction pooling: NO soporta estado de sesión entre transacciones (SET,
    # prepared statements con nombre de sesión, advisory locks de sesión). La conexión
    # pgsql de Laravel debe desactivar prepared statements persistentes de sesión. Los
    # TESTS siguen conectando a postgres DIRECTO (logistics_test) — no pasan por aquí.
    pgbouncer:
        image: edoburu/pgbouncer:v1.23.1-p3
        container_name: dismac_lg_pgbouncer
        restart: unless-stopped
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: logistics
            DB_PASSWORD: logistics
            # SIN DB_NAME a propósito: el entrypoint de edoburu genera entonces un
            # `[databases]` COMODÍN `* = host=postgres ... auth_user=logistics`, así
            # PgBouncer atiende CUALQUIER base (logistics Y logistics_test) reenviándola
            # a postgres. Imprescindible porque la suite de tests fuerza DB_DATABASE=
            # logistics_test (phpunit.xml) pero hereda DB_HOST=pgbouncer del contenedor.
            # La autenticación del cliente usa el auth_query por defecto de PgBouncer
            # (SELECT usename, passwd FROM pg_shadow WHERE usename=$1), que funciona
            # porque `logistics` es superusuario en el contenedor de postgres.
            # scram-sha-256 es el método por defecto de PostgreSQL 17.
            AUTH_TYPE: scram-sha-256
            POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
            # Tope de conexiones de cliente que acepta PgBouncer (el fan-out de la app).
            MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
            # Conexiones REALES a PostgreSQL por par (usuario, base). La suma de pools
            # debe quedar holgadamente por debajo de PG_MAX_CONNECTIONS.
            DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
            MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
            RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
            LISTEN_PORT: 6432
            # Cierra conexiones de servidor ociosas para no mantener abiertas de más.
            SERVER_IDLE_TIMEOUT: 60
            # Prepared statements a nivel de PROTOCOLO en transaction pooling (PgBouncer
            # 1.21+): deja que Laravel/PDO use prepared statements sin romper el pool.
            MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
        ports:
            # En dev se publica para poder inspeccionar con psql desde el host. El override
            # de prod deja de publicarlo (B-4).
            - "${DOCKER_PGBOUNCER_PORT:-6432}:6432"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            # busybox `nc -z` confirma que el puerto 6432 acepta conexiones.
            test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- Backup de PostgreSQL (C-1) --------------------
    # Respaldo lógico diario con pg_dump en formato custom comprimido (-Fc), retención
    # por días y restauración probada. Escribe al volumen `backups` (persistente). El
    # cron lo gobierna busybox `crond` dentro del contenedor.
    #
    # PITR: pg_dump es respaldo LÓGICO, no da point-in-time. Para PITR real (base + WAL
    # continuo) producción debe migrar a pgBackRest/wal-g con archive_mode=on + WAL
    # archiving (ver .docker/backups/README.md). Este pase deja el respaldo diario robusto
    # y VERIFICADO; el upgrade a PITR está documentado como siguiente paso.
    #
    # OFF-SITE: en producción el volumen `backups` debe sincronizarse a un destino
    # off-site (S3/MinIO ya está en el stack). El README documenta el `mc mirror`/`aws s3
    # sync`. En dev queda solo en el volumen local.
    pg-backup:
        image: postgis/postgis:17-3.5-alpine
        container_name: dismac_lg_pg_backup
        restart: unless-stopped
        environment:
            PGHOST: postgres
            PGPORT: "5432"
            PGUSER: logistics
            PGPASSWORD: logistics
            PGDATABASE: logistics
            # Cron de la base diaria (default 03:00). Formato crontab de 5 campos.
            BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
            # Días de retención de los dumps (se podan los más viejos). 7–30 recomendado.
            BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
            BACKUP_DIR: /backups
        entrypoint: ["/usr/local/bin/backup-entrypoint.sh"]
        volumes:
            - backups:/backups
            - ./.docker/backups/backup.sh:/usr/local/bin/backup.sh:ro
            - ./.docker/backups/restore.sh:/usr/local/bin/restore.sh:ro
            - ./.docker/backups/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- Valkey (cache + colas + locks) --------------------
    # Una sola instancia sirve cache + colas + sesiones + locks. Política de evicción
    # SEGURA (A-4 auditoría): `volatile-lru` solo evicta claves CON TTL (= cache) cuando
    # se alcanza maxmemory; las colas/sesiones/locks se guardan SIN TTL, así que NUNCA
    # se evictan (no se pierden jobs ni sesiones). `maxmemory` acota el crecimiento para
    # no llegar a OOM. Ambos parametrizables.
    #
    # Separar cache (evictable, sin AOF) de datos durables (AOF, sin evicción) en dos
    # instancias es el siguiente paso si el volumen lo pide; con volatile-lru + AOF una
    # sola instancia es segura y es lo que queda aquí.
    valkey:
        image: valkey/valkey:8-alpine
        container_name: dismac_lg_valkey
        restart: unless-stopped
        ports:
            - "${DOCKER_REDIS_PORT:-6409}:6379"
        volumes:
            - valkey_data:/data
        command: >
            valkey-server
            --appendonly yes
            --maxmemory ${VALKEY_MAXMEMORY:-512mb}
            --maxmemory-policy volatile-lru
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- OSRM (motor de rutas OpenStreetMap, ADR 009) --------------------
    # Sirve las matrices `/table` y las geometrías `/route`/`/trip` para el ruteo de flota.
    # Reemplaza al OSRM demo público (sin cuotas y sin que las coordenadas de clientes salgan
    # a un tercero). Siempre encendido (sin `profiles`): planning y telemetry apuntan aquí vía
    # OSRM_HOST=http://osrm:5000, y el ruteo cae a haversine solo si el servicio está caído.
    #
    # Requiere el extracto de Bolivia preprocesado (osrm-extract/partition/customize) dentro de
    # `.docker/osrm/data`. El preprocesado NO corre aquí (es pesado): ver docs/routing-selfhost.md.
    # Mientras no exista `bolivia-latest.osrm`, el contenedor reinicia en bucle a propósito: es la
    # señal de que falta correr el runbook, no un fallo de configuración.
    osrm:
        image: osrm/osrm-backend:latest
        container_name: dismac_lg_osrm
        # OPT-IN: requiere el mapa .osrm preprocesado (datos pesados). Sin él reinicia en bucle. La app
        # degrada a ruteo por cercanía/haversine, así que NO arranca por defecto: `docker compose --profile geo up`.
        profiles: ["geo"]
        restart: unless-stopped
        # Algoritmo MLD (partition + customize): permite actualizar tiempos sin recontraer todo el
        # grafo. `--max-table-size` sube el tope de la matriz /table al volumen diario esperado.
        command: osrm-routed --algorithm mld --max-table-size 10000 /data/bolivia-latest.osrm
        ports:
            - "${DOCKER_OSRM_PORT:-5010}:5000"
        volumes:
            # El extracto OSM de Bolivia y sus artefactos preprocesados viven aquí (fuera de git).
            - ./.docker/osrm/data:/data
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- VROOM (solver VRP/VRPTW opcional, ADR 009) --------------------
    # Backend de ruteo opt-in para escala y ventanas horarias duras (VRPTW). Se usa solo cuando
    # PLANNING_ROUTING_BACKEND=vroom; con `builtin` (por defecto) queda ocioso pero encendido, así
    # cambiar de backend no exige levantar servicios a mano. Resuelve apoyándose en el OSRM propio.
    # vroom-express expone la API HTTP en :3000; planning lo alcanza vía VROOM_URL=http://vroom:3000.
    vroom:
        # vroom-docker NO publica el tag `latest` (da "not found"); se pinnea a una release versionada.
        image: vroomvrp/vroom-docker:v1.13.0
        container_name: dismac_lg_vroom
        # OPT-IN (perfil geo): el optimizador VRP depende de osrm; sin osrm no sirve. La app cae al
        # optimizador builtin. Solo arranca con `docker compose --profile geo up`.
        profiles: ["geo"]
        restart: unless-stopped
        environment:
            # Deja que vroom-express lea el config montado en lugar de regenerarlo en cada arranque.
            VROOM_ROUTER: osrm
        volumes:
            - ./.docker/vroom/config.yml:/conf/config.yml:ro
        ports:
            - "${DOCKER_VROOM_PORT:-3010}:3000"
        depends_on:
            - osrm
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- Nominatim (geocoder OpenStreetMap self-host) --------------------
    # Geocoder open-source (OSM) que resuelve direcciones → coordenada. Reemplaza a Google: cero
    # servicios de pago, cero claves, y las direcciones de clientes no salen a un tercero. Siempre
    # encendido (sin `profiles`): shipments apunta aquí vía NOMINATIM_URL=http://nominatim:8080 y, si
    # está caído/sin datos, el geocoder cae al stub neutro (NullGeocoder) sin romper el ingreso.
    #
    # Requiere importar el extracto OSM de Bolivia (bolivia-latest.osm.pbf en `.docker/nominatim/data`).
    # El import es MUY pesado y NO corre aquí automáticamente sin el PBF: ver docs/maps-geocoder-selfhost.md.
    # Mientras no exista el PBF / no termine el import, el contenedor reinicia en bucle a propósito: es la
    # señal de que falta correr el runbook, no un fallo de configuración.
    nominatim:
        image: mediagis/nominatim:4.4
        container_name: dismac_lg_nominatim
        # OPT-IN (perfil geo): requiere importar un extracto OSM (varios GB, bolivia-latest.osm.pbf). Sin él
        # hace FATAL y reinicia en bucle. La app cae al NullGeocoder. `docker compose --profile geo up`.
        profiles: ["geo"]
        restart: unless-stopped
        environment:
            # Extracto OSM a importar (montado abajo). Geofabrik publica `bolivia-latest.osm.pbf`.
            PBF_PATH: /nominatim/data/bolivia-latest.osm.pbf
            # Actualizaciones incrementales de Bolivia (opcional; el runbook explica cómo activarlas).
            REPLICATION_URL: https://download.geofabrik.de/south-america/bolivia-updates/
            # Contraseña de la base interna de Nominatim (solo dentro del contenedor).
            NOMINATIM_PASSWORD: nominatim
        ports:
            - "${DOCKER_NOMINATIM_PORT:-8081}:8080"
        volumes:
            # Base PostgreSQL del índice de Nominatim (persiste el import, fuera de git).
            - nominatim_data:/var/lib/postgresql/14/main
            # Extracto OSM de Bolivia y artefactos del import (fuera de git).
            - ./.docker/nominatim/data:/nominatim/data
        # El import de Nominatim usa memoria compartida intensiva; sin esto, PostgreSQL falla.
        shm_size: 1g
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- Tileserver (teselas de mapa OpenStreetMap self-host) --------------------
    # Sirve las teselas raster del estilo osm-bright a los mapas Leaflet (admin + seguimiento público).
    # Reemplaza a tile.openstreetmap.org / tiles de pago: todo OSM self-host. Siempre encendido (sin
    # `profiles`): las vistas apuntan aquí vía MAP_TILE_URL=http://localhost:8082/styles/osm-bright/{z}/{x}/{y}.png
    # (puerto del host, porque las teselas las pide el navegador). Si no hay self-host configurado, las
    # vistas caen al tile público de OSM (solo demo).
    #
    # Requiere el mbtiles/pmtiles de Bolivia y la config del estilo en `.docker/tileserver/data` (config.json
    # + estilo osm-bright + el .mbtiles). La generación es pesada y NO corre aquí: ver
    # docs/maps-geocoder-selfhost.md. Sin esos datos el contenedor reinicia en bucle a propósito.
    tileserver:
        image: maptiler/tileserver-gl:latest
        container_name: dismac_lg_tileserver
        # OPT-IN (perfil geo): necesita un .mbtiles real; sin datos intenta el demo y falla. El mapa del
        # frontend cae a las teselas públicas de OSM (config/maps.php). `docker compose --profile geo up`.
        profiles: ["geo"]
        restart: unless-stopped
        command: --config /data/config.json --port 8080
        ports:
            - "${DOCKER_TILESERVER_PORT:-8082}:8080"
        volumes:
            # config.json, estilo osm-bright y el .mbtiles de Bolivia (fuera de git).
            - ./.docker/tileserver/data:/data
        networks:
            - dismac_lg
        logging: *default-logging

    # -------------------- Queue worker (siempre encendido) --------------------
    # Sin `profiles` a propósito: en dis-commerce un worker opcional que nadie levantó dejó
    # jobs sin procesar por más de 1 h. `--max-time` recicla el proceso para no correr código viejo.
    queue-worker:
        <<: *php
        container_name: dismac_lg_queue_worker
        restart: unless-stopped
        # Drena TODAS las colas en dev (el pump del outbox encola a outbox/notifications; planning tiene
        # sus propios jobs). En prod, supervisord corre un worker dedicado por cola (ver .docker/supervisor).
        command: php artisan queue:work redis --queue=default,outbox,notifications,planning --sleep=3 --tries=1 --timeout=600 --max-time=3600
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # -------------------- Scheduler (siempre encendido) --------------------
    scheduler:
        <<: *php
        container_name: dismac_lg_scheduler
        restart: unless-stopped
        command: php artisan schedule:work
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'schedule:work' || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # -------------------- Node (Vite + npm, bajo demanda) --------------------
    node:
        image: node:22-alpine
        container_name: dismac_lg_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html:cached
            - node_modules:/var/www/html/node_modules
        ports:
            - "${DOCKER_VITE_PORT:-5203}:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - dismac_lg
        logging: *default-logging
        profiles:
            - node

    # ============================================================
    # AÑADIDO — frente almacenamiento de objetos (ROADMAP B2): MinIO self-host.
    # ------------------------------------------------------------
    # MinIO es S3-compatible y 100% open-source: permite probar LOCAL el flujo S3 real
    # (POD, checklist, daños, collages, documentos de flota) sin cuentas AWS ni pago, y
    # sin que la evidencia de clientes salga a un tercero. En producción se usa S3/MinIO/R2
    # real por env (ver docs/deploy.md §5). Los discos de config/filesystems.php apuntan acá
    # con AWS_ENDPOINT=http://minio:9000 + AWS_USE_PATH_STYLE_ENDPOINT=true (ver .env.example).
    #
    # NOTA: este bloque agrega SOLO el servicio `minio` (otra oleada también edita este
    # compose). Usa su propio volumen `minio_data` y la red `dismac_lg`
    # ya existente; no toca otros servicios. Credenciales de DESARROLLO (no usar en prod).
    #
    # Puertos del host: API S3 en 9010 y consola web en 9011 (propios, para correr en
    # paralelo con los demás proyectos Dismac). La consola abre en http://localhost:9011
    # (usuario/clave: minioadmin/minioadmin).
    # --------------------------------------------------------------
    minio:
        # MinIO cerró sus imágenes públicas en 2025 (Docker Hub minio/* borrado, quay.io/minio privado →
        # "pull access denied" sin login). Se usa la imagen de Bitnami en su namespace LEGACY, que sigue
        # siendo de acceso público y sin login. El bucket por defecto se crea solo con MINIO_DEFAULT_BUCKETS,
        # así que ya NO hace falta el contenedor `createbuckets` con el cliente `mc`.
        # El disco S3 es OPT-IN: en dev FILESYSTEM_DISK=local, así que la app no necesita a MinIO para
        # levantar; nada depende de este servicio (si fallara, no bloquea el resto del `up`).
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        container_name: dismac_lg_minio
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
            # Crea el bucket por defecto al arrancar (idempotente). Para servir `collages` públicamente con
            # S3 en dev, fijar la policy del prefijo a mano (`mc anonymous set download .../collages`).
            MINIO_DEFAULT_BUCKETS: ${AWS_BUCKET:-logistics}
            # Región que anuncia el servidor (debe coincidir con AWS_DEFAULT_REGION).
            MINIO_REGION_NAME: ${AWS_DEFAULT_REGION:-us-east-1}
        ports:
            - "${DOCKER_MINIO_API_PORT:-9010}:9000"
            - "${DOCKER_MINIO_CONSOLE_PORT:-9011}:9001"
        volumes:
            - minio_data:/bitnami/minio/data
        networks:
            - dismac_lg
        logging: *default-logging

    # Servidor WebSocket OPEN-SOURCE (protocolo Pusher) para el fan-out en vivo de telemetría
    # (posiciones de vehículos). Self-host, sin Pusher.com ni Google — solo el protocolo. Las
    # credenciales deben coincidir con PUSHER_APP_* del .env. El app (Laravel) publica eventos a
    # `soketi:6001` por la red docker; el navegador conecta a `localhost:6001` (puerto expuesto).
    # NOTA: este bloque agrega SOLO el servicio `soketi` (otras oleadas editan este compose).
    soketi:
        image: quay.io/soketi/soketi:1.6-16-debian
        container_name: dismac_lg_soketi
        restart: unless-stopped
        environment:
            SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-dismac}
            SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-dismaclocalkey}
            SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-dismaclocalsecret}
            SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: 'false'
            SOKETI_METRICS_ENABLED: 'true'
        ports:
            - "6001:6001"
        networks:
            - dismac_lg
        logging: *default-logging

volumes:
    postgres_data:
    valkey_data:
    vendor:
    node_modules:
    composer_cache:
    nominatim_data:
    minio_data:
    # Respaldos de PostgreSQL (pg_dump -Fc). En prod, sincronizar off-site (S3/MinIO).
    backups:

networks:
    dismac_lg:
        driver: bridge
        name: dismac_lg_network
