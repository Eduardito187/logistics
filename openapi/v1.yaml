      - plan_date
      - vehicle_id
      - depart_at
      - stops
      properties:
        plan_date:
          type: string
          format: date
        vehicle_id:
          type: string
          format: uuid
        depart_at:
          type: string
          format: date-time
          description: Depot departure time, ISO-8601
        stops:
          type: array
          minItems: 1
          items:
            type: object
