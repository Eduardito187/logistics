        Empuja el mapa de cobertura vigente como documento KML (export de Google Earth / Maps). El cuerpo es el XML crudo; cada <Placemark> se convierte en una zona. El procesamiento es asíncrono (bus transaccional + outbox): responde 202 al aceptar el comando.
      requestBody:
        required: true
        content:
          application/vnd.google-earth.kml+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '202':
          description: Importación aceptada para procesarse
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: import_accepted
        '422':
          description: KML inválido o vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageError'
