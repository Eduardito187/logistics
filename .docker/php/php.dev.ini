; ============================================================
; PHP config para DESARROLLO — logistics
; ============================================================

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
date.timezone = America/La_Paz

; Errores visibles en dev
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; OPcache — revalida en cada request (dev)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; Xdebug
xdebug.mode = develop,debug,coverage
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = 0
xdebug.log_level = 0

; pcov (coverage rápido, alternativa a xdebug para tests)
pcov.enabled = 0
pcov.directory = /var/www/html

; Realpath cache (mejora perf con bind mounts en dev)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
