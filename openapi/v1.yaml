      description: >-
        Returns the vehicle (truck) and crew (driver + helpers) the admin assembled for the
        AUTHENTICATED driver on a date. The driver does not pick the vehicle; it is assigned. The
        account→driver link is `users.driver_id` (a by-value reference to fleet_drivers.id). Responds
