# Ajustes de alcance de SonarCloud (Análisis Automático lee este archivo).
#
# Exclusiones SOLO de la DETECCIÓN DE DUPLICACIÓN (CPD). Estos archivos se siguen analizando
# normalmente para bugs y olores de código; únicamente se los excluye del conteo de líneas
# duplicadas, porque ahí la repetición es intencional por diseño o inherente, y forzar DRY sería
# contraproducente o rompería la arquitectura del proyecto:
#
#   - **/Presentation/**  → El grueso de la duplicación medida. Cada bounded context tiene su propio
#     adaptador HTTP (Presentation/Http/ApiController) que despacha al CommandBus/QueryBus, y sus
#     propios Filament Resources/Pages. Son casi idénticos A PROPÓSITO: la plataforma es un monolito
#     modular orientado a microservicios donde cada contexto es AUTÓNOMO y EXTRAÍBLE a un servicio
#     (ADR 001/008). Unificar esos adaptadores acoplaría los contextos: exactamente lo que la
#     arquitectura prohíbe. CPD cross-context penaliza la autonomía que es la meta de diseño.
#   - app/Filament/**     → Widgets/páginas del admin: schemas de formulario/tabla, boilerplate de UI.
#   - tests / seeders     → Cada prueba trae su arrange y la misma cola de `skip` sin PostgreSQL;
#     los seeders son definición de datos de ejemplo. Repetitivos por naturaleza.
#
# Nota: con Análisis Automático, si SonarCloud no toma este archivo, habilitar la misma exclusión en
# la UI: Administration → Analysis Scope → Duplications → "Ignore Duplications".
sonar.cpd.exclusions=**/tests/**,**/*Test.php,database/seeders/**,**/Presentation/**,app/Filament/**
