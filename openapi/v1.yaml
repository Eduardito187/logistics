      summary: Define or update a material mapping (idempotent by SKU)
      description: |
        Define (o actualiza) el mapeo de un sku propio a su coordenada SAP (material + centro +
        almacén). Idempotente por sku: redefinir un sku existente actualiza su coordenada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineMaterialMappingRequest'
      responses:
        '201':
          description: Material mapping defined
          content:
