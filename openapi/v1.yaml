        shipment_ref:
          type: string
          maxLength: 64
        sku:
          type: string
          maxLength: 64
          description: SKU propio de la plataforma (el conector lo traduce a la coordenada SAP)
        quantity:
          type: integer
          minimum: 1
    ErrorEnvelope:
      type: object
