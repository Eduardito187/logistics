# Ajustes de alcance de SonarCloud (Análisis Automático lee este archivo).
#
# Exclusiones SOLO de la DETECCIÓN DE DUPLICACIÓN (CPD). Estos archivos se siguen analizando
# normalmente para bugs y olores de código; únicamente se los excluye del conteo de líneas
# duplicadas, porque ahí la repetición es intencional y forzar DRY es contraproducente:
#   - tests: cada prueba trae su propio bloque de arrange/setup y la misma cola de `skip` sin
#     PostgreSQL. Deben leerse de forma independiente; deduplicarlos los vuelve frágiles y opacos.
#   - seeders: son definición de datos de ejemplo, repetitivos por naturaleza.
#
# Nota: con Análisis Automático, si SonarCloud no toma este archivo, habilitar la misma exclusión
# en la UI: Administration → Analysis Scope → Duplications → "Ignore Duplications".
sonar.cpd.exclusions=**/tests/**,**/*Test.php,database/seeders/**
