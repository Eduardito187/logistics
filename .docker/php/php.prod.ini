; ============================================================
; PHP config para PRODUCCIÓN — logistics
; ============================================================

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
; Timeouts ALINEADOS (B-1 auditoría): este tope debe ser coherente con
; `request_terminate_timeout` de FPM (www.conf, 60s) y `fastcgi_read_timeout` de
; nginx (65s, un pelo por encima). Si se sube, subir también esos dos.
max_execution_time = 60
max_input_vars = 5000
date.timezone = America/La_Paz

; Errores ocultos en prod, solo logs
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; OPcache — agresivo en prod, NO revalida.
; validate_timestamps=0 ⇒ el código solo se re-lee al reiniciar PHP-FPM/los workers,
; por eso el deploy reinicia el contenedor (y el entrypoint dispara queue:restart).
opcache.enable = 1
; Habilitado en CLI: los workers de cola y el scheduler son procesos PHP de larga
; duración y se benefician del bytecode cacheado dentro de su vida útil.
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.max_wasted_percentage = 10
; Atender índices de clase/función desde opcache sin tocar el FS.
opcache.enable_file_override = 1
; JIT (tracing) para rutas calientes de CPU, p.ej. el ruteo/planificación.
opcache.jit = 1255
opcache.jit_buffer_size = 128M
; Preload: ACTIVADO (Ola 1 de alta disponibilidad). El script bootstrap/preload.php es conservador y seguro
; (solo `opcache_compile_file()`: compila, NO ejecuta providers; cada archivo envuelto para que uno malo no
; tumbe el arranque; si no hay classmap optimizado, sale sin romper). Precompila el bytecode del monolito al
; arrancar FPM, para no parsear PHP en el primer request de cada worker. VALIDAR tras el deploy: que FPM
; arranque OK (`pgrep -f php-fpm`) y medir latencia antes/después; si algo raro, comentar estas dos líneas.
opcache.preload = /var/www/html/bootstrap/preload.php
opcache.preload_user = logistics

; Xdebug/pcov DESACTIVADOS en prod (ni siquiera se instalan en el stage prod).
xdebug.mode = off

; Realpath cache
realpath_cache_size = 8192K
realpath_cache_ttl = 3600

; No exponer versión PHP
expose_php = Off
