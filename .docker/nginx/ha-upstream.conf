# ============================================================
# ha-upstream.conf — Ola 4: Nginx upstream con load balancing
# ============================================================
# Configuración de nginx para la topología HA (multi-instancia).
# Reemplaza o complementa al default.conf cuando se usa docker-compose.ha.yml.
#
# Con `deploy.replicas: 2` de app en el compose, Docker DNS resuelve el nombre
# `app` a las IPs de ambas instancias. Nginx con `resolver` Docker DNS y
# upstream dinámico rutea entre ellas con health checks.
#
# Uso: montar este archivo como /etc/nginx/conf.d/default.conf en el override HA.
# ============================================================

upstream php_backend {
    # En Docker Compose, el nombre `app` resuelve a todas las instancias (round-robin DNS).
    # `max_fails=3 fail_timeout=30s` saca un backend de la rotación si falla 3 veces en 30s.
    # `keepalive` mantiene conexiones persistentes al pool de PHP-FPM.
    server app:9000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # ── Compresión (Ola 1) ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # ── Assets versionados (Ola 1): cache agresivo ──
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Health check de nginx (para LB externo) ──
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── PHP (FastCGI al pool upstream) ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts generosos para endpoints pesados (planning, bulk).
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;

        # Keepalive con el upstream.
        fastcgi_keep_conn on;

        # ── Graceful shutdown (Ola 4) ──
        # Si el backend cierra la conexión (deploy, reciclo), nginx reintenta en otro.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    # Denegar acceso a archivos ocultos.
    location ~ /\. {
        deny all;
    }
}
