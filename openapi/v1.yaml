        center:
          type: string
          maxLength: 32
          description: Centro SAP
        warehouse:
          type: string
          maxLength: 32
          description: Almacén SAP
    Delivery:
      type: object
      required:
      - id
      - shipment_id
      - vehicle_id
      - status
      - scans
      properties:
        id:
          type: string
          format: uuid
