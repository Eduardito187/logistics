          format: uuid
        shipment_id:
          type: string
          format: uuid
        shipment_external_id:
          type: string
          nullable: true
          description: Referencia externa humana del envío (shipments.external_id); null si no hay envío asociado
        message_type:
          $ref: '#/components/schemas/MessageType'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        current_channel:
          $ref: '#/components/schemas/Channel'
        fcm_topic:
          type: string
          description: Firebase Cloud Messaging topic of the shipment (shipment_<id>); the app subscribes to it.
        channels:
          type: array
          description: Policy channels, in cascade order.
          items:
            $ref: '#/components/schemas/Channel'
        attempts:
          type: object
          description: Attempts per channel.
          additionalProperties:
            type: integer
    OrderSource:
      type: string
      enum:
      - SAP
      - MAGENTO
      - STORE
      - MANUAL
      - EXCEL
    OutboxActionEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - status
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/OutboxStatus'
    OutboxMessage:
      type: object
      required:
      - id
      - event_id
      - aggregate_type
      - aggregate_id
      - event_name
      - payload
      - status
      - attempts
      - available_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: Idempotency key; appending the same event twice is a no-op.
        aggregate_type:
          type: string
          example: network.node
        aggregate_id:
          type: string
          format: uuid
        event_name:
          type: string
          example: network.node_registered
        payload:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/OutboxStatus'
        attempts:
          type: integer
          minimum: 0
        available_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        dispatched_at:
          type:
          - string
          - 'null'
          format: date-time
        last_error:
          type:
          - string
          - 'null'
    OutboxMessageEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/OutboxMessage'
    OutboxMessagePage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboxMessage'
        meta:
          type: object
          required:
          - total
          - page
          - per_page
          - last_page
          properties:
            total:
              type: integer
            page:
              type: integer
            per_page:
              type: integer
            last_page:
              type: integer
    OutboxProblem:
      type: object
      description: RFC 7807 problem document.
      required:
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    OutboxStats:
      type: object
      required:
      - pending
      - failed
      - dispatched
      - dead_lettered
      - backlog
      - total
      properties:
        pending:
          type: integer
        failed:
          type: integer
        dispatched:
          type: integer
        dead_lettered:
          type: integer
        backlog:
          type: integer
          description: Live queue (pending + failed).
        total:
          type: integer
    OutboxStatsEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/OutboxStats'
    OutboxStatus:
      type: string
      enum:
      - pending
      - failed
      - dispatched
      - dead_lettered
      description: Lifecycle status of an outbox message.
    Plan:
      type: object
      required:
      - id
      - plan_date
      - vehicle_id
      - status
      - stops
      properties:
        id:
          type: string
          format: uuid
        plan_date:
          type: string
          format: date
        vehicle_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PlanStatus'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/PlannedStop'
        route_geometry:
          oneOf:
          - $ref: '#/components/schemas/RouteGeometry'
          - type: 'null'
          description: >-
            Street-level route geometry computed server-side and persisted with the
            plan, so the map draws it without depending on the browser. Null until
            the routing run computes it.
    RouteGeometry:
      type: object
      description: >-
        GeoJSON LineString of the planned route along streets, plus the total
        distance and duration of the trip.
      required:
      - type
      - coordinates
      - distance_meters
      - duration_seconds
      properties:
        type:
          type: string
          enum:
          - LineString
        coordinates:
          type: array
          description: Ordered [lng, lat] pairs along the route.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        distance_meters:
          type: number
          description: Total route distance in meters.
        duration_seconds:
          type: number
          description: Total route duration in seconds.
    PlanEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Plan'
    GenerateDailyPlanRequest:
      type: object
      required:
      - plan_date
      - strategy
      properties:
        plan_date:
          type: string
          format: date
          description: Day to plan, as YYYY-MM-DD
        strategy:
          type: string
          description: >-
            Planning mode. optimization packs by capacity and proximity; slots
            groups by the customer's chosen delivery time slot.
          enum:
          - optimization
          - slots
        params:
          type: object
          description: Optional per-run overrides of the configurable parameters.
          properties:
            depart_at:
              type: string
              format: date-time
              description: Depot departure time (ISO-8601); ETAs are computed from here.
            capacity_slack:
              type: number
              description: Fraction of nominal kg/m3 reserved as slack (0..1).
            default_weight_kg_per_package:
              type: number
            default_volume_m3_per_package:
              type: number
            origin_node_id:
              type: string
              format: uuid
    AutoPlanRun:
      type: object
      required:
      - id
      - plan_date
      - strategy
      - status
      - requested_at
      - trucks_planned
      - stops_planned
      - unassigned_count
      properties:
        id:
          type: string
          format: uuid
        plan_date:
          type: string
          format: date
        strategy:
          type: string
          enum:
          - optimization
          - slots
        status:
          type: string
          description: Lifecycle of the asynchronous run
          enum:
          - queued
          - processing
          - completed
          - failed
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        trucks_planned:
          type: integer
        stops_planned:
          type: integer
        unassigned_count:
          type: integer
        failure_reason:
          type: string
          nullable: true
    AutoPlanRunEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AutoPlanRun'
    PlanStatus:
      type: string
      description: Lifecycle state of a delivery plan
      enum:
      - DRAFT
      - PROPOSED
      - PUBLISHED
    PlannedStop:
      type: object
      required:
      - id
      - shipment_id
      - sequence
      - load_order
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Delivery position, 1-based
        eta_at:
          type:
          - string
          - 'null'
          format: date-time
        eta_minutes:
          type:
          - integer
          - 'null'
          description: Minutes from depot departure
        lane:
          type:
          - string
          - 'null'
          description: Load lane label
        load_order:
          type: integer
          description: Loading order (reverse of delivery)
    PlanningError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    PreTripChecklist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        items:
          type: object
          additionalProperties:
            type: boolean
          description: Map of checklist item name to its verification state.
        passed:
          type: boolean
          description: True only when every item is verified (fit to dispatch).
        pending:
          type: array
          items:
            type: string
        performed_on:
          type: string
          format: date
        notes:
          type: string
          nullable: true
    PreparationScanRequest:
      allOf:
      - $ref: '#/components/schemas/GeoScanBase'
      - type: object
        required:
        - vehicle_id
        properties:
          vehicle_id:
            type: string
            format: uuid
            description: Si la entrega aún no existe, se abre con este vehículo
    Problem:
      type: object
      description: |
        RFC 7807 problem+json. Forma uniforme de error de las tres puertas de la API. Los
        clientes deben ramificar por `code` (legible por máquina y estable), no por `title`.
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
          description: URI de referencia del tipo de problema; "<base>/<code>".
        title:
          type: string
          description: Resumen corto y estable legible por humanos.
        status:
          type: integer
          description: Mismo valor que el estado HTTP de la respuesta.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: Ruta de la petición que produjo el error.
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: object
          description: Errores por campo; presente solo en fallos de validación (code=validation_failed).
          additionalProperties:
            type: array
            items:
              type: string
    ProblemCode:
      type: string
      description: |
        Código del catálogo de errores de la API (App\Http\Problem\ErrorCode). Valor
        estable, legible por máquina, que los clientes usan para ramificar su lógica.
      enum:
      - bad_request
      - invalid_idempotency_key
      - unauthenticated
      - missing_credentials
      - invalid_credentials
      - device_revoked
      - forbidden
      - insufficient_role
      - insufficient_scope
      - not_found
      - method_not_allowed
      - conflict
      - idempotency_key_in_progress
      - idempotency_key_reused
      - payload_too_large
      - unsupported_media_type
      - validation_failed
      - rate_limited
      - server_error
      - service_unavailable
    Promise:
      type: object
      required:
      - id
      - shipment_ref
      - zone_id
      - zone_name
      - slot_date
      - time_slot
      - status
      - reserved_until
      properties:
        id:
          type: string
          format: uuid
        shipment_ref:
          type: string
        zone_id:
          type: string
        zone_name:
          type:
          - string
          - 'null'
          description: Human-readable coverage zone name resolved from zone_id; null when the zone no longer exists.
        slot_date:
          type: string
          format: date
        time_slot:
          type: string
        status:
          type: string
          enum:
          - QUOTED
          - RESERVED
          - CONFIRMED
          - EXPIRED
        reserved_until:
          type:
          - string
          - 'null'
          format: date-time
          description: RFC 3339 instant until which the reservation holds; null when not reserved.
    PromiseError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - message
          properties:
            type:
              type: string
            message:
              type: string
    ProofOfDeliveryRequest:
      allOf:
      - $ref: '#/components/schemas/GeoScanBase'
      - type: object
        required:
        - confirmation
        properties:
          confirmation:
            type: string
            maxLength: 512
            description: QR del cliente o firma
          photo_url:
            type: string
            format: uri
            maxLength: 2048
            nullable: true
            description: URL de acceso devuelta por el endpoint de subida de fotos (conveniencia)
          photo_path:
            type: string
            maxLength: 1024
            nullable: true
            description: Referencia durable (path en el disco de evidencia) devuelta por la subida de fotos; es la que se guarda en la prueba de entrega
    PublicKey:
      type: object
      required:
      - id
      - public_key
      properties:
        id:
          type: integer
          description: Id de la clave (campo `k` del QR)
        public_key:
          type: string
          description: Clave pública Ed25519 en base64
    PublicKeyBundle:
      type: object
      required:
      - active_key_id
      - keys
      properties:
        active_key_id:
          type: integer
          nullable: true
          description: Id de la clave activa, o null si no hay ninguna configurada
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PublicKey'
    PublicTracking:
      type: object
      description: Vista pública del seguimiento (sin PII)
      required:
      - status
      - remaining_stops
      - route_position
      - eta
      - last_position
      - position_is_live
      - stops_message
      properties:
        status:
          $ref: '#/components/schemas/VisibleStatus'
        remaining_stops:
          type: integer
          minimum: 0
          description: Paradas que el camión atiende antes de llegar a la del cliente
        route_position:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Posición del envío en la secuencia de la ruta publicada (1 es la primera parada)
        eta:
          type:
          - string
          - 'null'
          format: date-time
        last_position:
          oneOf:
          - $ref: '#/components/schemas/TruckPosition'
          - type: 'null'
        position_is_live:
          type:
          - boolean
          - 'null'
          description: True si la última posición es fresca (ventana en vivo), false si es solo la última conocida, null si no hay posición.
        stops_message:
          type: string
          description: Mensaje al cliente en español, p. ej. "Tu pedido está a 3 paradas."
    QueueNotificationRequest:
      type: object
      required:
      - shipment_id
      - message_type
      properties:
        shipment_id:
          type: string
          format: uuid
        message_type:
          $ref: '#/components/schemas/MessageType'
        email:
          type: string
          format: email
          nullable: true
          description: Optional email fallback for the cascade.
        phone:
          type: string
          nullable: true
          maxLength: 32
          description: Optional phone fallback for the critical SMS step.
    QueuedNotificationEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - shipment_id
          - message_type
          - status
          properties:
            shipment_id:
              type: string
              format: uuid
            message_type:
              $ref: '#/components/schemas/MessageType'
            status:
              type: string
              example: accepted
    QuotePromiseRequest:
      type: object
