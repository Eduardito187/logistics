      - center
      - warehouse
      - quantity
      - status
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
        shipment_ref:
          type: string
        material:
          type: string
          description: Material SAP (resultado de la traducción del sku propio)
        center:
          type: string
        warehouse:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - ACKNOWLEDGED
          - FAILED
        last_error:
          type:
          - string
          - 'null'
    StockTransferCollection:
      type: object
