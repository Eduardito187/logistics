; ============================================================
; PHP config para DESARROLLO en WINDOWS (Docker Desktop, bind-mount sobre NTFS)
; ============================================================
; El código fuente se monta desde el filesystem de Windows (NTFS) y cruza la
; frontera WSL↔Windows (9p/VirtioFS). Para una app PHP con miles de archivos, el
; cuello de botella es el stat() por archivo en cada request que hace OPcache con
; `revalidate_freq=0`. Esta config elimina ese stat-storm y acerca el rendimiento
; al de ext4, a cambio de que un cambio de código tarde hasta `revalidate_freq`
; segundos en reflejarse (aceptable en dev; bajalo a 0 si necesitás instantáneo).
;
; Se activa SOLO con el override `.docker/compose/docker-compose.windows.yml`
; (la config de WSL/`php.dev.ini` no se toca).

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
date.timezone = America/La_Paz

; Errores visibles en dev
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; -------- OPcache afinado para bind-mount lento (NTFS) --------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Clave del rendimiento en Windows: NO re-statear cada archivo en cada request.
; Se revalida como mucho cada 5 s (los cambios de código se ven en ≤5 s).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 5
; Segundo nivel de caché EN DISCO del contenedor (ext4 del VM, rápido): acelera el
; arranque en frío tras reiniciar php-fpm, sin volver a leer el código del NTFS.
opcache.file_cache = /tmp/opcache
opcache.file_cache_consistency_checks = 0
opcache.fast_shutdown = 1
; Saltar el chequeo de permisos del file_cache (contenedor de un solo usuario).
opcache.file_cache_fallback = 1

; Realpath cache grande: menos llamadas de resolución de ruta sobre el mount lento.
realpath_cache_size = 8192K
realpath_cache_ttl = 1200

; -------- Xdebug APAGADO por defecto (penaliza mucho el rendimiento) --------
; Activalo puntualmente para depurar (poné `xdebug.mode = develop,debug` y reiniciá app).
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = 0
xdebug.log_level = 0

; pcov (coverage rápido para tests; off en requests normales)
pcov.enabled = 0
pcov.directory = /var/www/html
