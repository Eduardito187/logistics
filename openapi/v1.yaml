              properties:
                email:
                  type: string
                  format: email
                  description: Correo del usuario.
                code:
                  type: string
                  description: Código OTP recibido por correo.
                password:
                  type: string
                  minLength: 8
                  description: Nueva contraseña.
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
