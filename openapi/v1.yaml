  /channels/promises/delivery:
    get:
      tags:
      - Promise
      operationId: listMunicipalityDeliveryPromise
      summary: List available delivery slots for a customer's municipality (K-05)
      description: >-
        Given a municipality, a coordinate (latitude + longitude) or a shipment, returns the dates and
        time slots available for dispatch in that municipality, honouring coverage, capacity, holidays
        and the horizon. The response carries no PII. Supports optional offset or cursor pagination
        (E-02): without pagination parameters the full collection is returned (with `meta.count`).
      parameters:
      - name: municipality_id
        in: query
        required: false
        description: Municipality id. One of municipality_id, latitude+longitude or shipment_id is required.
        schema:
          type: string
          maxLength: 64
      - name: shipment_id
        in: query
        required: false
        description: Shipment id; its municipality is resolved. One destination vector is required.
        schema:
          type: string
          format: uuid
      - name: latitude
        in: query
        required: false
        description: Latitude; must be sent together with longitude.
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        required: false
        description: Longitude; must be sent together with latitude.
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: from_date
        in: query
        required: false
        description: First day of the horizon (Y-m-d). Defaults to today.
        schema:
          type: string
          format: date
      - name: horizon_days
        in: query
        required: false
        description: How many days ahead to explore (the start day included).
        schema:
          type: integer
          minimum: 1
          maximum: 60
          default: 14
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Available delivery slots for the resolved municipality.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MunicipalitySlot'
                  meta:
                    anyOf:
                    - type: object
                      required:
                      - count
                      properties:
                        count:
                          type: integer
                    - $ref: '#/components/schemas/PaginationMeta'
                    - $ref: '#/components/schemas/CursorMeta'
        '404':
          $ref: '#/components/responses/PromiseNotFound'
        '422':
          $ref: '#/components/responses/PromiseValidationError'
      security:
      - channelApiKey: []
  /channels/shipments/slot-reservation:
    post:
      tags:
      - Promise
      operationId: reserveMunicipalitySlot
      summary: Reserve a delivery slot for a shipment in its municipality (K-03)
      description: >-
        Atomically and idempotently resolves the shipment's municipality, validates the day, consumes
        the municipality capacity and fixes the slot on the shipment. Distinguishes the rejections the
        channel needs: slot already taken (409), day not dispatchable (422), shipment not found (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveMunicipalitySlotRequest'
      responses:
        '201':
          description: Slot reserved for the shipment.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReservedMunicipalitySlot'
        '404':
          $ref: '#/components/responses/PromiseNotFound'
        '409':
          description: The requested slot is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromiseError'
        '422':
          $ref: '#/components/responses/PromiseValidationError'
      security:
      - channelApiKey: []
