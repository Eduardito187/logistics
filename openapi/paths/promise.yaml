# Fragmento OpenAPI del contexto Promesa de entrega (puerta channels).
#
# El integrador fusiona estos `paths` y `components.schemas` dentro de openapi/v1.yaml. No editar el
# contrato raíz desde este contexto. Las rutas reflejan routes/api/promise.php bajo /api/v1/channels.
openapi: 3.1.0
info:
  title: Logistics — Promise (fragment)
  version: v1
paths:
  /api/v1/channels/promises/available-slots:
    get:
      operationId: listAvailableSlots
      summary: List delivery slots with available capacity for a zone and date
      tags: [Promise]
      parameters:
        - name: zone_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date in Y-m-d format.
      responses:
        '200':
          description: Available slots for the zone and date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotCollection'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/channels/promises:
    post:
      operationId: quotePromise
      summary: Quote a delivery promise for a shipment in a given slot
      description: >
        Leaves the promise in QUOTED state (no capacity reserved). Returns 202 with the quote echo; the
        promise id is exposed once the command returns it (see integration note in the controller).
      tags: [Promise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotePromiseRequest'
      responses:
        '202':
          description: Promise quoted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QuotedPromise'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /api/v1/channels/promises/{promiseId}:
    get:
      operationId: getPromise
      summary: Get a promise by id
      tags: [Promise]
      parameters:
        - $ref: '#/components/parameters/PromiseId'
      responses:
        '200':
          description: The promise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Promise'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/channels/promises/{promiseId}/reservation:
    post:
      operationId: reservePromise
      summary: Reserve capacity for a quoted promise during a TTL window
      tags: [Promise]
      parameters:
        - $ref: '#/components/parameters/PromiseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservePromiseRequest'
      responses:
        '200':
          description: Promise reserved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Promise'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
    delete:
      operationId: expireReservation
      summary: Expire a promise reservation and release its capacity (channel abandon)
      tags: [Promise]
      parameters:
        - $ref: '#/components/parameters/PromiseId'
      responses:
        '204':
          description: Reservation expired; capacity released.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /api/v1/channels/promises/{promiseId}/confirmation:
    post:
      operationId: confirmPromise
      summary: Confirm a reserved promise within its reservation window
      tags: [Promise]
      parameters:
        - $ref: '#/components/parameters/PromiseId'
      responses:
        '200':
          description: Promise confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Promise'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /api/v1/channels/delivery-slots:
    post:
      operationId: reserveDeliverySlot
      summary: Reserve a dispatch slot for an order (consume capacity and set the order's delivery slot)
      description: >
        Atomic and idempotent: within one transaction it consumes one delivery from the zone capacity for
        the given date and window and sets that delivery slot on the shipment. Re-posting the exact same
        slot for the same order is a no-op (no extra capacity consumed). Responds 422 when capacity is
        exhausted, 404/422 when the order cannot take the slot.
      tags: [Promise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveDeliverySlotRequest'
      responses:
        '200':
          description: Slot reserved and assigned to the order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReservedDeliverySlot'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /api/v1/channels/promises/delivery:
    get:
      operationId: listMunicipalityDeliveryPromise
      summary: List available delivery slots for a customer's municipality (K-05)
      description: >
        Given a municipality, a coordinate (latitude + longitude) or a shipment, returns the dates and
        time slots available for dispatch in that municipality (coverage + capacity + holidays + horizon).
        No PII. Supports optional offset/cursor pagination (E-02); without pagination params the full
        collection is returned with meta.count.
      tags: [Promise]
      parameters:
        - name: municipality_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: shipment_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: latitude
          in: query
          required: false
          schema:
            type: number
        - name: longitude
          in: query
          required: false
          schema:
            type: number
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: horizon_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Available delivery slots for the resolved municipality.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalitySlotCollection'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/channels/shipments/slot-reservation:
    post:
      operationId: reserveMunicipalitySlot
      summary: Reserve a delivery slot for a shipment in its municipality (K-03)
      description: >
        Atomic and idempotent: resolves the shipment's municipality, validates the day, consumes the
        municipality capacity and fixes the slot on the shipment. Slot taken → 409, day not dispatchable
        → 422, shipment not found → 404.
      tags: [Promise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveMunicipalitySlotRequest'
      responses:
        '201':
          description: Slot reserved for the shipment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReservedMunicipalitySlot'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRuleError'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    PromiseId:
      name: promiseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Promise identifier (UUID v7).
  schemas:
    Promise:
      type: object
      required: [id, shipment_ref, zone_id, slot_date, time_slot, status, reserved_until]
      properties:
        id:
          type: string
          format: uuid
        shipment_ref:
          type: string
        zone_id:
          type: string
        slot_date:
          type: string
          format: date
        time_slot:
          type: string
        status:
          type: string
          enum: [QUOTED, RESERVED, CONFIRMED, EXPIRED]
        reserved_until:
          type: [string, 'null']
          format: date-time
          description: RFC 3339 instant until which the reservation holds; null when not reserved.
    QuotedPromise:
      type: object
      required: [shipment_ref, zone_id, slot_date, time_slot, status]
      properties:
        shipment_ref:
          type: string
        zone_id:
          type: string
        slot_date:
          type: string
          format: date
        time_slot:
          type: string
        status:
          type: string
          enum: [QUOTED]
    AvailableSlot:
      type: object
      required: [slot_date, time_slot]
      properties:
        slot_date:
          type: string
          format: date
        time_slot:
          type: string
    AvailableSlotCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSlot'
        meta:
          type: object
          properties:
            count:
              type: integer
    QuotePromiseRequest:
      type: object
      required: [shipment_ref, zone_id, slot_date, time_slot]
      properties:
        shipment_ref:
          type: string
          maxLength: 64
        zone_id:
          type: string
          maxLength: 64
        slot_date:
          type: string
          format: date
        time_slot:
          type: string
          maxLength: 32
    ReservePromiseRequest:
      type: object
      required: [ttl_minutes]
      properties:
        ttl_minutes:
          type: integer
          minimum: 1
          maximum: 1440
    ReserveDeliverySlotRequest:
      type: object
      required: [order_id, zone_id, date, window_start, window_end]
      properties:
        order_id:
          type: string
          format: uuid
          description: Shipment (order) identifier.
        zone_id:
          type: string
          maxLength: 64
        date:
          type: string
          format: date
        window_start:
          type: string
          description: Window start in HH:MM (24h).
          example: "08:00"
        window_end:
          type: string
          description: Window end in HH:MM (24h).
          example: "12:00"
    ReservedDeliverySlot:
      type: object
      required: [order_id, zone_id, delivery_date, delivery_window_start, delivery_window_end]
      properties:
        order_id:
          type: string
          format: uuid
        zone_id:
          type: string
        delivery_date:
          type: string
          format: date
        delivery_window_start:
          type: string
        delivery_window_end:
          type: string
    MunicipalitySlot:
      type: object
      required: [municipality_id, slot_date, time_slot, available]
      properties:
        municipality_id:
          type: string
        slot_date:
          type: string
          format: date
        time_slot:
          type: string
        available:
          type: number
    MunicipalitySlotCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MunicipalitySlot'
        meta:
          type: object
          description: count (no pagination) or offset/cursor pagination metadata (E-02).
    ReserveMunicipalitySlotRequest:
      type: object
      required: [shipment_id, date, window_start, window_end]
      properties:
        shipment_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        window_start:
          type: string
          example: "09:00"
        window_end:
          type: string
          example: "13:00"
        municipality_id:
          type: string
          maxLength: 64
        latitude:
          type: number
        longitude:
          type: number
    ReservedMunicipalitySlot:
      type: object
      required: [shipment_id, delivery_date, delivery_window_start, delivery_window_end, status]
      properties:
        shipment_id:
          type: string
          format: uuid
        delivery_date:
          type: string
          format: date
        delivery_window_start:
          type: string
        delivery_window_end:
          type: string
        status:
          type: string
          example: reserved
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BusinessRuleError:
      description: Business rule violation (no capacity, invalid transition, expired reservation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
