# ============================================================
# Nginx server block — logistics (dev)
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Ocultar versión de nginx (anti-detección platform)
    server_tokens off;

    # Headers de seguridad base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    charset utf-8;

    # DNS embebido de Docker: permite RE-RESOLVER el contenedor `app` si se recrea (p. ej. un
    # `docker compose up -d` que recrea app pero no nginx). Sin esto, nginx cachea la IP de `app` al
    # arrancar y da 502 cuando app cambia de IP. Con el resolver + upstream por variable (ver abajo),
    # nginx re-resuelve y el stack queda turnkey en cualquier `up`.
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Si un nombre no resuelve (p. ej. el servicio de telemetría detenido), fallar rápido en vez de esperar
    # los 30 s por defecto: así el respaldo al monolito entra enseguida.
    resolver_timeout 2s;

    client_max_body_size 64M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ------------------------------------------------------------
    # Compresión HTTP (M-4 auditoría)
    # ------------------------------------------------------------
    # El JSON de la API y el HTML/CSS/JS de Filament viajaban SIN comprimir. gzip
    # está en el core de nginx (siempre disponible); brotli requiere un módulo que
    # NO trae la imagen oficial `nginx:alpine`, así que se deja gzip (y, en prod, se
    # recomienda brotli en el LB/CDN de borde). comp_level 5 = buen equilibrio
    # CPU/ratio. gzip_min_length evita comprimir respuestas diminutas (overhead).
    # gzip_vary añade `Vary: Accept-Encoding` para caches/CDN intermedias.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    # `text/html` NO se lista: nginx SIEMPRE lo comprime y repetirlo lanza un warning.
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/manifest+json
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Rutas Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # ------------------------------------------------------------
    # Servicio de telemetría (Ola 6): unidad de despliegue propia
    # ------------------------------------------------------------
    # /api/v1/app/telemetry/* y /api/v1/integrations/telemetry/* van al servicio `telemetry-api` (misma
    # imagen, APP_SERVICE_ROLE=telemetry, pool FPM propio): la ingesta de pings GPS deja de competir por
    # los workers FPM del resto de la app y se escala por separado (`--scale telemetry-api=N`: el DNS de
    # Docker devuelve las N direcciones y nginx reparte).
    #
    # Upstream por VARIABLE + `resolver` (igual que `app`): re-resuelve si el contenedor se recrea.
    # Si la unidad no existe, está caída o reiniciando (502/503/504 o nombre sin resolver), el request cae
    # al monolito (@telemetry_fallback), que sirve las mismas rutas: nunca se pierde un lote de pings por
    # un deploy o una caída del servicio. El cuerpo ya leído se reenvía tal cual.
    location ~ ^/api/v1/(app|integrations)/telemetry(/|$) {
        set $upstream_telemetry telemetry-api:9000;
        # Front controller directo (no hay estáticos bajo estas rutas). El `rewrite ... break` deja
        # $fastcgi_script_name en /index.php sin tocar REQUEST_URI (que lleva la ruta original).
        rewrite ^ /index.php break;
        fastcgi_pass $upstream_telemetry;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;

        # Requests cortos (validar + encolar): si la unidad no contesta rápido, se pasa al monolito.
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Un lote de 500 lecturas pesa decenas de KB: el cuerpo queda en memoria.
        client_max_body_size 2M;
        client_body_buffer_size 256k;

        error_page 502 503 504 = @telemetry_fallback;
    }

    location @telemetry_fallback {
        set $upstream_app app:9000;
        rewrite ^ /index.php break;
        fastcgi_pass $upstream_app;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 65s;
        fastcgi_send_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # PHP-FPM upstream (container app)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Upstream por VARIABLE para forzar la re-resolución vía el `resolver` de arriba (si se usara
        # `fastcgi_pass app:9000;` literal, nginx fija la IP al arrancar y da 502 si app se recrea).
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Timeouts ALINEADOS (B-1 auditoría): PHP max_execution_time=60s y FPM
        # request_terminate_timeout=60s matan el worker a los 60s. nginx esperaba 300s
        # por un proceso ya muerto. Se deja 65s = un pelo por encima del tope de PHP,
        # para que nginx reciba el error/cierre de FPM (502/504 limpio) en vez de
        # cortar antes. Si se suben los timeouts de PHP/FPM, subir este en consonancia.
        fastcgi_read_timeout 65s;
        fastcgi_send_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Bloquear acceso a archivos ocultos (excepto .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear acceso directo a directorios internos Laravel. `storage` NO
    # va acá: `root` ya está fijado a `public/`, así que `/storage/...` en
    # una URL SIEMPRE resuelve al symlink público `public/storage ->
    # storage/app/public` (creado por `artisan storage:link`) — jamás puede
    # exponer el `storage/` real del proyecto (fuera de `public/`, nginx no
    # puede alcanzarlo). Bloquearlo acá rompía toda imagen subida por un
    # admin (FileUpload de Filament, ADR 025) con 404 aunque el archivo
    # existiera en disco y Laravel lo sirviera bien — bug real encontrado
    # verificando los widgets del Page Builder.
    # Librerías de mapa AUTO-HOSPEDADAS (Leaflet / Leaflet-Geoman) viven en
    # public/vendor/{leaflet,leaflet-geoman}/ y son estáticas y públicas (política
    # CERO-CDN: no se cargan de unpkg). Se sirven ANTES del deny de /vendor de abajo,
    # que es demasiado amplio para este layout: el `vendor/` de composer está FUERA de
    # `public/` (root), así que nunca fue alcanzable por URL; el deny solo rompía estos
    # assets públicos. Se permite únicamente estas dos librerías, no todo /vendor.
    location ~ ^/vendor/(leaflet|leaflet-geoman)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(vendor|bootstrap/cache|node_modules) {
        deny all;
        return 404;
    }

    # Assets estáticos con cache largo (versión hash via Vite).
    # IMPORTANTE: cae a Laravel (index.php) si el archivo no existe, en vez de
    # 404 duro — varias rutas .js/.css son dinámicas, generadas por PHP, no
    # archivos reales en public/ (ej. /livewire/livewire.js de Livewire, que
    # sirve el JS vía una Route, no un archivo publicado). Un try_files con
    # "=404" interceptaba esas rutas ANTES de llegar a PHP-FPM, rompiendo toda
    # interactividad de Livewire/Filament (login, etc.) sin ningún error
    # visible del lado de Laravel — el request nunca llegaba.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|woff|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
