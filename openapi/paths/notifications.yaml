# Fragmento OpenAPI del contexto notifications (ADR 006).
#
# Lo integra un integrador en openapi/v1.yaml. No editar v1.yaml aquí.
# Las tres puertas comparten estos paths bajo /api/v1/<puerta>/...; el envío real sale por outbox,
# por eso encolar/escalar responden 202.

paths:
  /app/notifications:
    get:
      tags: [notifications]
      summary: List a shipment's notifications (internal app)
      description: >
        Returns the notification log of a shipment, newest first. App gate (operations/support
        visibility). The shipment id is passed as a query parameter.
      operationId: appListShipmentNotifications
      parameters:
        - name: shipment_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification log of the shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /channels/shipments/{shipment}/notifications:
    get:
      tags: [notifications]
      summary: List a shipment's notifications (customer channels)
      description: >
        Returns the notification history of a shipment, newest first. Channels gate (customer web /
        call center). The shipment id is a path parameter.
      operationId: channelsListShipmentNotifications
      parameters:
        - name: shipment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification history of the shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /integrations/notifications:
    post:
      tags: [notifications]
      summary: Queue a notification for a shipment
      description: >
        Integrations gate (service credentials). Queues a customer notification for a shipment; the
        message type resolves the channel cascade. Delivery happens asynchronously via the outbox,
        so the response is 202 Accepted.
      operationId: integrationsQueueNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueNotificationRequest'
      responses:
        '202':
          description: Notification accepted and queued for dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedNotificationEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /integrations/notifications/{notification}/advance-cascade:
    post:
      tags: [notifications]
      summary: Advance a notification's channel cascade
      description: >
        Integrations gate. Called by the outbox relay or an open/delivery callback to escalate the
        notification to the next channel when the current one was not opened. Processed via the
        outbox, so the response is 202 Accepted.
      operationId: integrationsAdvanceCascade
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Cascade advance accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceCascadeEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/notifications/all:
    get:
      tags: [notifications]
      summary: List the global notification log (internal app)
      description: >
        Returns the latest notifications across the whole operation, newest first. App gate.
      operationId: appListNotifications
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Global notification log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'

  /app/notifications/{notification}:
    get:
      tags: [notifications]
      summary: Get a single notification (internal app)
      operationId: appGetNotification
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationView'
        '404':
          description: Notification not found.

  /app/notifications/{notification}/suppress:
    post:
      tags: [notifications]
      summary: Suppress a queued notification (internal app)
      description: >
        App gate. Suppresses a queued notification so it no longer walks the cascade. Responds 202.
      operationId: appSuppressNotification
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Notification suppressed.

  /app/notification-rules:
    get:
      tags: [notifications]
      summary: List the cascade rule per message type (internal app)
      operationId: appListNotificationRules
      responses:
        '200':
          description: Effective cascade rule for every message type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageTypeRule'
    put:
      tags: [notifications]
      summary: Configure the cascade of a message type (internal app)
      operationId: appSetNotificationRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMessageTypeRuleRequest'
      responses:
        '200':
          description: Rule saved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MessageTypeRule'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/notification-templates:
    get:
      tags: [notifications]
      summary: List message templates (internal app)
      operationId: appListMessageTemplates
      responses:
        '200':
          description: All defined message templates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageTemplate'
    put:
      tags: [notifications]
      summary: Create or update a message template (internal app)
      operationId: appUpsertMessageTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMessageTemplateRequest'
      responses:
        '200':
          description: Template saved.
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/notification-sms-budget:
    get:
      tags: [notifications]
      summary: Get the monthly SMS budget (internal app)
      description: >
        App gate. Returns the SMS budget of a period (YYYY-MM); defaults to the current month.
      operationId: appGetSmsBudget
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: SMS budget of the period.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SmsBudget'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  responses:
    ValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    MessageType:
      type: string
      enum: [EN_ROUTE, ARRIVING, DELIVERED, FAILED, CONFIRM_LOCATION]
      description: Shipment fact that triggers a notification.

    Channel:
      type: string
      enum: [PUSH_NTFY, WEB_PUSH, TELEGRAM, EMAIL, SMS]
      description: Delivery channel; the cascade walks them in cost order (all open-source transports).

    NotificationStatus:
      type: string
      enum: [QUEUED, SENT, FAILED, SUPPRESSED]

    QueueNotificationRequest:
      type: object
      required: [shipment_id, message_type]
      properties:
        shipment_id:
          type: string
          format: uuid
        message_type:
          $ref: '#/components/schemas/MessageType'
        email:
          type: string
          format: email
          nullable: true
          description: Optional email fallback for the cascade.
        phone:
          type: string
          nullable: true
          maxLength: 32
          description: Optional phone fallback for the critical SMS step.

    NotificationView:
      type: object
      description: Read model of a notification (flat primitives).
      required: [id, shipment_id, message_type, status, current_channel, fcm_topic, channels, attempts]
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        message_type:
          $ref: '#/components/schemas/MessageType'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        current_channel:
          $ref: '#/components/schemas/Channel'
        fcm_topic:
          type: string
          description: FCM topic of the shipment (primary and web-push channel).
        channels:
          type: array
          description: Policy channels, in cascade order.
          items:
            $ref: '#/components/schemas/Channel'
        attempts:
          type: object
          description: Attempts per channel.
          additionalProperties:
            type: integer

    NotificationListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationView'

    QueuedNotificationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [shipment_id, message_type, status]
          properties:
            shipment_id:
              type: string
              format: uuid
            message_type:
              $ref: '#/components/schemas/MessageType'
            status:
              type: string
              example: accepted

    AdvanceCascadeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [notification_id, status]
          properties:
            notification_id:
              type: string
              format: uuid
            status:
              type: string
              example: accepted

    EscalateCondition:
      type: string
      enum: [NO_OPEN, ON_FAILURE]
      description: Condition that triggers the jump to the next cascade channel.

    MessageTypeRule:
      type: object
      description: Effective cascade rule for a message type (P1-NOT-01).
      required: [message_type, channels, escalate_when, customized]
      properties:
        message_type:
          $ref: '#/components/schemas/MessageType'
        channels:
          type: array
          description: Policy channels, in cascade order.
          items:
            $ref: '#/components/schemas/Channel'
        escalate_when:
          $ref: '#/components/schemas/EscalateCondition'
        customized:
          type: boolean
          description: True when the operator overrode the ADR 006 default for this type.

    SetMessageTypeRuleRequest:
      type: object
      required: [message_type, channels, escalate_when]
      properties:
        message_type:
          $ref: '#/components/schemas/MessageType'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        escalate_when:
          $ref: '#/components/schemas/EscalateCondition'

    MessageTemplate:
      type: object
      description: Message template for a type, channel and locale (P1-NOT-08).
      required: [id, message_type, channel, locale, body]
      properties:
        id:
          type: string
          format: uuid
        message_type:
          $ref: '#/components/schemas/MessageType'
        channel:
          $ref: '#/components/schemas/Channel'
        locale:
          type: string
          example: es
        subject:
          type: string
          nullable: true
          description: Only used by the email channel.
        body:
          type: string
          description: Body text with {{variable}} placeholders.

    UpsertMessageTemplateRequest:
      type: object
      required: [message_type, channel, body]
      properties:
        message_type:
          $ref: '#/components/schemas/MessageType'
        channel:
          $ref: '#/components/schemas/Channel'
        locale:
          type: string
          nullable: true
          default: es
        subject:
          type: string
          nullable: true
        body:
          type: string

    SmsBudget:
      type: object
      description: Monthly SMS budget (P1-NOT-05).
      required: [period, sent, cap, remaining]
      properties:
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
        sent:
          type: integer
        cap:
          type: integer
        remaining:
          type: integer
