            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /app/auth/password/reset:
    post:
      tags:
      - auth
      operationId: appPasswordReset
      summary: Reset the password with the emailed OTP (gate /app)
      description: >-
        Endpoint público (rate limited). Reinicia la contraseña del usuario validando el código OTP
