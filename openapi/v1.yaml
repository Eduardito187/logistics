      properties:
        origin:
          type: string
          maxLength: 64
          description: Nodo de origen
        destination:
          type: string
          maxLength: 64
          description: Nodo de destino
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmitLabelLine'
    EmitLabelsByOrderRequest:
      type: object
      description: >-
        Cuerpo OPCIONAL del POST de etiquetas por la app. Si se envía con `origin` + `destination` + `lines`,
        se emite ese lote explícito (igual que EmitLabelsRequest). Si se envía VACÍO (o solo con `origin`
        como escape hatch), el backend emite por ORDEN: deriva origen, destino y líneas de los envíos del
        pedido y del plan publicado, y emite solo las líneas AUTORIZADAS (con plan publicado) y aún
        PENDING. El valor de `origin` del QR lo fija el backend (no es contrato con la app); este campo
        solo lo impone cuando el integrador ya conoce el CD de origen.
      properties:
        origin:
          type: string
          maxLength: 64
          nullable: true
          description: Nodo de origen (opcional; si se omite, el backend lo deriva por envío)
        destination:
          type: string
          maxLength: 64
          nullable: true
          description: Nodo de destino (opcional; requerido solo para el lote explícito)
        lines:
          type: array
          nullable: true
          description: Líneas del lote explícito (opcional; si se omite, se derivan del pedido)
          items:
            $ref: '#/components/schemas/EmitLabelLine'
    EmittedLabel:
      type: object
      required:
      - order_number
      - label_id
      - key_id
      - sku
      - line_number
      - qr_content
      - zpl
      - emitted_at
      properties:
        order_number:
          type: string
        label_id:
          type: string
          description: Identidad de negocio (campo `id` del payload), única por producto físico
        key_id:
          type: integer
          description: Clave con la que se firmó (campo `k` del QR)
        sku:
          type: string
        line_number:
          type: integer
        qr_content:
          type: string
          description: JSON firmado exacto que lleva el QR
        zpl:
          type: string
          description: Representación ZPL para la impresora Zebra
        emitted_at:
          type: integer
          description: Marca de tiempo de emisión (epoch en segundos). Las etiquetas son permanentes.
        product_name:
          type: string
          nullable: true
          description: >-
            Nombre humano del producto, resuelto por SKU (líneas del envío / catálogo). null si no se pudo
            resolver.
        image_url:
          type: string
          nullable: true
          description: >-
            URL servible ABSOLUTA de la imagen del producto (resuelta por SKU). null si no hay imagen.
        origin:
          type: object
          required:
          - code
          - name
          description: Origen de despacho. `code` es el código embebido en el QR; `name` es el nombre de nodo si el código matchea la red.
          properties:
            code:
              type: string
              description: Código de origen del QR (free-form; suele ser un code de nodo)
            name:
              type: string
              nullable: true
              description: Nombre humano del nodo de origen si `code` matchea network; si no, null (mostrar name ?? code)
        destination:
          type: object
          required:
          - type
          - name
          - address
          description: Destino del envío de la orden (nombres humanos, sin uuid).
          properties:
            type:
              type: string
              nullable: true
              enum:
              - home
              - store
              - warehouse
              description: >-
                home = domicilio del cliente; store = tienda/punto de retiro; warehouse = centro de
                distribución/almacén. null si no se pudo determinar el envío.
            name:
              type: string
              nullable: true
              description: Nombre del destino (cliente en home; nombre del nodo en store/warehouse)
            address:
              type: string
              nullable: true
              description: Dirección (solo en home; null en nodo)
        unit_id:
          type: string
          nullable: true
          description: >-
            UUID del PRODUCTO FÍSICO (shipment_units) de esta etiqueta, resuelto por correlación. La app mapea
            label_id→unit_id localmente (offline) para escanear. Mismo valor que UnitTracking.unit_id. null
            si no se pudo atar.
        shipment_id:
          type: string
          nullable: true
          description: UUID del envío del producto (opaco), o null
        unit:
          type: object
          required:
          - index
          - total
          properties:
            index: { type: integer }
            total: { type: integer }
        piece:
          type: object
          required:
          - index
          - total
          properties:
            index: { type: integer }
            total: { type: integer }
    LabelUnitResolution:
      type: object
      description: Resolución de una etiqueta escaneada (ULID) al producto físico + envío (fallback online).
      required:
      - label_id
      - resolved
      - unit_id
      - shipment_id
      - sku
      - product_name
      - line_number
      - unit
      - piece
      properties:
        label_id: { type: string }
        resolved: { type: boolean }
        unit_id: { type: string, nullable: true }
        shipment_id: { type: string, nullable: true }
        sku: { type: string, nullable: true }
        product_name: { type: string, nullable: true }
        line_number: { type: integer, nullable: true }
        unit:
          type: object
          nullable: true
          properties: { index: { type: integer }, total: { type: integer } }
        piece:
          type: object
          nullable: true
          properties: { index: { type: integer }, total: { type: integer } }
    NetworkPrinter:
      type: object
      description: |
        Impresora de red registrada centralmente (admin → Configuración → Impresoras de red). La app la
        ofrece en "Impresoras de tu sede" y le imprime directo por TCP (host:port, RAW 9100 en Zebra).
      required:
      - id
      - name
      - model
      - host
      - port
      - language
      - node_id
      - node_name
      - location
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Zebra Andén 2 }
        model: { type: string, nullable: true, example: ZT411 }
        host: { type: string, description: IP o hostname alcanzable desde la red de la sede, example: 192.168.2.50 }
        port: { type: integer, minimum: 1, maximum: 65535, example: 9100 }
        language: { type: string, enum: [zpl, other] }
        node_id: { type: string, format: uuid, nullable: true, description: Nodo de red (sede); null = compartida }
        node_name: { type: string, nullable: true, description: Nombre legible de la sede }
        location: { type: string, nullable: true, example: Andén 2 }
    EnqueueStockTransferRequest:
      type: object
      required:
      - event_id
      - shipment_ref
      - sku
      - quantity
      properties:
        event_id:
          type: string
          maxLength: 64
          description: Identificador de la recepción que origina el traspaso (respalda la idempotencia)
        shipment_ref:
          type: string
          maxLength: 64
        sku:
          type: string
          maxLength: 64
          description: SKU propio de la plataforma (el conector lo traduce a la coordenada SAP)
        quantity:
          type: integer
          minimum: 1
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    EscalateCondition:
      type: string
      enum:
      - NO_OPEN
      - ON_FAILURE
      description: Condition that triggers the jump to the next cascade channel.
    DeliveryEvidence:
      type: object
      description: >-
        Evidencia de entrega ligada al cliente con su estado de validación anti-fraude. El `sha256` fija la
        integridad del archivo (una evidencia no se puede intercambiar por otra). `validation_status` es una
        señal, no un bloqueo.
      required:
      - id
      - shipment_id
      - kind
      - validation_status
      - sha256
      - storage
      - customer
      - location
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - pod
          - damage
          - signature
          - id_document
        validation_status:
          type: string
          enum:
          - pending
          - ok
          - review
          - mismatch
        validation_detail:
          type: string
          nullable: true
        sha256:
          type: string
          description: Hash SHA-256 del archivo (64 hex) — integridad de la evidencia
        storage:
          type: object
          properties:
            disk:
              type: string
            path:
              type: string
        customer:
          type: object
          description: Snapshot de la identidad del cliente contra el que se valida la evidencia
          properties:
            id:
              type: string
              nullable: true
            document_id:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
        location:
          type: object
          properties:
            lat:
              type: number
              nullable: true
            lng:
              type: number
              nullable: true
        captured_at:
          type: string
          format: date-time
          nullable: true
        validated_at:
          type: string
          format: date-time
          nullable: true
    DeliveryEvidenceCollection:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryEvidence'
    ExecutionError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    ExpiringDocument:
      type: object
