  /app/vehicles/{vehicleId}/route:
    get:
      tags:
      - execution
      operationId: getDriverRoute
      summary: Driver route — the ordered stops of a vehicle for the day (my route)
      description: >
        Returns the driver route sheet: the ordered sequence of stops with what to drop at each one,
        the current stop (next pending) and how many stops remain. With ?date it returns that day's
        route; without it, the vehicle's open route in progress.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - name: date
        in: query
        required: false
        description: Route day (Y-m-d); omit for the vehicle's open route
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The driver route
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DriverRoute'
        '404':
          description: No route assembled for this vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionError'
      security:
      - appBearer: []
    post:
      tags:
      - execution
      operationId: assembleDailyRoute
      summary: Assemble the driver route of the day from the published plan stops
      description: >-
        Assembles the driver route of the day. The backend builds the ordered stops FROM THE PUBLISHED
        PLAN (planning); the client only chooses the date. Send the body WITHOUT `stops` (or with an empty
        array) to assemble from the plan. `stops` is optional and only needed to override with an explicit
        list. If there is no published plan for the vehicle on that date, responds 422.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - route_date
              properties:
                route_date:
                  type: string
                  format: date
                stops:
                  type: array
                  nullable: true
                  description: >-
                    Optional. Omit (or send []) to assemble from the published plan. If provided, these
                    explicit stops are used instead.
                  items:
                    type: object
                    required:
                    - shipment_id
                    - sequence
                    properties:
                      shipment_id:
                        type: string
                        format: uuid
                      sequence:
                        type: integer
                        minimum: 1
                      order_reference:
                        type: string
                        nullable: true
                      customer_name:
                        type: string
                        nullable: true
                      address:
                        type: string
                        nullable: true
                      eta_at:
                        type: string
                        format: date-time
                        nullable: true
                      lat:
                        type: number
                        format: float
                        nullable: true
                      lng:
                        type: number
                        format: float
                        nullable: true
      responses:
        '201':
          description: The assembled driver route
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DriverRoute'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /channels/delivery-slots:
    post:
      tags:
      - Promise
      operationId: reserveDeliverySlot
      summary: Reserve a dispatch slot for an order (consume capacity and set the order's delivery slot)
      description: >
        Atomic and idempotent: within one transaction it consumes one delivery from the zone capacity for
        the given date and window and sets that delivery slot on the shipment. Re-posting the exact same
        slot for the same order is a no-op (no extra capacity consumed). Responds 422 when capacity is
        exhausted, 404/422 when the order cannot take the slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveDeliverySlotRequest'
      responses:
        '200':
          description: Slot reserved and assigned to the order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReservedDeliverySlot'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
      security:
      - channelApiKey: []
  /app/telemetry/pings:
    post:
      tags:
      - telemetry
      summary: Ingest a batch of vehicle GPS pings from the internal app
      operationId: recordAppVehiclePings
      description: |
        El app agrupa lecturas GPS para ahorrar batería/datos y las envía en lote. El origen queda fijado como 'app' por la puerta. La respuesta es un acuse 202 (el procesamiento es asíncrono vía outbox).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - vehicle_id
              - pings
              properties:
                vehicle_id:
                  type: string
                driver_id:
                  type: string
                  nullable: true
                route_id:
                  type: string
                  nullable: true
                pings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/VehiclePing'
      responses:
        '202':
          description: >-
            All fixes accepted or duplicate. Idempotent per fix (fix_id, else device_id + recorded_at); out-of-order
            fixes are stored for the trace without moving the live position. Feeds live position, trips, alerts,
            breadcrumbs/ETA and the per-shipment tracking position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingBatchResultEnvelope'
        '207':
          description: Partial success (some fixes rejected; see results[].errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingBatchResultEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - appBearer: []
