        tax_id:
          type: [string, 'null']
    CommerceAddAddressRequest:
      type: object
      required: [label, recipient, line1, city]
      properties:
        label:
          type: string
        recipient:
          type: string
        line1:
          type: string
        line2:
          type: [string, 'null']
        city:
          type: string
        state:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        is_default:
          type: boolean

  parameters:
    CommerceAccountId:
      name: account
      in: path
      required: true
      description: Account id.
      schema:
        type: string
        format: uuid

    CommerceCartId:
      name: cart
      in: path
      required: true
      description: Cart id.
      schema:
        type: string
        format: uuid
    CommerceCartSku:
      name: sku
      in: path
      required: true
      description: Line SKU within the cart.
      schema:
        type: string

    PageNumber:
      name: page
      in: query
      required: false
      description: >-
        1-based page number for offset pagination (E-02). When present, the response is sliced and a
        `meta` object is added. Omitting all pagination params returns the full collection unchanged.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Page size for offset or cursor pagination (max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor for cursor pagination (E-02), taken from a previous response's
        `meta.next_cursor`. Preferred over `page` for large, growing collections.
      schema:
        type: string
    GeofenceId:
      name: geofenceId
      in: path
      required: true
      description: UUID v7 de la geocerca
      schema:
        type: string
        format: uuid
    CapacityDate:
      name: date
      in: query
      required: true
      description: Slot date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    CapacityMunicipalityId:
      name: municipality_id
      in: query
      required: false
      description: Municipality (coverage area) that owns the bucket. Exactly one of municipality_id/zone_id/node_id must be provided. The municipality is the primary axis of capacity management.
      schema:
        type: string
        format: uuid
    CapacityNodeId:
      name: node_id
      in: query
      required: false
      description: Node that owns the bucket. Exactly one of municipality_id/zone_id/node_id must be provided.
      schema:
        type: string
        format: uuid
    CapacityTimeSlot:
      name: time_slot
      in: query
      required: true
      description: Time slot within the same day, HH:MM-HH:MM.
      schema:
        type: string
        pattern: ^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$
        example: 09:00-13:00
    CapacityUnit:
      name: unit
      in: query
      required: true
      description: Capacity unit of the bucket.
      schema:
        $ref: '#/components/schemas/CapacityUnit'
    CapacityZoneId:
      name: zone_id
      in: query
      required: false
      description: Zone that owns the bucket. Exactly one of municipality_id/zone_id/node_id must be provided.
      schema:
        type: string
        format: uuid
    CarrierId:
      name: carrierId
      in: path
      required: true
      description: UUID v7 del transportista
      schema:
        type: string
        format: uuid
    ExecutionShipmentId:
      name: shipmentId
      in: path
      required: true
      description: Shipment UUID
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Offline idempotency key for the scan; a resend with the same key does not duplicate the fact.
        REQUIRED for every write scan: send it here or in the body field idempotency_key. A write with
        neither is rejected with 422.
      schema:
        type: string
        maxLength: 128
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      description: Número de pedido
      schema:
        type: string
    OutboxMessageId:
      name: id
      in: path
      required: true
      description: Outbox message id (UUID v7).
      schema:
        type: string
        format: uuid
    OutboxPage:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    OutboxPerPage:
      name: per_page
      in: query
      required: false
      description: Page size (max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    OutboxStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by message status.
      schema:
        $ref: '#/components/schemas/OutboxStatus'
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PromiseId:
      name: promiseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Promise identifier (UUID v7).
    SettingAt:
      name: at
      in: query
      required: false
      description: ISO 8601 date to read the value as of. Defaults to now.
      schema:
        type: string
        format: date-time
    SettingKey:
      name: key
      in: path
      required: true
      description: Namespaced setting key, e.g. coverage.default_service_days.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        example: coverage.default_service_days
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: UUID v7 de la liquidación
      schema:
        type: string
        format: uuid
    TrackingShipmentId:
      name: shipmentId
      in: path
      required: true
      description: UUID del envío
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      description: Vehicle UUID
      schema:
        type: string
        format: uuid
  responses:
    AppAuthValidationError:
      description: Credentials or payload failed validation (Laravel ValidationException shape).
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            - errors
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    BusinessRuleError:
      description: Business rule violation (no capacity, invalid transition, expired reservation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromiseError'
    CapacityValidationError:
      description: Input validation or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapacityError'
    CarriersNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeliveryState:
      description: The resulting delivery state after the scan
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Delivery'
    NodeReceptionState:
      description: The resulting node reception state with the reconciliation result
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/NodeReceptionView'
    DomainError:
      description: Business rule violated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExecutionValidationError:
      description: The request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExecutionError'
    FleetValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    NotificationsValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            - errors
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    OutboxNotFound:
      description: No outbox message exists with the requested id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/OutboxProblem'
    OutboxValidationError:
      description: Input validation or business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/OutboxProblem'
    PlanningNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanningError'
    PlanningValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanningError'
    PositionAccepted:
      description: Posición aceptada para proyección
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - shipment_id
                - accepted
                properties:
                  shipment_id:
                    type: string
                    format: uuid
                  accepted:
                    type: boolean
                    const: true
    PromiseNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromiseError'
    PromiseValidationError:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromiseError'
    SettingNotFound:
      description: No effective value exists for the key at the requested date
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SettingProblem'
    SettingValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SettingProblem'
