              maxItems: 2
              items:
                type: number
    GeoScanBase:
      type: object
      description: Campos comunes a todo escaneo en terreno
      required:
      - shipment_id
      - unit_id
      - lat
      - lng
      - occurred_at
      properties:
        shipment_id:
          type: string
          format: uuid
        unit_id:
          type: string
          maxLength: 64
          description: Producto escaneado
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        occurred_at:
          type: string
          format: date-time
          description: Momento del escaneo, fijado por la app en terreno (offline-first)
        device_id:
          type: string
          maxLength: 128
          description: Puede inyectarlo el token de Auth; opcional en el cuerpo
        user_id:
          type: string
          maxLength: 128
          description: Puede inyectarlo el token de Auth; opcional en el cuerpo
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: Clave de idempotencia; alternativa al header Idempotency-Key. Obligatoria por una de las dos vías; no puede ir vacía.
    Health:
      type: object
      required:
      - status
      - api_version
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        api_version:
          type: string
          example: v1
        checks:
          type: object
          required:
          - database
          - cache
          properties:
            database:
              type: boolean
              description: PostgreSQL reachable with PostGIS enabled
            cache:
              type: boolean
              description: Valkey reachable
    MyCrew:
      type: object
      description: >-
        The crew (driver + helpers) and vehicle assigned to the authenticated driver for a date.
        Read-only projection returned by fleetGetMyCrew.
      required: [crew_id, date, vehicle, driver, helpers, shift]
      properties:
        crew_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        vehicle:
          type: object
          description: >-
            Assigned vehicle. `id` is always present; the other fields are null when the vehicle
            master record cannot be resolved.
          required: [id, plate, capacity_kg, capacity_m3, status]
          properties:
            id:
              type: string
              format: uuid
            plate:
              type: string
              nullable: true
            capacity_kg:
              type: integer
              nullable: true
            capacity_m3:
              type: number
              format: float
              nullable: true
            status:
              type: string
              nullable: true
        driver:
          type: object
          description: The driver leading the crew. `name`/`license_number` are null when the driver record is missing.
          required: [id, name, license_number]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              nullable: true
            license_number:
              type: string
              nullable: true
        helpers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                nullable: true
        shift:
          type: object
          nullable: true
          description: Work-shift hours, or null when the crew was assembled without fixed hours.
          required: [starts_at, ends_at]
          properties:
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time

    Helper:
