      security:
      - channelApiKey: []

components:
  securitySchemes:
    appBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token Bearer por usuario y dispositivo emitido por Laravel Sanctum (puerta /app/*).
    channelApiKey:
      type: apiKey
      in: header
      name: X-Channel-Key
      description: Credencial por canal (app de clientes, web, call center) enviada en la cabecera X-Channel-Key
        (puerta /channels/*).
    serviceCredential:
      type: apiKey
      in: header
      name: X-Service-Credential
      description: Credencial de servicio para integraciones (SAP, transportistas, webhooks) enviada en la cabecera
        X-Service-Credential (puerta /integrations/*).
    integrationToken:
      type: http
      scheme: bearer
      bearerFormat: Integration
      description: Token de integración de la plataforma (prefix.secret) enviado como Bearer y validado por
        el middleware access.token. Convive con serviceCredential en la puerta /integrations/*.
  schemas:
    Seller:
      type: object
      required:
      - id
      - legal_name
      - tax_id
      - status
      - contact
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        tax_id:
          type: string
        status:
          type: string
          enum:
          - onboarding
          - active
          - suspended
        contact:
          $ref: '#/components/schemas/SellerContact'
