            count:
              type: integer
    NodeEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Node'
    NodeReceptionRequest:
      allOf:
      - $ref: '#/components/schemas/GeoScanBase'
      - type: object
        required:
        - node_id
        properties:
          node_id:
            type: string
            format: uuid
    OpenNodeReceptionRequest:
      type: object
      description: Abre la recepción de un envío en un nodo destino por un corredor interno.
      required:
      - shipment_id
      - origin_node_id
      - destination_node_id
      - origin_node_kind
      - destination_node_kind
      - expected_unit_ids
      - occurred_at
      properties:
        shipment_id:
          type: string
          format: uuid
        origin_node_id:
          type: string
          format: uuid
        destination_node_id:
          type: string
          format: uuid
          description: Debe ser distinto del nodo de origen
        origin_node_kind:
          type: string
          enum:
          - CD
          - STORE
        destination_node_kind:
          type: string
          enum:
          - CD
          - STORE
        expected_unit_ids:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 64
          description: Bultos esperados en este nodo
        occurred_at:
          type: string
          format: date-time
    ReceiveUnitAtNodeRequest:
      allOf:
      - $ref: '#/components/schemas/GeoScanBase'
      - type: object
        required:
        - destination_node_id
        properties:
          destination_node_id:
            type: string
            format: uuid
            description: Nodo destino donde se recibe el bulto
    ReconcileNodeReceptionRequest:
      type: object
      description: Cierra la recepción conciliando lo recibido contra lo esperado.
      required:
      - shipment_id
      - destination_node_id
      - occurred_at
      properties:
        shipment_id:
          type: string
          format: uuid
        destination_node_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        device_id:
          type: string
          maxLength: 128
          description: Puede inyectarlo el token de Auth; opcional en el cuerpo
        user_id:
          type: string
          maxLength: 128
          description: Puede inyectarlo el token de Auth; opcional en el cuerpo
    NodeReceptionView:
      type: object
      description: Read model of a node reception (flat primitives) with the reconciliation result.
      required:
      - id
      - shipment_id
      - origin_node_id
      - destination_node_id
      - corridor
      - status
      - expected_unit_ids
      - received_unit_ids
      - missing_unit_ids
      - surplus_unit_ids
      - expected_count
      - received_count
      - complete
      - opened_at
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        origin_node_id:
          type: string
          format: uuid
        destination_node_id:
          type: string
          format: uuid
        corridor:
          type: string
          enum:
          - CD_TO_CD
          - CD_TO_STORE
          - STORE_TO_STORE
          - STORE_TO_CD
        status:
          type: string
          enum:
          - OPEN
          - RECONCILED
        expected_unit_ids:
          type: array
          items:
            type: string
        received_unit_ids:
          type: array
          items:
            type: string
        missing_unit_ids:
          type: array
          description: Bultos esperados que no se recibieron
          items:
            type: string
        surplus_unit_ids:
          type: array
          description: Bultos recibidos que no se esperaban
          items:
            type: string
        expected_count:
          type: integer
        received_count:
          type: integer
        complete:
          type: boolean
          description: Verdadero si no hay faltantes ni sobrantes
        opened_at:
          type: string
          format: date-time
        reconciled_at:
          type: string
          format: date-time
          nullable: true
        units:
          type: array
          description: Producto de cada bulto de la recepción (esperados ∪ recibidos ∪ sobrantes); campos null si el id no es un bulto conocido
          items:
            $ref: '#/components/schemas/NodeReceptionUnit'
    NodeReceptionUnit:
      type: object
      description: Bulto de una recepción en nodo con el producto que contiene (foto, nombre, SKU) y su posición "N de M"
      required:
      - unit_id
      - sku
      - product_name
      - product_image_url
      - unit_index
      - unit_total
      - piece_index
      - piece_total
      properties:
        unit_id:
          type: string
        sku:
          type:
          - string
          - 'null'
        product_name:
          type:
          - string
          - 'null'
        product_image_url:
          type:
          - string
          - 'null'
        unit_index:
          type:
          - integer
          - 'null'
        unit_total:
          type:
          - integer
          - 'null'
        piece_index:
          type:
          - integer
          - 'null'
        piece_total:
          type:
          - integer
          - 'null'
    NodeStatus:
      type: string
      enum:
      - active
      - inactive
    NodeType:
      type: string
      enum:
      - distribution_center
      - store
      - pickup_point
    OperationalCorridor:
      type: object
      description: |
        An operational corridor in a department: the insumo planning/promise use to know what can
        leave (and enter) that department. Inter-node corridors (cd_to_cd, cd_to_store,
        store_to_store, store_to_cd) carry an origin and a destination node; terminal corridors
        (cd_to_customer, store_pickup) end at the customer, so the destination fields are null.
      required:
      - corridor_type
      - department
      - origin_node_id
      - origin_node_code
      - origin_node_name
      - origin_node_type
      - destination_node_id
      - destination_node_code
      - destination_node_name
      - destination_node_type
      properties:
        corridor_type:
          $ref: '#/components/schemas/CorridorType'
        department:
          $ref: '#/components/schemas/Department'
        origin_node_id:
          type: string
          format: uuid
        origin_node_code:
          type: string
        origin_node_name:
          type: string
        origin_node_type:
          $ref: '#/components/schemas/NodeType'
        destination_node_id:
          type: string
          format: uuid
          nullable: true
        destination_node_code:
          type: string
          nullable: true
        destination_node_name:
          type: string
          nullable: true
        destination_node_type:
          allOf:
          - $ref: '#/components/schemas/NodeType'
          nullable: true
    OperationalCorridorCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OperationalCorridor'
        meta:
          type: object
          required:
          - count
          properties:
            count:
              type: integer
    NotificationListEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationView'
    NotificationStatus:
      type: string
      enum:
      - QUEUED
      - SENT
      - FAILED
      - SUPPRESSED
    NotificationView:
      type: object
      description: Read model of a notification (flat primitives).
      required:
      - id
      - shipment_id
      - message_type
      - status
      - current_channel
      - fcm_topic
      - channels
      - attempts
      properties:
        id:
