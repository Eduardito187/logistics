; ============================================================
; PHP-FPM pool config — logistics
; ============================================================

[www]
user = logistics
group = logistics

listen = 0.0.0.0:9000

; Ajustar según carga real (medir en Fase 4 con load test)
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping
ping.response = pong

; Logging
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Slowlog (queries lentas del lado PHP)
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Timeouts
request_terminate_timeout = 60s

; Enviar errores a stderr para que docker logs los capture
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
