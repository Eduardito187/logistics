        data:
          $ref: '#/components/schemas/Node'
    NodeReceptionRequest:
      allOf:
      - $ref: '#/components/schemas/GeoScanBase'
      - type: object
        required:
        - node_id
        properties:
          node_id:
            type: string
            format: uuid
    OpenNodeReceptionRequest:
      type: object
      description: >-
        Abre la recepción de un envío en un nodo destino por un corredor interno. Basta {shipment_id, occurred_at}:
        el servidor deriva origen, destino (destination_node_id del envío o el nodo del usuario), tipos de nodo y
        expected_unit_ids. El cuerpo completo anterior sigue aceptándose.
      required:
      - shipment_id
      - occurred_at
      properties:
        shipment_id:
          type: string
          format: uuid
        origin_node_id:
          type: string
          format: uuid
          nullable: true
        destination_node_id:
          type: string
          format: uuid
          nullable: true
          description: Debe ser distinto del nodo de origen
        origin_node_kind:
          type: string
          enum:
          - CD
          - STORE
        destination_node_kind:
          type: string
          enum:
          - CD
          - STORE
        expected_unit_ids:
          type: array
          nullable: true
          minItems: 1
          items:
            type: string
            maxLength: 64
          description: Productos esperados en este nodo
        occurred_at:
          type: string
          format: date-time
    ReceiveUnitAtNodeRequest:
      type: object
      description: Recepción de un producto en el nodo. Sin señal se omite la posición (nunca 0,0).
      required:
      - shipment_id
      - unit_id
      - destination_node_id
      - occurred_at
      properties:
        shipment_id:
          type: string
          format: uuid
        unit_id:
          type: string
          maxLength: 64
        destination_node_id:
          type: string
          format: uuid
          description: Nodo destino donde se recibe el producto
        lat:
          type: number
          format: double
          nullable: true
          description: Se manda junto con lng.
        lng:
          type: number
          format: double
          nullable: true
        location:
          $ref: '#/components/schemas/CapturedLocation'
        occurred_at:
          type: string
          format: date-time
        device_id:
          type: string
          maxLength: 128
        user_id:
          type: string
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    ReconcileNodeReceptionRequest:
      type: object
      description: Cierra la recepción conciliando lo recibido contra lo esperado.
      required:
      - shipment_id
      - destination_node_id
      - occurred_at
      properties:
        shipment_id:
          type: string
          format: uuid
        destination_node_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 2000
          nullable: true
        photo_path:
          type: string
          maxLength: 1024
          nullable: true
        missing:
          type: array
          maxItems: 1000
          items:
            type: object
            required:
            - unit_id
            - reason
            properties:
              unit_id:
                type: string
              reason:
                $ref: '#/components/schemas/MissingUnitReason'
        surplus:
          type: array
          maxItems: 1000
          items:
            type: object
            required:
            - unit_id
            properties:
              unit_id:
                type: string
              belongs_to_shipment_id:
                type: string
                format: uuid
                nullable: true
        device_id:
          type: string
          maxLength: 128
          description: Puede inyectarlo el token de Auth; opcional en el cuerpo
        user_id:
          type: string
          maxLength: 128
          description: Puede inyectarlo el token de Auth; opcional en el cuerpo
    NodeReceptionView:
      type: object
      description: Read model of a node reception (flat primitives) with the reconciliation result.
      required:
      - id
      - shipment_id
      - origin_node_id
      - destination_node_id
      - corridor
      - status
      - expected_unit_ids
      - received_unit_ids
      - missing_unit_ids
      - surplus_unit_ids
      - expected_count
      - received_count
      - complete
      - opened_at
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        origin_node_id:
          type: string
          format: uuid
        destination_node_id:
          type: string
          format: uuid
        corridor:
          type: string
          enum:
          - CD_TO_CD
          - CD_TO_STORE
          - STORE_TO_STORE
          - STORE_TO_CD
        status:
          type: string
          enum:
          - OPEN
          - RECONCILED
        expected_unit_ids:
          type: array
          items:
            type: string
        received_unit_ids:
          type: array
          items:
            type: string
        missing_unit_ids:
          type: array
          description: Productos esperados que no se recibieron
          items:
            type: string
        surplus_unit_ids:
          type: array
          description: Productos recibidos que no se esperaban
          items:
            type: string
        expected_count:
          type: integer
        received_count:
          type: integer
        complete:
          type: boolean
          description: Verdadero si no hay faltantes ni sobrantes
        opened_at:
          type: string
          format: date-time
        reconciled_at:
          type: string
          format: date-time
          nullable: true
        missing_count:
          type: integer
        surplus_count:
          type: integer
        reconciliation:
          type: object
          nullable: true
          description: Null while the reception is open.
          properties:
            notes:
              type: string
              nullable: true
            photo_path:
              type: string
              nullable: true
            missing:
              type: array
              items:
                type: object
                properties:
                  unit_id:
                    type: string
                  reason:
                    type: string
                    nullable: true
                    enum:
                    - not_arrived
                    - damaged
                    - wrong_store
                    - other
                    - null
            surplus:
              type: array
              items:
                type: object
                properties:
                  unit_id:
                    type: string
                  belongs_to_shipment_id:
                    type: string
                    format: uuid
                    nullable: true
        units:
          type: array
          description: Detalle de cada producto de la recepción (esperados ∪ recibidos ∪ sobrantes); campos null si el id no es un producto conocido
          items:
            $ref: '#/components/schemas/NodeReceptionUnit'
    NodeReceptionUnit:
      type: object
      description: Producto de una recepción en nodo (foto, nombre, SKU) y su posición "N de M"
      required:
      - unit_id
      - sku
      - product_name
      - product_image_url
