      description: |
        Ingesta de lecturas GPS de proveedores externos (dispositivos de terceros). El origen queda fijado como 'integration' por la puerta. La respuesta es un acuse 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - vehicle_id
              - pings
              properties:
                vehicle_id:
                  type: string
                driver_id:
                  type: string
                  nullable: true
                route_id:
                  type: string
                  nullable: true
                pings:
                  type: array
                  minItems: 1
