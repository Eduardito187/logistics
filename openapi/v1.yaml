  /integrations/evidence/{evidenceId}/validation:
    parameters:
    - name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - execution
      operationId: recordEvidenceValidation
      summary: Record the anti-fraud validation result of a delivery evidence
      description: |
        Lo llama el validador anti-fraude ASÍNCRONO (worker/sidecar on-premise) tras procesar la firma o el
        documento. Registra el estado (`ok` | `review` | `mismatch`) — es una SEÑAL, nunca bloquea la
        entrega; `review`/`mismatch` escalan a revisión humana. Dos modos: `status` explícito, o
        `ocr_document_number` para que el backend cruce el número leído contra el documento del cliente.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - ok
                  - review
                  - mismatch
                  nullable: true
                  description: Estado decidido por el validador (gana sobre ocr_document_number si viene)
                ocr_document_number:
                  type: string
                  nullable: true
                  description: Número de documento leído por OCR; el backend lo cruza contra el del cliente
                detail:
                  type: string
                  nullable: true
                validated_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Validation recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      evidence_id:
                        type: string
                      status:
                        type: string
