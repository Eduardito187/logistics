        version:
          type: integer
          minimum: 1
        value:
          type: object
          additionalProperties: true
        effective_from:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type:
          - string
          - 'null'
    Settlement:
      type: object
      required:
      - id
      - carrier_id
      - corridor_from
      - corridor_to
      - corridor_type
      - period
      - amount_cents
      - currency
      - reference
      - status
      - documents
      properties:
        id:
          type: string
          format: uuid
        carrier_id:
          type: string
          format: uuid
        carrier_name:
          type: string
          nullable: true
          description: Nombre legible del transportista (carriers.name); null si ya no existe
        corridor_from:
          type: string
        corridor_to:
          type: string
        corridor_type:
          $ref: '#/components/schemas/CorridorType'
        period:
          type: string
          example: 2026-10
        amount_cents:
          type: integer
        currency:
          type: string
        reference:
          type: string
        status:
          $ref: '#/components/schemas/SettlementStatus'
        dispute_reason:
          type: string
          nullable: true
        payment_reference:
          type: string
          nullable: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CarrierDocument'
    SettlementStatus:
      type: string
      enum:
      - submitted
      - approved
      - paid
      - disputed
    Shipment:
      type: object
      required:
      - id
      - source
      - external_id
      - customer_name
      - address_text
      - address_confidence_score
      - address_confidence_level
      - status
      - lines
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/OrderSource'
        external_id:
          type: string
        customer_name:
          type: string
        customer_document_id:
          type: string
          nullable: true
          description: Customer identity document (CI / NIT)
        customer_phone:
          type: string
          nullable: true
        customer_email:
          type: string
          format: email
          nullable: true
        address_text:
          type: string
        address_reference:
          type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        address_confidence_score:
          type: integer
        address_confidence_level:
          $ref: '#/components/schemas/AddressConfidenceLevel'
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        destination_node_id:
          description: UUID del nodo destino del envío (network_nodes). Null mientras el ingest/SAP no lo pueble.
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLine'
    ShipmentLine:
      type: object
      required:
      - id
      - sku
      - product_name
      - quantity
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        image_url:
          type: string
          nullable: true
          description: Product image URL. Null if unknown.
        price:
          type: number
          format: double
          nullable: true
        currency:
          type: string
          nullable: true
    DeliveryIssueType:
      type: string
      enum:
      - DELAY
      - ACCESS
      - CUSTOMER_REQUEST
      - ADDRESS_UNCLEAR
      - OTHER
      description: Type of in-progress delivery issue reported by the driver.
    DeliveryIssueRequest:
      type: object
      required:
      - type
      - occurred_at
      properties:
        type:
          $ref: '#/components/schemas/DeliveryIssueType'
        note:
          type: string
          nullable: true
          maxLength: 1000
        lat:
          type: number
          format: float
          nullable: true
        lng:
          type: number
          format: float
          nullable: true
        occurred_at:
          type: string
          format: date-time
          description: When the issue happened in the field (sealed by the app, even offline).
        photo_path:
          type: string
          nullable: true
          maxLength: 2048
          description: Optional evidence photo path (uploaded via the delivery photos endpoint).
        idempotency_key:
          type: string
          maxLength: 128
          description: Fallback idempotency key when the Idempotency-Key header is not sent.
    ShipmentStatus:
      type: string
      enum:
      - RECEIVED
      - PLANNED
      - IN_EXECUTION
      - DELIVERED
      - FAILED
      - CANCELLED
    ShipmentTracking:
      type: object
      description: Vista interna del seguimiento (incluye claves internas)
      required:
      - id
      - shipment_id
      - token
      - status
      - remaining_stops
      - route_position
      - eta
      - last_position
      - position_is_live
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        shipment_external_id:
          type:
          - string
          - 'null'
          description: Referencia externa humana del envío (shipments.external_id)
        token:
          type: string
        status:
          $ref: '#/components/schemas/VisibleStatus'
        remaining_stops:
          type: integer
          minimum: 0
          description: Paradas que el camión atiende antes de llegar a la del cliente
        route_position:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Posición del envío en la secuencia de la ruta publicada (1 es la primera parada)
        eta:
          type:
          - string
          - 'null'
          format: date-time
        last_position:
          oneOf:
          - $ref: '#/components/schemas/TruckPosition'
          - type: 'null'
        position_is_live:
          type:
          - boolean
          - 'null'
          description: True si la última posición es fresca, false si es solo la última conocida, null si no hay posición.
    ShipmentsError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
    SmsBudget:
      type: object
      description: Monthly SMS budget (P1-NOT-05).
      required:
      - period
      - sent
      - cap
      - remaining
      properties:
        period:
          type: string
          pattern: ^\d{4}-\d{2}$
        sent:
          type: integer
        cap:
          type: integer
        remaining:
          type: integer
    StockTransfer:
      type: object
