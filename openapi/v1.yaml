  /app/orders/{orderNumber}/labels:
    parameters:
    - $ref: '#/components/parameters/OrderNumber'
    get:
      tags:
      - labels
      operationId: getShipmentLabels
      summary: Emitted labels of an order
      description: |
        Etiquetas ya emitidas del pedido, para reimprimir o sincronizar la app offline. Cada etiqueta trae su contenido de QR firmado y su ZPL.
      responses:
        '200':
          description: Labels already emitted for the order (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
      security:
      - appBearer: []
    post:
      tags:
      - labels
      operationId: emitShipmentLabels
      summary: Emit the label batch for an order
      description: |
        Emite una etiqueta por cada bulto físico de cada línea del pedido: arma el payload, lo firma y renderiza su ZPL. Reemitir una etiqueta ya emitida es un conflicto (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitLabelsRequest'
      responses:
        '201':
          description: Labels emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '409':
          description: A label with the same identity was already emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelsError'
        '422':
          description: Invalid input
      security:
      - appBearer: []
  /app/orders/{orderNumber}/labels/reprint:
    parameters:
    - $ref: '#/components/parameters/OrderNumber'
    post:
      tags:
      - labels
      operationId: reprintShipmentLabels
      summary: Reprint the labels of an order
      description: |
        Revoca las etiquetas vigentes del pedido (quedan en la base, marcadas como revocadas para auditoría) y emite un lote nuevo con identidades nuevas. Se usa cuando una etiqueta se dañó o cambió el contenido del bulto. Requiere un motivo (ADR 004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprintLabelsRequest'
      responses:
        '201':
          description: New labels emitted; previous labels revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '422':
          description: Invalid input
      security:
      - appBearer: []
  /app/orders/{orderNumber}/labels/zpl:
    parameters:
    - $ref: '#/components/parameters/OrderNumber'
    get:
      tags:
      - labels
      operationId: getShipmentLabelsZpl
      summary: Concatenated ZPL for the order labels
      description: |
        ZPL de todas las etiquetas del pedido, concatenado y listo para enviar a la impresora Zebra.
      responses:
        '200':
          description: Raw ZPL stream for the Zebra printer
          content:
            application/x-zpl:
              schema:
                type: string
        '404':
          description: The order has no emitted labels
      security:
      - appBearer: []
