      - corridor_from
      - corridor_to
      - corridor_type
      - vehicle_class
      - price_cents
      - currency
      - effective_from
      properties:
        id:
          type: string
          format: uuid
        carrier_id:
          type: string
          format: uuid
        carrier_name:
          type: string
          nullable: true
