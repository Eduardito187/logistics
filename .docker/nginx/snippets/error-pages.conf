# ============================================================
# Páginas de error del servidor web — nunca la página cruda de nginx
# ============================================================
# Se incluye DENTRO de cada bloque `server`. Requiere, en el contexto http (arriba del `server`), el map:
#
#   map $request_uri $error_page_format { default html; ~^/api/ json; }
#
# Qué resuelve: hay errores que la aplicación nunca ve porque los responde nginx solo (petición mal
# formada, cuerpo demasiado grande, método no permitido, archivo oculto) o porque la aplicación está caída
# o reiniciando (502 / 503 / 504). La página por defecto de nginx delata el software del servidor y rompe
# la marca. Acá cada uno de esos errores sirve un archivo estático horneado desde las MISMAS vistas
# `errors.*` de Laravel:
#   - navegador → /etc/nginx/errors/<código>.html (página DisTrack)
#   - /api/*    → /etc/nginx/errors/<código>.json (cuerpo RFC 7807 del contrato de la API)
#
# Los archivos se regeneran con `php artisan logistics:error-pages:build` (ver
# App\Support\Http\StaticErrorPages) y un test vigila que estén al día.
#
# Los errores que SÍ responde Laravel no pasan por acá (fastcgi_intercept_errors queda apagado): esos ya
# salen con la página o el JSON del proyecto.

# Sin versión del servidor en la cabecera `Server` ni en ninguna página.
server_tokens off;

# Un error dentro de otro (p. ej. 404 → Laravel → 502 porque la app está caída) también usa estas páginas;
# sin esto nginx respondería su página cruda en el segundo error.
recursive_error_pages on;

# Peticiones que nginx rechaza por mal formadas: todas se presentan como 400.
error_page 400 414 416 431 494 495 496 497 =400 /__errors/400.$error_page_format;
error_page 403 /__errors/403.$error_page_format;
error_page 405 /__errors/405.$error_page_format;
error_page 408 /__errors/408.$error_page_format;
error_page 413 /__errors/413.$error_page_format;
error_page 429 /__errors/429.$error_page_format;
error_page 500 501 505 507 =500 /__errors/500.$error_page_format;
error_page 502 /__errors/502.$error_page_format;
error_page 503 /__errors/503.$error_page_format;
error_page 504 /__errors/504.$error_page_format;

# Solo alcanzable por redirección interna (error_page): pedir /__errors/... desde afuera da 404.
# `^~` evita que una location por expresión regular (estáticos, archivos ocultos) capture estas rutas.
location ^~ /__errors/ {
    internal;
    alias /etc/nginx/errors/;
    types {
        text/html                html;
        application/problem+json json;
    }
    default_type text/html;
    charset utf-8;

    # Un add_header en este nivel anula los heredados del `server`: se repiten los de seguridad.
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
