        message_type:
          $ref: '#/components/schemas/MessageType'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        escalate_when:
          $ref: '#/components/schemas/EscalateCondition'
    SetSettingAccepted:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - accepted
          - key
          properties:
            accepted:
              type: boolean
              example: true
            key:
              type: string
              example: coverage.default_service_days
    SetSettingRequest:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          example: coverage.default_service_days
        value:
          type: object
          additionalProperties: true
          example:
            days: 3
        effective_from:
          type:
          - string
          - 'null'
          format: date-time
        created_by:
          type:
          - string
          - 'null'
    SetTariffRequest:
      type: object
      required:
      - corridor_from
      - corridor_to
      - corridor_type
      - vehicle_class
      - price_cents
      - currency
      - effective_from
      properties:
        corridor_from:
          type: string
        corridor_to:
          type: string
        corridor_type:
          $ref: '#/components/schemas/CorridorType'
        vehicle_class:
          $ref: '#/components/schemas/VehicleClass'
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        effective_from:
          type: string
          format: date
    SettingEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - key
          - value
          properties:
            key:
              type: string
              example: coverage.default_service_days
            value:
              type: object
              additionalProperties: true
    SettingHistoryEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SettingVersion'
        meta:
          type: object
          properties:
            key:
              type: string
            count:
              type: integer
    SettingProblem:
      type: object
      required:
      - status
