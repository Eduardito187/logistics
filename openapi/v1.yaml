  /app/orders/{orderNumber}/labels:
    parameters:
    - $ref: '#/components/parameters/OrderNumber'
    get:
      tags:
      - labels
      operationId: getShipmentLabels
      summary: Emitted labels of an order
      description: |
        Etiquetas ya emitidas del pedido, para reimprimir o sincronizar la app offline. Cada etiqueta trae su contenido de QR firmado y su ZPL.
      responses:
        '200':
          description: Labels already emitted for the order (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
      security:
      - appBearer: []
    post:
      tags:
      - labels
      operationId: emitShipmentLabels
      summary: Emit the labels of an order
      description: |
        Emite las etiquetas del pedido (una por producto físico): arma el payload, lo firma y renderiza su ZPL.

        Dos modos sobre el mismo endpoint:
        - **Lote explícito**: el cuerpo trae `origin` + `destination` + `lines`. Emite ese lote tal cual; reemitir una etiqueta ya emitida es un conflicto (409).
        - **Por orden** (cuerpo VACÍO, o solo con `origin`): el backend deriva origen, destino y líneas de los envíos del pedido y del plan publicado, y emite solo lo AUTORIZADO (con plan publicado) y aún PENDING. Es idempotente/parcial: reabrir la pantalla emite lo que falta sin duplicar, y responde 201 con la colección completa (no 409).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitLabelsByOrderRequest'
      responses:
        '201':
          description: Labels emitted (full order collection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '409':
          description: A label with the same identity was already emitted (explicit-batch mode only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelsError'
        '422':
          description: Invalid input
      security:
      - appBearer: []
  /app/orders/{orderNumber}/labels/zpl:
    parameters:
    - $ref: '#/components/parameters/OrderNumber'
    get:
      tags:
      - labels
      operationId: getShipmentLabelsZpl
      summary: Concatenated ZPL for the order labels
      description: |
        ZPL de todas las etiquetas del pedido, concatenado y listo para enviar a la impresora Zebra.
      responses:
        '200':
          description: Raw ZPL stream for the Zebra printer
          content:
            application/x-zpl:
              schema:
                type: string
        '404':
          description: The order has no emitted labels
      security:
      - appBearer: []
  /app/orders/{orderNumber}/dispatch-lines:
    parameters:
    - $ref: '#/components/parameters/OrderNumber'
    get:
      tags:
      - labels
      operationId: getOrderDispatchLines
      summary: Dispatch lines of an order (per-product labeling screen)
      description: |
        Líneas de despacho de la orden para la pantalla de etiquetado por producto: cada producto con
        nombre + imagen servible, origen y destino humanos (cero uuid), el envío al que pertenece
        (shipment_id opaco para agrupar + shipment_reference legible), si está AUTORIZADA (plan publicado)
        y el estado de su etiqueta. Forma n-a-n (destino por línea).
      responses:
        '200':
          description: Dispatch lines with per-line product, origin, destination, authorization and label status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchLinesResponse'
      security:
      - appBearer: []
