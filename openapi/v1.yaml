      summary: Replace the full permission set of an integration token
      operationId: setTokenPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permission_keys
              properties:
                permission_keys:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Permissions set accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - appBearer: []
  /integrations/access/token/verify:
    get:
      tags:
      - Access
      summary: Verify the presented integration token
      operationId: verifyIntegrationToken
      description: |
        El integrador valida su propia credencial. El middleware access.token autentica el Bearer y
        devuelve el id del token y sus permisos efectivos. La puerta integrations también aplica
        serviceCredential, de modo que ambas credenciales viajan en la petición.
      responses:
        '200':
          description: Token verification
          content:
