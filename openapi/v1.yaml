  /app/vehicles/{vehicleId}/incidents:
    post:
      tags:
      - execution
      operationId: reportVehicleIncident
      summary: Report a vehicle incident (breakdown or accident) from the driver app
      description: |
        The driver reports a breakdown or accident with their vehicle while on route. The platform
        reacts automatically: it records the incident as an immutable fact and reschedules ONLY the
        still-pending stops of the route — delivered or failed stops are never touched.

        - MAJOR (serious accident/breakdown): the vehicle is taken OUT OF SERVICE (fleet) and the
          pending shipments are rescheduled to the NEXT DAY (planning backlog). The route is suspended.
        - MINOR: the pending stops' ETAs are pushed by the configured delay and the route continues.

        Affected customers are notified ("rescheduled" / "en route with delay") and the supervisor is
        alerted, all through the notifications outbox flow. Idempotent by `Idempotency-Key`.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Offline-first idempotency key; resending the same report does not duplicate the fact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - severity
              - type
              properties:
                severity:
                  type: string
                  enum: [MINOR, MAJOR]
                  description: MINOR keeps the route with delayed ETAs; MAJOR reschedules pending stops to the next day.
                type:
                  type: string
                  enum: [BREAKDOWN, ACCIDENT]
                route_id:
                  type: string
                  format: uuid
                  description: Optional; when omitted, the vehicle's current open route is used.
                note:
                  type: string
                  maxLength: 1000
                lat:
                  type: number
                  format: float
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  format: float
                  minimum: -180
                  maximum: 180
                occurred_at:
                  type: string
                  format: date-time
      responses:
        '202':
          description: |
            Incident recorded and automatic reaction applied. Returns the driver route already updated
            (pending stops rescheduled/delayed) so the offline app can reconcile in one call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    description: The driver route after the incident — stops in order with their updated status and ETA.
        '404':
          description: The vehicle has no open route / the route does not exist.
        '422':
          $ref: '#/components/responses/BusinessRuleError'
      security:
      - appBearer: []
