name: CI

# Corre en cada PR hacia las ramas de entorno y en cada push a ellas (después del merge).
# La suite que valida acá es la misma que `make ci`: Pint (--test) + PHPStan nivel 8 + Pest.
# En CI se ejecuta de forma nativa (sin Docker) contra los servicios de GitHub Actions para
# que sea rápida y cacheable; localmente el equipo usa `make ci` dentro de los containers.
#
# STAGING vive en ESTE mismo workflow (una sola corrida por merge, no dos en paralelo):
#   - `staging-build`  (PR → staging): construye las imágenes de staging en el servidor, sin desplegar.
#   - `deploy-staging` (push a staging): despliega SOLO si pasaron lint, tests, assets, auditoría e imagen.
# Guía: docs/deploy-staging.md. `workflow_dispatch` permite redesplegar staging a mano (eligiendo la
# rama staging en la UI; desde otra rama el deploy se omite).
on:
  push:
    branches: [dev, staging, production]
  pull_request:
    branches: [dev, staging, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  # Mismo major que el container `node` del docker-compose, para que el build del tema sea idéntico.
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint (Pint + PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: PHP + deps (cacheado)
        uses: ./.github/actions/php-deps
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Pint --test: falla si algún archivo no cumple el estilo (no corrige).
      - name: Pint
        run: ./vendor/bin/pint --test

      # El nivel (8) vive en phpstan.neon; no se pasa por flag para no divergir de `make stan`.
      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U logistics -d logistics_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: logistics
      DB_PASSWORD: logistics
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v5

      - name: PHP + deps (cacheado)
        uses: ./.github/actions/php-deps
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          # pcov solo instrumenta los archivos bajo pcov.directory. Sin fijarla, pcov la autodetecta a una
          # subcarpeta (p.ej. app/) y deja TODO packages/logistics/*/src en 0% → la cobertura caía a ~5%.
          # Se fija al root del checkout para cubrir app/ Y los packages, igual que los containers.
          ini-values: pcov.directory=${{ github.workspace }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # PostGIS resuelve zonas de cobertura, geocercas y distancias (ADR 003); la suite lo necesita.
          PGPASSWORD=logistics psql -h 127.0.0.1 -U logistics -d logistics_test -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

      # Gate de cobertura (V-15): corre la suite con pcov y falla el build si la cobertura de
      # líneas baja de 75%. Es el mismo comando que `composer test:coverage`
      # (pest --coverage --min=75). El umbral NO se baja: si un cambio reduce cobertura, se
      # agregan tests, no se afloja el gate.
      - name: Pest (con gate de cobertura --min=75)
        run: ./vendor/bin/pest --coverage --min=75

  assets:
    name: Build admin theme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Sólo se necesita PHP/Composer para traer vendor/filament: el tema de Filament hace
      # `@import` de vendor/filament/filament/resources/css/theme.css y Tailwind escanea sus vistas.
      - name: PHP + deps (cacheado)
        uses: ./.github/actions/php-deps
        with:
          php-version: ${{ env.PHP_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install JS deps
        run: npm ci

      # Compila app.css/app.js y el tema del admin (resources/css/filament/admin/theme.css).
      - name: Build
        run: npm run build

      - name: Upload compiled assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build
          if-no-files-found: error
          retention-days: 7

  # B-6 — Gate de seguridad de dependencias. Falla SOLO ante vulnerabilidades conocidas (no por
  # estilo/estática). Es un job aparte para no romper el pipeline existente: lint/test/assets/image
  # siguen igual. El umbral de npm es configurable por la variable de repo NPM_AUDIT_LEVEL
  # (default: high); composer audit reporta cualquier aviso sobre las deps bloqueadas en composer.lock.
  security:
    name: Security audit (composer + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, bcmath, redis, sodium
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Audita composer.lock sin instalar vendor: rápido y suficiente para el gate de seguridad.
      # Falla si alguna dependencia bloqueada tiene un aviso de seguridad publicado.
      - name: composer audit
        run: composer audit --locked --no-interaction --ansi

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # npm audit sobre package-lock.json. Falla a partir del nivel configurado (default high) para no
      # bloquear por avisos de severidad baja/moderada; súbelo/bájalo con la variable NPM_AUDIT_LEVEL.
      - name: npm audit
        run: npm audit --audit-level=${{ vars.NPM_AUDIT_LEVEL || 'high' }}

  image:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Valida que la imagen de producción construye (composer --no-dev + caches de Laravel).
      # Todavía no se publica en ningún registry: eso llega con el pipeline de deploy.
      - name: Build (target prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: false
          tags: dismac/logistics-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────── STAGING (servidor de Oracle Cloud, self-hosted runner) ────────────────────────────

  # PR → staging: valida que las imágenes de staging construyan EN el servidor (sin desplegar).
  staging-build:
    name: Staging build (sin deploy)
    # Solo PRs hacia staging cuyas ramas viven en ESTE repo: un PR desde un fork ejecutaría código ajeno
    # en el servidor (runner self-hosted).
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'staging'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, docker]
    timeout-minutes: 45
    env:
      # Proyecto y tag PROPIOS del PR: nunca tocan los contenedores ni las imágenes de staging.
      STAGING_PROJECT: logistics-staging-pr-${{ github.event.pull_request.number }}
      STAGING_IMAGE_TAG: pr-${{ github.event.pull_request.number }}
    steps:
      # `runner` no existe en el `env` a nivel de job (invalida el workflow): la ruta se arma acá.
      - name: Preparar rutas
        run: echo "ENV_FILE=$RUNNER_TEMP/logistics-staging-pr.env" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          clean: true

      # El build no necesita secretos reales: valores de relleno solo para que el compose valide.
      - name: Env de relleno (solo build)
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: build-only
        run: bash scripts/staging/render-env.sh "$ENV_FILE"

      - name: Build (sin deploy)
        run: bash scripts/staging/deploy.sh "$ENV_FILE" build

      - name: Limpieza
        if: always()
        run: |
          rm -f "$ENV_FILE"
          docker image rm -f "dismac/logistics-app:${STAGING_IMAGE_TAG}" "dismac/logistics-web:${STAGING_IMAGE_TAG}" 2>/dev/null || true
          docker image prune -f
          docker builder prune -f --filter until=168h
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

  # Push a staging (merge de un PR) o manual: despliega en el servidor SOLO si todo lo anterior pasó.
  deploy-staging:
    name: Deploy staging (logistics-staging)
    needs: [lint, test, assets, security, image]
    # Candado: SOLO desde la rama staging (el dueño lo exige) y nunca en un PR.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, docker]
    timeout-minutes: 60
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}
    env:
      STAGING_PROJECT: logistics-staging
      STAGING_IMAGE_TAG: staging
    steps:
      # `runner` no existe en el `env` a nivel de job (invalida el workflow): la ruta se arma acá.
      - name: Preparar rutas
        run: echo "ENV_FILE=$RUNNER_TEMP/logistics-staging.env" >> "$GITHUB_ENV"

      # El commit EXACTO que pasó lint/tests/imagen (no "lo último de staging", que podría ser otro).
      - name: Checkout del commit validado
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # Runner persistente: limpia restos de corridas anteriores antes de traer el código.
          clean: true

      - name: Generar env de staging desde secrets
        env:
          APP_KEY: ${{ secrets.STAGING_APP_KEY }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_ENV_EXTRA: ${{ secrets.STAGING_ENV_EXTRA }}
          APP_URL: ${{ vars.STAGING_APP_URL }}
          STAGING_HTTP_PORT: ${{ vars.STAGING_HTTP_PORT }}
        run: bash scripts/staging/render-env.sh "$ENV_FILE"

      - name: Build, migrar, desplegar y smoke test
        run: bash scripts/staging/deploy.sh "$ENV_FILE"

      - name: Resumen
        if: success()
        run: |
          {
            echo "### Staging desplegado"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Proyecto compose: \`$STAGING_PROJECT\`"
            echo "- Puerto publicado: \`${{ vars.STAGING_HTTP_PORT || '8110' }}\`"
            echo ""
            echo '```'
            docker compose -p "$STAGING_PROJECT" ps --format 'table {{.Service}}\t{{.Status}}\t{{.Ports}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runner NO efímero (disco de 45 GB): se borra el env con secretos, las imágenes colgadas, la caché
      # de build vieja (se conserva la de la última semana) y el workspace. Corre SIEMPRE. Los contenedores
      # no montan nada del workspace, así que borrarlo no afecta a staging.
      - name: Limpieza
        if: always()
        run: |
          rm -f "$ENV_FILE"
          docker image prune -f
          docker builder prune -f --filter until=168h
          df -h / | tail -1 | awk '{print "Disco tras limpieza: " $4 " libres (" $5 " usado)"}'
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
