  /channels/promises/offers:
    get:
      operationId: listDeliveryPromiseOffers
      summary: List deliverable dates and slots for a zone (coverage + capacity + corridor)
      description: |
        Integrated delivery-promise calculation. For a coverage zone, returns the dates and time slots that can actually be promised, combining the zone's service days and base lead time (coverage), the free capacity per slot (capacity) and whether an operational corridor reaches the zone (network). Returns an empty collection when the zone is unknown/inactive or no corridor serves it.
      tags:
      - Promise
      parameters:
      - name: zone_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: First day of the horizon in Y-m-d format. Defaults to today.
      - name: horizon_days
        in: query
