      summary: List the delivery plans of a day (one per truck)
      parameters:
      - name: date
        in: query
        required: false
        description: Day to list, as YYYY-MM-DD. Required unless date_from is given; takes precedence over the range.
        schema:
          type: string
          format: date
      - name: date_from
        in: query
        required: false
        description: First day of a range (inclusive). Required when date is absent or date_to is given.
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        required: false
        description: Last day of the range (inclusive). The range may not exceed 31 days.
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - PROPOSED
          - PUBLISHED
      - name: vehicle_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Plans of the requested day
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
                  meta:
                    description: >-
                      Always carries date (and date_to when a range was requested). Without pagination
                      parameters it also carries count (legacy shape); with them, the standard pagination meta.
                    allOf:
                    - type: object
                      required:
                      - date
                      properties:
                        date:
                          type: string
                          format: date
                        date_to:
                          type: string
                          format: date
                        count:
                          type: integer
                    - $ref: '#/components/schemas/ListMeta'
        '422':
          $ref: '#/components/responses/PlanningValidationError'
      security:
      - appBearer: []
    post:
      tags:
      - planning
      operationId: generatePlanProposal
      summary: Generate the automatic order-to-truck proposal for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePlanProposalRequest'
      responses:
        '201':
          description: Proposal generated; the proposed plan is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEnvelope'
        '422':
          $ref: '#/components/responses/PlanningValidationError'
      security:
      - appBearer: []
  /app/plans/auto:
    get:
      tags:
      - planning
      operationId: getDailyPlanRun
      summary: Status and result of the day's auto-plan run
      parameters:
      - name: date
        in: query
        required: true
        description: Day of the run, as YYYY-MM-DD
        schema:
          type: string
          format: date
      - name: strategy
        in: query
        required: true
        description: Planning mode
        schema:
          type: string
