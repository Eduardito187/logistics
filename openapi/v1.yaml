        license_number:
          type: string
        license_expiry:
          type: string
          format: date
        enabled_vehicle_ids:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
    EffectiveCapacity:
      type: object
      required:
      - date
      - time_slot
      - unit
      - total
      - used
      - available
      - full
      - source
      description: 'Effective capacity for a key. `source` tells where the figures come from: `bucket` (an explicit
        bucket exists), `rule` (no bucket, but the configurable rules give a default total with zero used) or `none`
        (no bucket and no rule: capacity unknown, reported as zero).'
      properties:
        bucket_id:
          type:
          - string
          - 'null'
          format: uuid
        node_id:
          type:
          - string
          - 'null'
          format: uuid
        zone_id:
          type:
          - string
          - 'null'
          format: uuid
        municipality_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Municipality (coverage area) the key belongs to, when its scope is a municipality.
        date:
          type: string
          format: date
        time_slot:
          type: string
          example: 09:00-13:00
        unit:
          $ref: '#/components/schemas/CapacityUnit'
        total:
          type: number
          format: float
        used:
          type: number
          format: float
        available:
          type: number
          format: float
        full:
          type: boolean
        source:
          type: string
          enum:
          - bucket
          - rule
          - none
    EffectiveCapacityEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/EffectiveCapacity'
    EmitLabelLine:
      type: object
      required:
      - sku
      - name
      - quantity
      properties:
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
          description: Nombre del producto; no viaja en el QR (ADR 004)
        quantity:
          type: integer
          minimum: 1
          description: Unidades del producto en la línea
        pieces_per_unit:
          type: integer
          minimum: 1
          default: 1
          description: Piezas (cajas) por unidad; una etiqueta por pieza
    EmitLabelsRequest:
      type: object
      required:
      - origin
      - destination
      - lines
      properties:
        origin:
          type: string
          maxLength: 64
          description: Nodo de origen
        destination:
          type: string
          maxLength: 64
          description: Nodo de destino
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmitLabelLine'
    EmittedLabel:
      type: object
      required:
      - order_number
      - label_id
      - key_id
      - sku
      - line_number
      - qr_content
      - zpl
      - emitted_at
      - revoked
      properties:
        order_number:
          type: string
        label_id:
          type: string
          description: Identidad de negocio (campo `id` del payload), única por bulto físico
        key_id:
          type: integer
          description: Clave con la que se firmó (campo `k` del QR)
        sku:
          type: string
        line_number:
          type: integer
        qr_content:
          type: string
          description: JSON firmado exacto que lleva el QR
        zpl:
          type: string
          description: Representación ZPL para la impresora Zebra
        emitted_at:
          type: integer
          description: Marca de tiempo de emisión (epoch en segundos)
        revoked:
          type: boolean
          description: true si la etiqueta fue revocada (p. ej. por reimpresión) y ya no es válida
        revoked_at:
          type: integer
          nullable: true
          description: Marca de tiempo de revocación (epoch en segundos), o null si está vigente
        revoked_reason:
          type: string
          nullable: true
          description: Motivo de la revocación, o null si está vigente
    EnqueueStockTransferRequest:
      type: object
