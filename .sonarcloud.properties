# Configuración del ANÁLISIS AUTOMÁTICO de SonarCloud.
#
# El Análisis Automático (el que corre en los PR sin pipeline propio) lee ESTE archivo
# (.sonarcloud.properties), NO sonar-project.properties (ese es solo para el scanner de CI).
#
# ----------------------------------------------------------------------------------------------------
# 1) Exclusiones SOLO de la DETECCIÓN DE DUPLICACIÓN (CPD). Estos archivos se siguen analizando para
#    bugs y olores; únicamente no cuentan líneas duplicadas, porque la repetición ahí es intencional
#    por diseño o inherente, y forzar DRY rompería la arquitectura o no aporta:
#
#      - **/Presentation/**  → Grueso de la duplicación. Cada bounded context tiene su propio adaptador
#        HTTP (Presentation/Http/ApiController → CommandBus/QueryBus) y sus Filament Resources/Pages,
#        casi idénticos A PROPÓSITO: monolito modular orientado a microservicios donde cada contexto es
#        AUTÓNOMO y EXTRAÍBLE a un servicio (ADR 001/008). Unificarlos acoplaría los contextos.
#      - app/Filament/**     → Widgets/páginas del admin: boilerplate de schemas de formulario/tabla.
#      - tests / seeders     → Arrange de cada prueba + la misma cola de `skip` sin PostgreSQL; seeders
#        de datos de ejemplo. Repetitivos por naturaleza.
# ----------------------------------------------------------------------------------------------------
sonar.cpd.exclusions=**/tests/**,**/*Test.php,database/seeders/**,**/Presentation/**,app/Filament/**

# ----------------------------------------------------------------------------------------------------
# 2) Supresión acotada de reglas estructurales donde el patrón es legítimo (NO son bugs; no afectan el
#    Quality Gate, pero quitan ruido). Refactorizarlas sin poder correr la suite es arriesgado.
#
#      - php:S107 (demasiados parámetros) en seeders y en los ReadModel de Application: un ReadModel es
#        un DTO inmutable que refleja una fila ancha; los seeders arman escenarios con muchos datos.
#      - php:S1448 (demasiados métodos) en seeders: orquestan muchos pasos de un escenario completo.
# ----------------------------------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S107
sonar.issue.ignore.multicriteria.e1.resourceKey=database/seeders/**
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Application/ReadModel/**
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e3.resourceKey=database/seeders/**

# Si el Análisis Automático tampoco toma este archivo, aplicar lo mismo en la UI:
#   Duplicaciones  → Administration → Analysis Scope → Duplications → "Ignore Duplications".
#   Reglas S107/S1448 → Administration → Analysis Scope → Issue Exclusions (o marcar los issues
#   como "Won't fix" en la pestaña Issues del PR).
