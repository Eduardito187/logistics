        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plate:
          type: string
        capacity_kg:
          type: integer
        capacity_m3:
          type: number
          format: float
        home_base_node_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VehicleStatus'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentExpiry'
    VehicleClass:
      type: string
