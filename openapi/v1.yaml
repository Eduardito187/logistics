    PaginationMeta:
      type: object
      description: >-
        Metadata added to a list response when offset pagination is requested (E-02). Absent when the
        caller does not pass any pagination parameter (the full collection is returned unchanged).
      required:
      - count
      - page
      - per_page
      - total
      - total_pages
      properties:
        count:
          type: integer
          description: Number of items in this page.
        page:
          type: integer
          description: 1-based page number of this page.
        per_page:
          type: integer
          description: Page size used to slice the collection.
        total:
          type: integer
          description: Total number of items across all pages.
        total_pages:
          type: integer
          description: Total number of pages for the current page size.
        next_page:
          type:
          - integer
          - 'null'
          description: Next page number, or null on the last page.
        prev_page:
          type:
          - integer
          - 'null'
          description: Previous page number, or null on the first page.
    CursorMeta:
      type: object
      description: >-
        Metadata added to a list response when cursor pagination is requested (E-02), preferred for
        large, growing collections. The caller follows `next_cursor` until it is null.
      required:
      - count
      - per_page
      - has_more
      - next_cursor
      properties:
        count:
          type: integer
          description: Number of items in this page.
        per_page:
          type: integer
          description: Page size used to slice the collection.
        has_more:
          type: boolean
          description: Whether more items remain after this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page, or null when exhausted.
