                - departure
                - arrival
                - proof_of_delivery
                - failed
              occurred_at:
                type: string
                format: date-time
              payload:
                type: object
                additionalProperties: true
                description: Same body as the single endpoint of that kind.
    ScanBatchResponse:
      type: object
