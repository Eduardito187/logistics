          description: Validation error
      security:
      - appBearer: []
  /app/sap/stock-transfers:
    post:
      tags:
      - sap-connector
      operationId: enqueueStockTransfer
      summary: Enqueue a stock transfer to SAP from a node reception
      description: |
        Encola un traspaso de stock al recibir un producto en un nodo. Responde 202 de inmediato: el
        escaneo nunca espera a SAP. Idempotente por `event_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueStockTransferRequest'
      responses:
        '202':
          description: Transfer accepted for asynchronous dispatch
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - event_id
                    - shipment_ref
                    - status
                    properties:
                      event_id:
                        type: string
                      shipment_ref:
                        type: string
                      status:
                        type: string
                        enum:
                        - ENQUEUED
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
        '422':
          description: Validation error
      security:
      - appBearer: []
  /app/sap/stock-transfers/dispatch:
    post:
      tags:
      - sap-connector
      operationId: dispatchPendingStockTransfers
      summary: Queue a reconciliation run for failed and stale pending stock transfers
      description: |
        Encola (cola `sap`) una corrida de reconciliación y responde de inmediato con 202: SAP nunca se
        llama dentro del request. La corrida reintenta los traspasos Failed y los Pending estancados
        (más viejos que `transfers.stale_pending_minutes`); los traspasos nuevos los empuja solo el
        reactor del outbox, para no duplicar el envío.
      responses:
        '202':
          description: Dispatch run queued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - status
                    properties:
                      status:
                        type: string
                        enum:
                        - DISPATCH_REQUESTED
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
      security:
      - appBearer: []
  /app/sap/stock-transfers/failed:
    get:
