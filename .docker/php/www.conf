; ============================================================
; PHP-FPM pool config — logistics
; ============================================================
; Este archivo son los valores HORNEADOS (defaults seguros y válidos por sí
; solos). En el arranque, el entrypoint lo RE-RENDERIZA desde `www.conf.template`
; sustituyendo los valores de `pm.*` por las variables de entorno FPM_* cuando el
; archivo es escribible (ver entrypoint.sh §FPM). php-fpm NO interpola variables de
; entorno en directivas numéricas (`pm.max_children = $ENV{...}` falla), por eso la
; parametrización se hace generando el archivo en boot, no con placeholders nativos.
;
; Cálculo de `pm.max_children` (documentado para no tocar a ciegas):
;   pm.max_children ≈ (RAM_util_del_contenedor_MB * 0.75) / RSS_promedio_por_worker_MB
; Un worker Laravel + Filament ronda 60–120 MB de RSS real (el `memory_limit=512M`
; es el tope duro por request, no el consumo típico). Con ~96 MB por worker:
;   - contenedor de 2 GB  → ~16 children
;   - contenedor de 4 GB  → ~32 children
;   - contenedor de 6 GB  → ~48 children (cercano al default 50)
; Subir `pm.max_children` sin RAM proporcional lleva a OOM/swap: ajustar SIEMPRE
; junto con la RAM del contenedor y medir con load test (Fase 4).

[www]
user = logistics
group = logistics

listen = 0.0.0.0:9000

; Proceso de workers. `dynamic` se adapta a la carga manteniendo un colchón de
; procesos listos; para tráfico muy parejo y alto, `static` (max_children fijo)
; evita el coste de crear/matar procesos. Parametrizable por FPM_* (ver cabecera).
pm = dynamic
pm.max_children = 50
pm.start_servers = 8
pm.min_spare_servers = 8
pm.max_spare_servers = 16
; Recicla cada worker tras N requests: higiene de memoria (fugas de paquetes de
; terceros) sin pagar el re-warm de opcache demasiado seguido. Antes era 500.
pm.max_requests = 1000

pm.status_path = /status
ping.path = /ping
ping.response = pong

; Logging
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Slowlog (queries lentas del lado PHP)
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Timeouts
request_terminate_timeout = 60s

; Enviar errores a stderr para que docker logs los capture
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
