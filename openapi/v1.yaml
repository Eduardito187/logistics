      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerSettlementMarkPaidRequest'
      responses:
        '202':
          description: Payment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - serviceCredential: []
  /integrations/returns:
    post:
      tags:
      - Returns
      summary: Initiate a return
      operationId: initiateReturn
      description: |
        Inicia una devolución (logística inversa). El id lo genera el dominio; la respuesta es un acuse 202
        (la escritura confirma vía outbox).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateReturnRequest'
      responses:
        '202':
          description: Return initiation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - serviceCredential: []
    get:
      tags:
      - Returns
      summary: List returns
      operationId: listReturns
      parameters:
      - name: seller_id
        in: query
        required: false
        description: Optional filter by owning seller.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: Optional filter by return status.
        schema:
          $ref: '#/components/schemas/ReturnOrderStatus'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The list of returns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderCollection'
      security:
      - serviceCredential: []
  /integrations/returns/{returnId}:
    get:
      tags:
      - Returns
      summary: Get a return
      operationId: getReturn
      parameters:
      - name: returnId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderEnvelope'
        '404':
          description: Return not found
      security:
      - serviceCredential: []
  /integrations/returns/{returnId}/receive:
    post:
      tags:
      - Returns
      summary: Receive a return
      operationId: receiveReturn
      description: |
        Registra la recepción física de una devolución. Respuesta de acuse 202.
      parameters:
      - name: returnId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Return reception accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - serviceCredential: []
  /integrations/returns/{returnId}/disposition:
    post:
      tags:
      - Returns
      summary: Disposition a return
      operationId: dispositionReturn
      description: |
        Decide la disposición de una devolución recibida (restock / return_to_seller / scrap). Respuesta de
        acuse 202.
      parameters:
      - name: returnId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositionReturnRequest'
      responses:
        '202':
          description: Return disposition accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - serviceCredential: []
  /integrations/seller-portal/asns:
    get:
      tags:
      - SellerPortal
      summary: List the authenticated seller's ASNs
      operationId: sellerPortalListAsns
      description: |
        ASNs (inbound) del seller autenticado. El sellerId se resuelve del token de integración, así que un
        seller solo puede leer lo suyo.
      responses:
        '200':
          description: The seller's ASNs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerPortalAsnCollection'
        '401':
          description: Token ausente, inválido o expirado
        '403':
          description: El token no concede sellerportal.read o no identifica a un seller
      security:
      - integrationToken: []
  /integrations/seller-portal/stock:
    get:
      tags:
      - SellerPortal
      summary: Get the authenticated seller's on-hand stock
      operationId: sellerPortalGetStock
      description: |
        Stock on-hand (inventory) del seller autenticado. El sellerId se resuelve del token de integración.
      responses:
        '200':
          description: The seller's on-hand stock lots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerPortalStockCollection'
        '401':
          description: Token ausente, inválido o expirado
        '403':
          description: El token no concede sellerportal.read o no identifica a un seller
      security:
      - integrationToken: []
  /integrations/seller-portal/settlements:
    get:
      tags:
      - SellerPortal
      summary: List the authenticated seller's settlements
      operationId: sellerPortalListSettlements
      description: |
