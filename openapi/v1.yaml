    VehicleStatus:
      type: string
      enum:
      - available
      - in_service
      - maintenance
      - inactive
      description: Operational status of a vehicle.
    VerifyLabelRequest:
      type: object
      required:
      - payload
      - signature
      - key_id
      properties:
        payload:
          type: string
          maxLength: 4096
          description: JSON canónico del QR (exactamente lo que se firmó)
        signature:
          type: string
          maxLength: 512
          description: Firma de la etiqueta en base64url
        key_id:
          type: integer
          minimum: 1
          description: Id de la clave pública con la que se firmó (campo "k" del QR)
    VisibleStatus:
      type: string
      description: >-
        Estado visible del pedido de cara al cliente (ciclo de vida del seguimiento). Flujo:
        PENDING → PROCESSING → IN_PROGRESS → LOADED → ON_THE_WAY → DELIVERED; con CANCELLED,
        RESCHEDULED (reprogramada), FAILED (intento fallido) y RETURNED (devuelta).
      enum:
      - PENDING
      - PROCESSING
      - IN_PROGRESS
      - LOADED
      - ON_THE_WAY
      - DELIVERED
      - FAILED
      - RESCHEDULED
      - CANCELLED
      - RETURNED
    UnitStatus:
      type: string
      description: Estado visible de un producto (unidad física) dentro del seguimiento
      enum:
      - REGISTERED
      - PREPARED
      - LOADED
      - UNLOADED
      - RECEIVED
      - DELIVERED
      - FAILED
    PublicUnit:
      type: object
      description: Vista pública de un producto (sin PII)
      required:
      - label
      - status
      - status_message
      properties:
        label:
          type: string
          description: Etiqueta humana del producto, p. ej. "Producto 1 de 2"
        status:
          $ref: '#/components/schemas/UnitStatus'
        status_message:
          type: string
          description: Mensaje por producto en español, p. ej. "Cargado en el camión."
    UnitTracking:
      type: object
      description: Vista interna del seguimiento de un producto
      required:
      - id
      - unit_id
      - shipment_id
      - status
      - last_location_id
      - last_seen_at
      - label
      properties:
        location:
          type: string
          nullable: true
          description: Current shelf location at the node, if assigned.
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UnitStatus'
        last_location_id:
          type:
          - string
          - 'null'
          description: Nodo/parada donde se vio por última vez el producto
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        label:
          type:
          - string
          - 'null'
          description: Etiqueta humana del producto ("N/M")
        sku:
          type:
          - string
          - 'null'
          description: SKU del producto (null si no se resuelve)
        product_name:
          type:
          - string
          - 'null'
        product_image_url:
          type:
          - string
          - 'null'
        piece_index:
          type:
          - integer
          - 'null'
          description: Pieza N de un producto fraccionado en varias cajas
        piece_total:
          type:
          - integer
          - 'null'
        label_id:
          type:
          - string
          - 'null'
          description: >-
            Id (ULID del QR) de la etiqueta de este producto, para que la app mapee label_id→unit_id offline al
            escanear. Mismo unit_id que EmittedLabel. null si el producto aún no tiene etiqueta emitida.
