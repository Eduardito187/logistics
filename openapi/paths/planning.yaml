# Fragmento OpenAPI del contexto Planificación.
#
# Lo fusiona el integrador en openapi/v1.yaml (NO se edita v1.yaml acá). Todas las rutas van bajo la
# puerta APP (servidor .../api/v1/app). Las credenciales/seguridad las define el documento raíz.
#
# Las rutas se listan relativas a /app (como las monta el integrador): /app/plans, /app/plans/{planId}, ...

paths:
  /app/plans:
    get:
      tags: [planning]
      operationId: listPlansByDate
      summary: List the delivery plans of a day (one per truck)
      parameters:
        - name: date
          in: query
          required: true
          description: Day to list, as YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Plans of the requested day
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
                  meta:
                    type: object
                    required: [date, count]
                    properties:
                      date:
                        type: string
                        format: date
                      count:
                        type: integer
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [planning]
      operationId: generatePlanProposal
      summary: Generate the automatic order-to-truck proposal for a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePlanProposalRequest'
      responses:
        '201':
          description: Proposal generated; the proposed plan is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/plans/{planId}:
    get:
      tags: [planning]
      operationId: getPlan
      summary: Get a plan with its stop sequence, ETA and load plan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/plans/{planId}/eta:
    get:
      tags: [planning]
      operationId: getPlanEta
      summary: ETA per stop of the plan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: ETA per stop
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [plan_id, status, stops]
                    properties:
                      plan_id:
                        type: string
                        format: uuid
                      status:
                        $ref: '#/components/schemas/PlanStatus'
                      stops:
                        type: array
                        items:
                          $ref: '#/components/schemas/StopEta'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/plans/{planId}/stops:
    post:
      tags: [planning]
      operationId: assignShipmentToPlan
      summary: Manual adjustment — add or move a shipment onto this truck
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment_id]
              properties:
                shipment_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/plans/{planId}/sequence:
    put:
      tags: [planning]
      operationId: reorderPlanStops
      summary: Reorder the plan stops to the given order
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ordered_shipment_ids]
              properties:
                ordered_shipment_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/plans/{planId}/publish:
    post:
      tags: [planning]
      operationId: publishPlan
      summary: Publish the plan, making it available to execution
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Published plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    PlanStatus:
      type: string
      description: Lifecycle state of a delivery plan
      enum: [DRAFT, PROPOSED, PUBLISHED]

    GeneratePlanProposalRequest:
      type: object
      required: [plan_date, vehicle_id, depart_at, stops]
      properties:
        plan_date:
          type: string
          format: date
        vehicle_id:
          type: string
          format: uuid
        depart_at:
          type: string
          format: date-time
          description: Depot departure time, ISO-8601
        stops:
          type: array
          minItems: 1
          items:
            type: object
            required: [shipment_id, latitude, longitude]
            properties:
              shipment_id:
                type: string
                format: uuid
              latitude:
                type: number
                format: double
                minimum: -90
                maximum: 90
              longitude:
                type: number
                format: double
                minimum: -180
                maximum: 180

    PlanEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Plan'

    Plan:
      type: object
      required: [id, plan_date, vehicle_id, status, stops]
      properties:
        id:
          type: string
          format: uuid
        plan_date:
          type: string
          format: date
        vehicle_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PlanStatus'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/PlannedStop'

    PlannedStop:
      type: object
      required: [id, shipment_id, sequence, load_order]
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Delivery position, 1-based
        eta_at:
          type: [string, 'null']
          format: date-time
        eta_minutes:
          type: [integer, 'null']
          description: Minutes from depot departure
        lane:
          type: [string, 'null']
          description: Load lane label
        load_order:
          type: integer
          description: Loading order (reverse of delivery)

    StopEta:
      type: object
      required: [shipment_id, sequence]
      properties:
        shipment_id:
          type: string
          format: uuid
        sequence:
          type: integer
        eta_at:
          type: [string, 'null']
          format: date-time
        eta_minutes:
          type: [integer, 'null']

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
