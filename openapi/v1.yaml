                    $ref: '#/components/schemas/CommerceSearchResult'
        '422':
          description: Validation or domain-rule error (limit out of range / invalid status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - channelApiKey: []
  /channels/search/facets:
    get:
      tags:
      - search
      operationId: searchFacets
      summary: Category facets (counts) for the catalog
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - archived
          default: published
      responses:
        '200':
          description: Category facet counts
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommerceSearchFacet'
      security:
      - channelApiKey: []


  # ── commerce/payments (ADR 018) ──
  /channels/payments:
    post:
      tags:
      - payments
      operationId: initiatePayment
      summary: Initiate the payment of an order
      description: Starts the charge of an order and returns the payment with its gateway reference, which the storefront uses
        to redirect the customer to the gateway checkout. The final state is confirmed later by the gateway webhook (integrations
        gate).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceInitiatePaymentRequest'
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CommercePayment'
        '422':
          description: Validation or domain-rule error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - channelApiKey: []


  # ── commerce/orders: cancelación (ADR 020) ──
  /channels/orders/{order}/cancel:
    post:
      tags:
      - orders
      operationId: cancelOrderChannel
      summary: Cancel an order (POS / customer channel)
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceCancelOrderRequest'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
        '404':
          description: No order found for the given identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Domain-rule error (e.g. the order is already in a terminal state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - channelApiKey: []
  /integrations/orders/{order}/cancel:
    post:
      tags:
      - orders
      operationId: cancelOrderIntegration
      summary: Cancel an order (POS backend / service)
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceCancelOrderRequest'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
        '404':
          description: No order found for the given identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - serviceCredential: []

  /integrations/orders/{order}/contract-signed:
    post:
      tags:
      - orders
      operationId: signOrderContract
      summary: Report the credit contract signature (credit/installment orders)
      description: >-
        Señal del POS/sistema de crédito: el contrato de la orden a crédito fue firmado. Al cumplirse las
        condiciones del plan (crédito sin inicial → solo contrato; con inicial → contrato + inicial) la orden
        pasa a procesando (emite OrderPaid → crea el envío → tracking «procesando»). Idempotente.
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceCreditSignalRequest'
      responses:
        '202':
          description: Signal accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
        '404':
          description: No order found for the given identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - serviceCredential: []

  /integrations/orders/{order}/initial-paid:
    post:
      tags:
      - orders
      operationId: recordOrderInitialPayment
      summary: Report the down-payment of a credit order (credit with down payment)
      description: >-
        Señal del POS/sistema de crédito: se cobró la cuota inicial de una orden de crédito con inicial.
        Junto a la firma del contrato habilita el paso a procesando. Idempotente. 422 si la orden no es a
        crédito o no lleva inicial.
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceCreditSignalRequest'
      responses:
        '202':
          description: Signal accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
        '404':
          description: No order found for the given identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - serviceCredential: []

components:
  securitySchemes:
    appBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token Bearer por usuario y dispositivo emitido por Laravel Sanctum (puerta /app/*).
    channelApiKey:
      type: apiKey
      in: header
      name: X-Channel-Key
      description: Credencial por canal (app de clientes, web, call center) enviada en la cabecera X-Channel-Key
        (puerta /channels/*).
    serviceCredential:
      type: apiKey
      in: header
      name: X-Service-Credential
      description: Credencial de servicio para integraciones (SAP, transportistas, webhooks) enviada en la cabecera
        X-Service-Credential (puerta /integrations/*).
    integrationToken:
      type: http
      scheme: bearer
      bearerFormat: Integration
      description: Token de integración de la plataforma (prefix.secret) enviado como Bearer y validado por
        el middleware access.token. Convive con serviceCredential en la puerta /integrations/*.
  schemas:
    MissingUnitReason:
      type: string
      enum:
      - not_arrived
      - damaged
      - wrong_store
      - other
    AssignShelfLocationRequest:
      type: object
      required:
      - node_id
      - location
      - occurred_at
      properties:
        node_id:
          type: string
          format: uuid
        location:
          type: string
          minLength: 1
          maxLength: 64
        occurred_at:
          type: string
          format: date-time
        unit_ids:
          type: array
          minItems: 1
          maxItems: 200
          description: Required on the batch route.
          items:
            type: string
    NodeReceptionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        order_reference:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
        origin_node_id:
          type: string
          format: uuid
        destination_node_id:
          type: string
          format: uuid
        corridor:
          type: string
        reception:
          type: object
          properties:
            status:
              type: string
              enum:
              - OPEN
              - RECONCILED
            expected_count:
              type: integer
            received_count:
              type: integer
            missing_count:
              type: integer
            surplus_count:
              type: integer
            opened_at:
              type: string
              format: date-time
            reconciled_at:
              type: string
              format: date-time
              nullable: true
    ListMeta:
      type: object
      description: >-
        Single, named meta of every list response (snake_case). `count` is always present. Offset pagination
        adds page/per_page/total/total_pages/next_page/prev_page; cursor pagination adds per_page/has_more/
        next_cursor. Absent pagination fields mean the caller did not paginate (full collection). Endpoints may
        add their own keys (e.g. unread_count, count_by_status, date).
      required:
      - count
      properties:
        count:
          type: integer
          description: Number of items in this response.
        page:
          type: integer
          description: 1-based page number (offset pagination).
        per_page:
          type: integer
          description: Page size used.
        total:
          type: integer
          description: Total items across all pages (offset pagination).
        total_pages:
          type: integer
        next_page:
          type:
          - integer
          - 'null'
          description: Next page number, or null on the last page.
        prev_page:
          type:
          - integer
          - 'null'
        has_more:
          type: boolean
          description: Whether more items remain (cursor pagination).
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page, or null when exhausted.
      additionalProperties: true
    DeliveryMode:
      type: string
      enum:
      - home_delivery
      - store_pickup
      description: Derived from the destination node type (store/pickup_point → store_pickup; none/CD/unknown → home_delivery).
    ShipmentAddressParts:
      type: object
      description: Best-effort parse of the free-text address (no ingest source sends a structured address yet).
      required:
      - street
      - number
      - neighborhood
      - reference
      - city
      properties:
        street:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
    ShipmentStatusCounts:
      type: object
      description: Shipment status → count (every ShipmentStatus key present, 0 when none).
      additionalProperties:
        type: integer
    ShipmentSummary:
      type: object
      required:
      - date_from
      - date_to
      - total
      - by_status
      - by_execution_status
      - active_plans
      - open_alerts
      - units_total
      - generated_at
      properties:
        date_from:
          type: string
          format: date
          nullable: true
        date_to:
          type: string
          format: date
          nullable: true
        total:
          type: integer
        by_status:
          $ref: '#/components/schemas/ShipmentStatusCounts'
        by_execution_status:
          type: object
          additionalProperties:
            type: integer
        active_plans:
          type: integer
          description: PUBLISHED plans in the period (default today).
        open_alerts:
          type: integer
          description: Unacknowledged telemetry alerts in the period.
        units_total:
          type: integer
        generated_at:
          type: string
          format: date-time
    DailyKpis:
      type: object
      required:
      - date
      - scope
      - deliveries_total
      - delivered
      - failed
      - rescheduled
      - pending
      - on_time_rate
      - first_attempt_success_rate
      - avg_stop_minutes
      - km
      - failed_by_reason
      - generated_at
      properties:
        date:
          type: string
          format: date
        scope:
          type: string
          enum:
          - driver
          - fleet
          - node
        deliveries_total:
          type: integer
        delivered:
          type: integer
        failed:
          type: integer
        rescheduled:
          type: integer
        pending:
          type: integer
        on_time_rate:
          type: number
          nullable: true
          description: 0..1, closed before the promised window end (La Paz).
        first_attempt_success_rate:
          type: number
          nullable: true
          description: 0..1 over delivered+failed.
        avg_stop_minutes:
          type: number
          nullable: true
          description: Arrival to close; null until stops record arrived_at.
        km:
          type: integer
          nullable: true
          description: Odometer delta of the day's departures; null without readings or for node scope.
        failed_by_reason:
          type: array
          items:
            type: object
            required:
            - reason
            - count
            properties:
              reason:
                type: string
              count:
                type: integer
        generated_at:
          type: string
          format: date-time
    PingBatchResultEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - accepted
          - vehicle_id
          - source
          - count
          - accepted_count
          - duplicate_count
          - rejected_count
          - results
          properties:
            accepted:
              type: boolean
            vehicle_id:
              type: string
            source:
              type: string
              enum:
              - app
              - integration
            count:
              type: integer
            accepted_count:
              type: integer
            duplicate_count:
              type: integer
            rejected_count:
              type: integer
            results:
              type: array
              items:
                type: object
                required:
                - index
                - status
                properties:
                  index:
                    type: integer
                  fix_id:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                    - accepted
                    - duplicate
                    - rejected
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    ShipmentBreadcrumbs:
      type: object
      properties:
        shipment_id:
          type: string
        vehicle_id:
          type: string
        plate:
          type: string
          nullable: true
        delivery_status:
          type: string
        window:
          type: object
          properties:
            from:
              type: string
              format: date-time
              nullable: true
            to:
              type: string
              format: date-time
              nullable: true
            open:
              type: boolean
        points_total:
          type: integer
        points_returned:
          type: integer
        points:
          type: array
          items:
            type: object
            properties:
              lat:
                type: number
              lng:
                type: number
              speed_kph:
                type: number
                nullable: true
              heading:
                type: integer
                nullable: true
              recorded_at:
                type: string
                format: date-time
    VehicleEta:
      type: object
      description: Dynamic ETA from the latest position. No live traffic source exists (traffic_aware is always false).
      properties:
        shipment_id:
          type: string
          description: Only in the per-shipment endpoint
        vehicle_id:
          type: string
        plate:
          type: string
          nullable: true
        traffic_aware:
          type: boolean
        position:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number
            recorded_at:
              type: string
              format: date-time
        position_stale:
          type: boolean
        generated_at:
          type: string
          format: date-time
        stops:
          type: array
          items:
            type: object
            properties:
              shipment_id:
                type: string
              sequence:
                type: integer
              order_reference:
                type: string
                nullable: true
              customer_name:
                type: string
                nullable: true
              lat:
                type: number
                nullable: true
              lng:
                type: number
                nullable: true
              planned_eta:
                type: string
                format: date-time
                nullable: true
              eta:
                type: string
                format: date-time
                nullable: true
              remaining_distance_m:
                type: integer
                nullable: true
              remaining_duration_s:
                type: integer
                nullable: true
              method:
                type: string
                nullable: true
                enum:
                - osrm
                - straight_line
                - null
              computed_at:
                type: string
                format: date-time
                nullable: true
    ChecklistTemplateItem:
      type: object
      required:
      - key
      - label
      - category
      - criticality
      - requires_photo
      - position
      properties:
        key:
          type: string
          pattern: '^[a-z0-9_.-]{1,64}$'
          description: Stable key sent back in the checklist POST items map
        label:
          type: string
        category:
          type: string
          enum:
          - mechanical
          - fluids
          - safety
          - tires
          - electrical
          - documents
          - cabin
          - cargo
          - other
        criticality:
          type: string
          enum:
          - critical
          - major
          - minor
        requires_photo:
          type: boolean
        position:
          type: integer
          minimum: 1
    ChecklistTemplate:
      type: object
      required:
      - id
      - name
      - vehicle_type
      - active
      - items
      - critical_keys
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vehicle_type:
          type: string
          nullable: true
        active:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistTemplateItem'
        critical_keys:
          type: array
          items:
            type: string
    VehicleFitness:
      type: object
      required:
      - vehicle_id
      - plate
      - date
      - fit_to_dispatch
      - unfit_since
      - unfit_reason
      - unfit_items
      properties:
        vehicle_id:
          type: string
          format: uuid
        plate:
          type: string
        date:
          type: string
          format: date
        fit_to_dispatch:
          type: boolean
        unfit_since:
          type: string
          format: date
          nullable: true
        unfit_reason:
          type: string
          nullable: true
        unfit_items:
          type: array
          items:
            type: string
    ClearVehicleFitnessRequest:
      type: object
      required:
      - note
      properties:
        note:
          type: string
          minLength: 3
          maxLength: 1000
          description: What was repaired (audited)
    PreTripChecklistResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        performed_on:
          type: string
          format: date
        inspection_id:
          type: string
          format: uuid
          nullable: true
        passed:
          type: boolean
          nullable: true
        fit_to_dispatch:
          type: boolean
          description: No failed critical item AND the vehicle is fit on that date
        failed_critical:
          type: array
          items:
            type: string
        missing_critical:
          type: array
          items:
            type: string
        vehicle_fitness:
          oneOf:
          - $ref: '#/components/schemas/VehicleFitness'
          - type: 'null'
    DueMaintenanceItem:
      type: object
      required:
      - vehicle_id
      - vehicle_plate
      - plan_id
      - service_kind
      - next_due_km
      - next_due_at
      - current_odometer_km
      - remaining_km
      - days_remaining
      - overdue
      - urgency
      properties:
        vehicle_id:
          type: string
          format: uuid
        vehicle_plate:
          type: string
          nullable: true
        plan_id:
          type: string
          format: uuid
          nullable: true
        service_kind:
          type: string
          enum:
          - oil_change
          - tires
          - brakes
          - filters
          - battery
          - general
          - inspection
        next_due_km:
          type: integer
          nullable: true
        next_due_at:
          type: string
          format: date-time
          nullable: true
        current_odometer_km:
          type: integer
          nullable: true
        remaining_km:
          type: integer
          nullable: true
          description: next_due_km - current_odometer_km (negative when overdue)
        days_remaining:
          type: integer
          nullable: true
          description: Calendar days to next_due_at (negative when overdue)
        overdue:
          type: boolean
        urgency:
          type: string
          enum:
          - overdue
          - due_soon
    VehicleUtilization:
      type: object
      required:
      - vehicle_id
      - vehicle_plate
      - from
      - to
      - departures_count
      - km_traveled
      - hours_on_road
      - last_odometer_km
      - last_odometer_read_at
      properties:
        vehicle_id:
          type: string
          format: uuid
        vehicle_plate:
          type: string
          nullable: true
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        departures_count:
          type: integer
        km_traveled:
          type: integer
        hours_on_road:
          type: number
        last_odometer_km:
          type: integer
          nullable: true
        last_odometer_read_at:
          type: string
          format: date-time
          nullable: true
    CarrierTripStatus:
      type: string
      enum:
      - scheduled
      - in_progress
      - closed
      - cancelled
    CarrierTripState:
      type: object
      required:
      - trip_id
      - carrier_id
      - status
      - scheduled_at
      - started_at
      - closed_at
      - cancelled_at
      - shipments_count
      properties:
        trip_id:
          type: string
          format: uuid
        carrier_id:
          type: string
          format: uuid
        reference:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CarrierTripStatus'
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        shipments_count:
          type: integer
    CarrierAssignmentUnit:
      type: object
      required:
      - unit_id
      - sku
      - product_name
      - product_label
      - piece_index
      - piece_total
      properties:
        unit_id:
          type: string
          format: uuid
        sku:
          type: string
        product_name:
          type: string
          description: Nunca vacío (fallback SKU o "Producto").
        product_label:
          type: string
          example: Heladera Samsung · SKU-RD-1 (1 de 2)
        piece_index:
          type: integer
        piece_total:
          type: integer
    CarrierAssignmentShipment:
      type: object
      required:
      - shipment_id
      - external_id
      - order_reference
      - customer_name
      - destination_node
      - destination_node_id
      - units_count
      - units
      properties:
        shipment_id:
          type: string
          format: uuid
        external_id:
          type: string
        order_reference:
          type: string
          nullable: true
        customer_name:
          type: string
        destination_node:
          type: string
          nullable: true
          description: Nombre legible; null = domicilio del cliente.
        destination_node_id:
          type: string
          format: uuid
          nullable: true
        units_count:
          type: integer
        units:
          type: array
          items:
            $ref: '#/components/schemas/CarrierAssignmentUnit'
    CarrierAssignment:
      type: object
      required:
      - trip_id
      - carrier_id
      - carrier_name
      - reference
      - corridor_from
      - corridor_from_node_id
      - corridor_to
      - corridor_to_node_id
      - scheduled_at
      - status
      - started_at
      - closed_at
      - shipments_count
      - expected_units_count
      - shipments
      properties:
        trip_id:
          type: string
          format: uuid
        carrier_id:
          type: string
          format: uuid
        carrier_name:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        corridor_from:
