    DriverRouteStopStatus:
      type: string
      description: Stop state within the driver route
      enum:
      - PENDING
      - COMPLETED
      - FAILED
      - RESCHEDULED
    DriverRouteStatus:
      type: string
      description: Driver route state across the day
      enum:
      - PLANNED
      - IN_PROGRESS
      - COMPLETED
      - SUSPENDED
    DriverRouteStop:
      type: object
      description: A stop of the driver route — what the driver drops at one point
      required:
      - id
      - shipment_id
      - sequence
      - status
      - items
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sequence:
          type: integer
        order_reference:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
          description: Customer phone resolved from the shipment (cross-context). Null if unknown.
        address:
          type: string
          nullable: true
        address_reference:
          type: string
          nullable: true
          description: Address reference/landmark (gate, floor) resolved from the shipment. Null if unknown.
        items:
          type: array
          description: Order lines dropped at this stop, resolved from the shipment. Always present (empty when unknown).
          items:
            type: object
            required:
            - sku
            - name
            - quantity
            properties:
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
              image_url:
                type: string
                nullable: true
        eta_at:
          type: string
          format: date-time
          nullable: true
        lat:
          type: number
          format: float
          nullable: true
        lng:
          type: number
          format: float
          nullable: true
        status:
          $ref: '#/components/schemas/DriverRouteStopStatus'
        settled_at:
          type: string
          format: date-time
          nullable: true
        arrived_at:
          type: string
          format: date-time
          nullable: true
          description: First reported arrival at the stop (POST /app/deliveries/{shipmentId}/arrived).
        arrival_source:
          type: string
          nullable: true
          enum:
          - geofence
          - manual
          - null
        units_total:
          type: integer
          description: Number of physical products (shipment units) of the stop; the POD expects this many, not the sum of quantities.
        unit_ids:
          type: array
          items:
            type: string
        destination:
          type: object
          nullable: true
          description: >-
            Tipo de destino de la parada, para que la app muestre UNA acción: home → "Entregar" (POD);
            store/warehouse (hub/tienda/almacén) → "Descargar" (escaneo de descarga). Derivado de
            shipments.destination_node_id (null = home). Null si no se pudo resolver el envío.
          properties:
            type:
              type: string
              enum:
              - home
              - store
              - warehouse
            name:
              type: string
              nullable: true
            node_code:
              type: string
              nullable: true
            node_id:
              type: string
              format: uuid
              nullable: true
    DriverRoute:
      type: object
      description: The driver route sheet of a vehicle for a day, with its ordered stops
      required:
      - id
      - vehicle_id
      - route_date
      - status
      - total_stops
      - completed_stops
      - stops_remaining
      - stops
      properties:
        started_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        route_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DriverRouteStatus'
        total_stops:
          type: integer
        completed_stops:
          type: integer
        stops_remaining:
          type: integer
        current_stop:
          allOf:
          - $ref: '#/components/schemas/DriverRouteStop'
          nullable: true
        stops:
          type: array
          items:
            $ref: '#/components/schemas/DriverRouteStop'
        route_geometry:
          oneOf:
          - $ref: '#/components/schemas/RouteGeometry'
          - type: 'null'
          description: >-
            Planned route geometry, matched by vehicle+date: the street-level geometry persisted with the
            plan (computed on the fly if the plan still lacks it); if there is no plan, a straight line
            through the route stops in sequence. Null only when fewer than two stops have coordinates.
