        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        reported_at:
          type: string
          format: date-time
          description: Instante del reporte en ISO 8601
    TruckPositionInput:
      type: object
      required:
      - lat
      - lng
      - reported_at
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        reported_at:
          type: string
          format: date-time
          description: Instante del reporte en ISO 8601
