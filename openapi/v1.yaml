  /app/shipments:
    get:
      tags:
      - shipments
      operationId: listShipments
      summary: List received orders, optionally filtered by status and source
      description: >-
        Supports optional offset or cursor pagination (E-02). Without any pagination parameter the full
        collection is returned unchanged; with `page`/`per_page` or `cursor` the response is sliced and
        a `meta` object is added. Cursor pagination is preferred for this growing collection and uses
        keyset (seek by shipment `id`, a time-ordered UUID v7): `next_cursor` is an opaque token, so a
        deep page costs the same as the first one instead of scanning and discarding rows.
      parameters:
      - name: status
        in: query
        required: false
        description: >-
          One or more statuses, case-insensitive. Repeat `status[]=` or comma-separate (planned,received).
          Unknown values return 422.
        style: form
        explode: true
        schema:
          oneOf:
          - type: string
            example: planned,received
          - type: array
            items:
              $ref: '#/components/schemas/ShipmentStatus'
      - name: delivery_mode
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DeliveryMode'
      - name: include
        in: query
        required: false
        description: Comma-separated extras. `count_by_status` adds meta.count_by_status (same filters except status).
        schema:
          type: string
          example: count_by_status
      - name: source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderSource'
      - name: delivery_date_from
        in: query
        required: false
        description: Promised delivery date lower bound (inclusive). Shipments without a date are excluded.
        schema:
          type: string
          format: date
      - name: delivery_date_to
        in: query
        required: false
        description: Promised delivery date upper bound (inclusive); must be on or after delivery_date_from.
        schema:
          type: string
          format: date
      - name: destination_node_id
        in: query
        required: false
        description: >-
          Filtra por nodo destino. Para el rol Tienda se fuerza server-side a su nodo asignado e ignora
          este parámetro, de modo que una tienda solo ve sus propios envíos.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Orders matching the filters
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/ListMeta'
                    - type: object
                      properties:
                        count_by_status:
                          $ref: '#/components/schemas/ShipmentStatusCounts'
      security:
      - appBearer: []
