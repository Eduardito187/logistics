# ============================================================
# Nginx server block — logistics (dev)
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Ocultar versión de nginx (anti-detección platform)
    server_tokens off;

    # Headers de seguridad base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    charset utf-8;

    client_max_body_size 64M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ------------------------------------------------------------
    # Compresión HTTP (M-4 auditoría)
    # ------------------------------------------------------------
    # El JSON de la API y el HTML/CSS/JS de Filament viajaban SIN comprimir. gzip
    # está en el core de nginx (siempre disponible); brotli requiere un módulo que
    # NO trae la imagen oficial `nginx:alpine`, así que se deja gzip (y, en prod, se
    # recomienda brotli en el LB/CDN de borde). comp_level 5 = buen equilibrio
    # CPU/ratio. gzip_min_length evita comprimir respuestas diminutas (overhead).
    # gzip_vary añade `Vary: Accept-Encoding` para caches/CDN intermedias.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    # `text/html` NO se lista: nginx SIEMPRE lo comprime y repetirlo lanza un warning.
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/manifest+json
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Rutas Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # PHP-FPM upstream (container app)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Timeouts ALINEADOS (B-1 auditoría): PHP max_execution_time=60s y FPM
        # request_terminate_timeout=60s matan el worker a los 60s. nginx esperaba 300s
        # por un proceso ya muerto. Se deja 65s = un pelo por encima del tope de PHP,
        # para que nginx reciba el error/cierre de FPM (502/504 limpio) en vez de
        # cortar antes. Si se suben los timeouts de PHP/FPM, subir este en consonancia.
        fastcgi_read_timeout 65s;
        fastcgi_send_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Bloquear acceso a archivos ocultos (excepto .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear acceso directo a directorios internos Laravel. `storage` NO
    # va acá: `root` ya está fijado a `public/`, así que `/storage/...` en
    # una URL SIEMPRE resuelve al symlink público `public/storage ->
    # storage/app/public` (creado por `artisan storage:link`) — jamás puede
    # exponer el `storage/` real del proyecto (fuera de `public/`, nginx no
    # puede alcanzarlo). Bloquearlo acá rompía toda imagen subida por un
    # admin (FileUpload de Filament, ADR 025) con 404 aunque el archivo
    # existiera en disco y Laravel lo sirviera bien — bug real encontrado
    # verificando los widgets del Page Builder.
    location ~ ^/(vendor|bootstrap/cache|node_modules) {
        deny all;
        return 404;
    }

    # Assets estáticos con cache largo (versión hash via Vite).
    # IMPORTANTE: cae a Laravel (index.php) si el archivo no existe, en vez de
    # 404 duro — varias rutas .js/.css son dinámicas, generadas por PHP, no
    # archivos reales en public/ (ej. /livewire/livewire.js de Livewire, que
    # sirve el JS vía una Route, no un archivo publicado). Un try_files con
    # "=404" interceptaba esas rutas ANTES de llegar a PHP-FPM, rompiendo toda
    # interactividad de Livewire/Filament (login, etc.) sin ningún error
    # visible del lado de Laravel — el request nunca llegaba.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|woff|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
