                properties:
                  data:
                    type: object
                    required:
                    - event_id
                    - status
                    properties:
                      event_id:
                        type: string
                      status:
                        type: string
                        enum:
                        - ACKNOWLEDGED
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
