# Contrato OpenAPI de la plataforma logistica Dismac (FUENTE DE VERDAD del API v1).
# Generado por el integrador fusionando openapi/paths/*.yaml. Cada endpoint nuevo se
# agrega en su fragmento de contexto y se re-fusiona aca en el mismo cambio.
openapi: 3.1.0
info:
  title: Dismac Logistics API
  version: 1.0.0
  description: |
    Contrato de la plataforma logística Dismac. Es la FUENTE DE VERDAD entre este backend y la
    app interna (logistics-app), que genera su cliente Dart a partir de este archivo.

    Tres puertas:
      - /api/v1/app/*          → app interna Flutter (tokens por usuario + dispositivo)
      - /api/v1/channels/*     → app de clientes, web, call center (credenciales por canal)
      - /api/v1/integrations/* → SAP, transportistas, webhooks (credenciales de servicio)

    Regla: todo endpoint nuevo se agrega acá en el mismo cambio que lo implementa.
    Un cambio incompatible exige /v2: siempre habrá choferes con una versión vieja de la app.
servers:
- url: http://localhost:8110/api/v1
  description: Desarrollo local (docker compose)
tags:
- name: system
  description: Salud y metadatos de la API
- name: auth
  description: Authentication and device management across the three gates
- name: capacity
  description: Capacity definition and consumption
- name: Carriers
  description: Third-party carriers, tariffs and rating
- name: Sellers
  description: Marketplace sellers (onboarding, settlement terms, SKU catalog)
- name: Payments
  description: Commerce payments (gateway capture webhook, ADR 018)
- name: Inbound
  description: Marketplace inbound (ASN announcement, dock scheduling, goods receipt, labeling)
- name: Inventory
  description: Stock on-hand, available-to-promise and lots with ownership attribution
- name: Settlement
  description: Seller settlement (drafting, confirmation and payment)
- name: coverage
  description: Geographic coverage and serviceability
- name: execution
  description: 'Field execution: scans, reception and proof of delivery'
- name: Fleet
  description: Vehicles, drivers and crews
- name: labels
  description: QR labels emission and verification
- name: network
  description: Network nodes and lanes
- name: notifications
  description: Outbound notifications (push, email, SMS)
- name: planning
  description: Route and load planning
- name: Promise
  description: Delivery promise and slot reservation
- name: sap-connector
  description: SAP integration bridge (outbox)
- name: shipments
  description: Shipment lifecycle
- name: tracking
  description: Shipment tracking and events
- name: telemetry
  description: Vehicle GPS telemetry, live fleet, trips, geofences and misuse alerts
- name: outbox
- name: settings
- name: Access
  description: Identity, dynamic RBAC and integration tokens
- name: Returns
  description: Reverse logistics (customer returns and return-to-vendor, reception and disposition)
- name: SellerPortal
  description: Seller self-service portal (read-only, scoped by integration token)
paths:
  /health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Health of the API and its critical dependencies
      responses:
        '200':
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /app/capacity/available:
    get:
      tags:
      - capacity
      operationId: appGetAvailableCapacity
      summary: Available capacity for a bucket (internal app)
      description: Returns the capacity bucket for a given scope, date, time slot and unit.
      parameters:
      - $ref: '#/components/parameters/CapacityMunicipalityId'
      - $ref: '#/components/parameters/CapacityNodeId'
      - $ref: '#/components/parameters/CapacityZoneId'
      - $ref: '#/components/parameters/CapacityDate'
      - $ref: '#/components/parameters/CapacityTimeSlot'
      - $ref: '#/components/parameters/CapacityUnit'
      responses:
        '200':
          description: The capacity bucket was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityBucketEnvelope'
        '404':
          description: No bucket exists for the requested key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityError'
        '422':
          $ref: '#/components/responses/CapacityValidationError'
      security:
      - appBearer: []
  /app/capacity/calendar:
    get:
      tags:
      - capacity
      operationId: appListCapacityCalendar
      summary: Capacity calendar for a date (internal app)
      description: Lists every capacity bucket of a day across all scopes, slots and units.
      parameters:
      - $ref: '#/components/parameters/CapacityDate'
      - $ref: '#/components/parameters/CapacityMunicipalityId'
      responses:
        '200':
          description: Buckets for the requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityCalendarEnvelope'
        '422':
          $ref: '#/components/responses/CapacityValidationError'
      security:
      - appBearer: []
  /app/capacity/effective:
    get:
      tags:
      - capacity
      operationId: appGetEffectiveCapacity
      summary: Effective capacity for a key (internal app)
      description: 'Returns the effective capacity for a scope/date/slot/unit: the explicit bucket when it exists,
        otherwise the default total from the configurable rules, or zero when neither applies. Never 404s.'
      parameters:
      - $ref: '#/components/parameters/CapacityMunicipalityId'
      - $ref: '#/components/parameters/CapacityNodeId'
      - $ref: '#/components/parameters/CapacityZoneId'
      - $ref: '#/components/parameters/CapacityDate'
      - $ref: '#/components/parameters/CapacityTimeSlot'
      - $ref: '#/components/parameters/CapacityUnit'
      responses:
        '200':
          description: Effective capacity for the requested key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveCapacityEnvelope'
        '422':
          $ref: '#/components/responses/CapacityValidationError'
      security:
      - appBearer: []
  /app/carriers:
    get:
      tags:
      - Carriers
      summary: List carriers
      operationId: listCarriers
      description: >-
        Supports optional offset or cursor pagination (E-02). Without pagination parameters the full
        collection is returned unchanged; otherwise it is sliced and a `meta` object is added.
        Alcance server-side: oficina (admin/supervisor) ve todos; el rol transportista recibe SOLO su
        propio transportista (users.carrier_id; leerlo de /app/auth/me → user.carrier). Otros roles o un
        transportista sin vínculo → 403.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - suspended
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Carrier list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Carrier'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/me/assignments:
    get:
      tags:
      - Carriers
      summary: List trips assigned to the carrier (with load)
      operationId: listCarrierAssignments
      description: >-
        Rol transportista: solo los viajes de su transportista (users.carrier_id; se ignora carrier_id).
        Oficina: todos, filtro opcional carrier_id. Por defecto solo vigentes (scheduled,in_progress).
      parameters:
      - name: carrier_id
        in: query
        required: false
        description: Filtro de oficina; ignorado para transportista.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: 'Lista separada por coma: scheduled,in_progress,closed,cancelled'
        schema:
          type: string
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Assigned trips
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarrierAssignment'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
        '422':
          description: Invalid status filter (RFC 7807 validation_failed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - appBearer: []
  /app/carriers/trips/{tripId}/start:
    post:
      tags:
      - Carriers
      summary: Start a carrier trip (idempotent)
      operationId: startCarrierTrip
      description: Oficina o el transportista dueño del viaje. Repetir devuelve el mismo started_at.
      parameters:
      - $ref: '#/components/parameters/CarrierTripId'
      responses:
        '200':
          $ref: '#/components/responses/CarrierTripState'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
        '404':
          description: Trip not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid transition (closed/cancelled, or no shipments) — business_rule_violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - appBearer: []
  /app/carriers/trips/{tripId}/close:
    post:
      tags:
      - Carriers
      summary: Close a carrier trip (idempotent)
      operationId: closeCarrierTrip
      description: Oficina o el transportista dueño. Solo un viaje en ruta; repetir devuelve el mismo closed_at.
      parameters:
      - $ref: '#/components/parameters/CarrierTripId'
      responses:
        '200':
          $ref: '#/components/responses/CarrierTripState'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
        '404':
          description: Trip not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid transition (not in progress) — business_rule_violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - appBearer: []
  /app/carriers/assignment:
    get:
      tags:
      - Carriers
      summary: Assign a corridor to a vehicle class by volume
      operationId: assignCarrierForVolume
      description: |
        Solo oficina (admin/supervisor): compara tarifas de todos los transportistas. Otros roles → 403.
        Devuelve la clase de vehículo que corresponde al volumen (m³) y la tarifa más barata disponible para esa clase en el corredor (consolidación entre departamentos).
      parameters:
      - name: corridor_from
        in: query
        required: true
        schema:
          type: string
      - name: corridor_to
        in: query
        required: true
        schema:
          type: string
      - name: corridor_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CorridorType'
      - name: volume_m3
        in: query
        required: true
        schema:
          type: number
          format: float
          minimum: 0
      responses:
        '200':
          description: Corridor assignment
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Assignment'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/settlements:
    get:
      tags:
      - Carriers
      summary: List carrier settlements
      operationId: listCarrierSettlements
      description: >-
        Alcance server-side: oficina (admin/supervisor) ve todas y puede filtrar por `carrier_id`. Para el
        rol transportista el `carrier_id` enviado se IGNORA y se devuelven solo las liquidaciones de su
        transportista (users.carrier_id). Transportista sin vínculo u otros roles → 403.
      parameters:
      - name: carrier_id
        in: query
        required: false
        description: Filtro de oficina. Ignorado para el rol transportista (se fuerza el suyo).
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SettlementStatus'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Settlement list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settlement'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}:
    get:
      tags:
      - Carriers
      summary: Get a carrier settlement
      operationId: getCarrierSettlement
      description: >-
        Oficina: cualquier liquidación. Rol transportista: solo las de su transportista; una ajena (o
        inexistente) responde 403 sin revelar si existe.
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Settlement'
        '404':
          $ref: '#/components/responses/CarriersNotFound'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}/approve:
    post:
      tags:
      - Carriers
      summary: Approve a settlement
      operationId: approveCarrierSettlement
      description: >-
        Solo oficina (admin/supervisor). El transportista no aprueba su propia liquidación (segregación de
        funciones) → 403.
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '202':
          description: Approval accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}/dispute:
    post:
      tags:
      - Carriers
      summary: Dispute a settlement
      operationId: disputeCarrierSettlement
      description: >-
        Oficina: cualquier liquidación. Rol transportista: solo las de su transportista; ajena → 403.
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeSettlementRequest'
      responses:
        '202':
          description: Dispute accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}/pay:
    post:
      tags:
      - Carriers
      summary: Mark a settlement as paid
      operationId: payCarrierSettlement
      description: >-
        Solo oficina (admin/supervisor): el pago lo registra finanzas, no el proveedor. Rol transportista → 403.
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSettlementPaidRequest'
      responses:
        '202':
          description: Payment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/tariffs/cheapest:
    get:
      tags:
      - Carriers
      summary: Cheapest tariff for a corridor
      operationId: cheapestCarrierTariff
      description: Solo oficina (admin/supervisor) — compara tarifas de todos los transportistas. Otros roles → 403.
      parameters:
      - name: corridor_from
        in: query
        required: true
        schema:
          type: string
      - name: corridor_to
        in: query
        required: true
        schema:
          type: string
      - name: corridor_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CorridorType'
      responses:
        '200':
          description: Cheapest tariff
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tariff'
        '404':
          $ref: '#/components/responses/CarriersNotFound'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/carriers/{carrierId}/tariff:
    get:
      tags:
      - Carriers
      summary: Get a carrier tariff for a corridor and vehicle class
      operationId: getCarrierTariff
      description: Oficina — cualquier transportista. Rol transportista — solo `{carrierId}` propio; ajeno → 403.
      parameters:
      - $ref: '#/components/parameters/CarrierId'
      - name: corridor_from
        in: query
        required: true
        schema:
          type: string
      - name: corridor_to
        in: query
        required: true
        schema:
          type: string
      - name: corridor_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CorridorType'
      - name: vehicle_class
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/VehicleClass'
      responses:
        '200':
          description: Tariff
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tariff'
        '404':
          $ref: '#/components/responses/CarriersNotFound'
        '403':
          $ref: '#/components/responses/CarrierScopeForbidden'
      security:
      - appBearer: []
  /app/coverage/zones:
    get:
      tags:
      - coverage
      operationId: listCoverageZones
      summary: List coverage zones
      description: Lista todas las zonas de cobertura con su polígono GeoJSON y reglas (visor de zonas).
      responses:
        '200':
          description: Colección de zonas
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoverageZone'
      security:
      - appBearer: []
  /app/coverage/zones/resolve:
    get:
      tags:
      - coverage
      operationId: resolveCoverageZoneForPoint
      summary: Resolve which coverage zone contains a point
      description: |
        Devuelve la zona de cobertura que contiene el punto (lat, lng) con su nodo de atención y reglas. Responde 404 si ningún polígono contiene el punto.
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: float
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          format: float
          minimum: -180
          maximum: 180
      responses:
        '200':
          description: Zona encontrada
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CoverageZone'
        '404':
          description: Ninguna zona contiene el punto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageError'
        '422':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - appBearer: []
  /app/deliveries/failed:
    post:
      tags:
      - execution
      operationId: recordFailedDelivery
      summary: Record a failed delivery attempt with its typed reason
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailedDeliveryRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/photos:
    post:
      tags:
      - execution
      operationId: uploadDeliveryPhoto
      summary: Upload an evidence photo (proof of delivery or damage) and get its storage reference
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - shipment_id
              - photo
              properties:
                shipment_id:
                  type: string
                  format: uuid
                photo:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum:
                  - pod
                  - damage
                  default: pod
                  description: Tipo de evidencia; elige el disco (pod = prueba de entrega, damage = daños). Por defecto pod.
                idempotency_key:
                  type: string
                  maxLength: 255
                  description: Fallback for the Idempotency-Key header. Same key returns the original stored reference; the photo is never stored twice.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Same key returns the original stored reference (201); the photo is never stored twice.
        schema:
          type: string
          maxLength: 255
      responses:
        '201':
          description: The stored evidence reference
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - kind
                    - disk
                    - path
                    - url
                    properties:
                      kind:
                        type: string
                        enum:
                        - pod
                        - damage
                      disk:
                        type: string
                        description: Disco de evidencia donde quedó la foto
                      path:
                        type: string
                        description: Referencia durable (relativa al disco); viaja como photo_path en la prueba de entrega
                      url:
                        type: string
                        format: uri
                        nullable: true
                        description: URL de acceso si el disco la expone; null en discos privados
        '500':
          description: The evidence could not be stored after retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionError'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/evidence:
    post:
      tags:
      - execution
      operationId: captureDeliveryEvidence
      summary: Capture delivery evidence linked to the customer (anti-fraud)
      description: |
        Captura una evidencia de entrega LIGADA AL CLIENTE (firma, documento, prueba de entrega o daño).
        Guarda el archivo, calcula su HASH SHA-256 (integridad: una evidencia no se puede intercambiar por
        otra) y deja el hecho con AUDITORÍA inmutable (quién/cuándo/GPS) más el snapshot de la identidad del
        cliente contra el que se valida. El estado de validación arranca `pending`: lo resuelve un validador
        asíncrono on-premise (nunca bloquea la entrega). Idempotente por `Idempotency-Key`. Devuelve el
        estado completo de las evidencias del envío (la nueva primero).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - shipment_id
              - kind
              - photo
              properties:
                shipment_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum:
                  - pod
                  - damage
                  - signature
                  - id_document
                photo:
                  type: string
                  format: binary
                customer_id:
                  type: string
                  nullable: true
                document_id:
                  type: string
                  nullable: true
                  description: Número de documento del cliente (contra el que se valida la foto del carnet)
                customer_name:
                  type: string
                  nullable: true
                customer_phone:
                  type: string
                  nullable: true
                lat:
                  type: number
                  nullable: true
                lng:
                  type: number
                  nullable: true
                captured_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          description: Evidence captured; full evidence collection of the shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEvidenceCollection'
        '500':
          description: The evidence could not be stored or hashed
