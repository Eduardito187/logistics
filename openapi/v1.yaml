  /app/auth/login:
    post:
      tags:
      - auth
      operationId: appLogin
      summary: Log in with user credentials bound to a device (gate /app)
      description: >-
        Public endpoint (rate limited). Validates the user's credentials, binds the device and issues a
        new Sanctum token, revoking previous tokens for that same device.


        Sesión 1-por-plataforma (estilo app de banco): hay a lo sumo UNA sesión activa por BUCKET
        (`web` | `app`) por usuario. `web` y `app` coexisten; iniciar sesión en uno no cierra el otro.
        Un segundo dispositivo del MISMO bucket DESALOJA al anterior: ese equipo recibe, en su próximo
        request a la puerta /app, un 401 con `code=session_superseded` (distinto del token expirado), para
        que la app avise "iniciaste sesión en otro dispositivo" y cierre. El bucket se deriva de
        `device.platform` (android/ios = app; web/desktop = web) o se fuerza con `device.client_kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppLoginRequest'
      responses:
        '200':
          description: >-
            Session started; token issued. Si el usuario tiene 2FA activo, en lugar de la sesión se
            devuelve un desafío de segundo factor (TwoFactorChallenge) que debe resolverse en
            /app/auth/2fa/verify.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AppLoginResponse'
                - $ref: '#/components/schemas/TwoFactorChallenge'
        '422':
          $ref: '#/components/responses/AppAuthValidationError'
      security: []
  /app/auth/logout:
    post:
      tags:
      - auth
      operationId: appLogout
      summary: Log out, revoking only the token in use (gate /app)
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
      - appBearer: []
  /app/auth/refresh:
    post:
      tags:
      - auth
      operationId: appRefresh
      summary: Rotate the current token for the same device (gate /app)
      responses:
        '200':
          description: New token issued; previous one revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTokenResponse'
        '422':
          $ref: '#/components/responses/AppAuthValidationError'
      security:
      - appBearer: []
  /app/auth/me:
    get:
      tags:
      - auth
      operationId: appMe
      summary: Current user profile, device and abilities (gate /app)
      responses:
        '200':
          description: Authenticated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMeResponse'
      security:
      - appBearer: []
  /app/auth/2fa/enroll:
    post:
      tags:
      - auth
      operationId: appTwoFactorEnroll
      summary: Start two-factor enrollment for the current user (gate /app)
      description: >-
        Genera un secreto TOTP, su URI otpauth y códigos de recuperación para el usuario autenticado.
        El segundo factor no queda activo hasta confirmarlo en /app/auth/2fa/confirm.
      responses:
        '200':
          description: Enrollment started; secret and recovery codes issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnrollment'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - appBearer: []
  /app/auth/2fa/confirm:
    post:
      tags:
      - auth
      operationId: appTwoFactorConfirm
      summary: Confirm and activate two-factor enrollment (gate /app)
      description: >-
        Confirma el enrolamiento validando un código TOTP generado por la app autenticadora. Una vez
        confirmado, el segundo factor queda activo para el usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: Código TOTP de 6 dígitos generado por la app autenticadora.
      responses:
        '200':
          description: Two-factor confirmed and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid or expired code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - appBearer: []
  /app/auth/2fa/verify:
    post:
      tags:
      - auth
      operationId: appTwoFactorVerify
      summary: Resolve a two-factor challenge and start the session (gate /app)
      description: >-
        Endpoint público (rate limited). Resuelve el desafío de segundo factor emitido por /app/auth/login
        y, si el código es válido, emite la sesión (token) de la misma forma que un login normal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge_id
              - code
              properties:
                challenge_id:
                  type: string
                  description: Identificador del desafío devuelto por /app/auth/login.
                code:
                  type: string
                  description: Código TOTP o de recuperación.
                email:
                  type: string
                  format: email
                  description: Correo del usuario (opcional, refuerza la validación del desafío).
      responses:
        '200':
          description: Second factor verified; session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppLoginResponse'
        '422':
          description: Invalid or expired code/challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /app/auth/2fa/disable:
    post:
      tags:
      - auth
      operationId: appTwoFactorDisable
      summary: Disable two-factor for the current user (gate /app)
      description: >-
        Desactiva el segundo factor del usuario autenticado. Debe acreditarse con un código TOTP vigente
        o con la contraseña de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Acreditar con un código TOTP vigente o con la contraseña de la cuenta.
              properties:
                code:
                  type: string
                  description: Código TOTP de 6 dígitos.
                password:
                  type: string
                  description: Contraseña actual de la cuenta.
      responses:
        '200':
          description: Two-factor disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid credentials for disabling two-factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - appBearer: []
  /app/auth/password/forgot:
    post:
      tags:
      - auth
      operationId: appPasswordForgot
      summary: Request a password reset OTP by email (gate /app)
      description: >-
        Endpoint público (rate limited). Envía un código OTP de un solo uso al correo del usuario para
