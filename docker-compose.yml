# ============================================================
# docker-compose.yml — logistics (DESARROLLO)
# ============================================================
# Containers prefijados `dismac_lg_*` y puertos propios para correr en paralelo
# con dis-commerce (8090/3316/6389) y el resto de proyectos Dismac.
# ============================================================

name: dismac-logistics

x-php: &php
    build:
        context: .
        dockerfile: .docker/php/Dockerfile
        target: dev
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    image: dismac/logistics-app:dev
    volumes:
        - .:/var/www/html:cached
        - vendor:/var/www/html/vendor
    environment:
        APP_ENV: local
        DB_CONNECTION: pgsql
        DB_HOST: postgres
        DB_PORT: 5432
        DB_DATABASE: logistics
        DB_USERNAME: logistics
        DB_PASSWORD: logistics
        REDIS_HOST: valkey
        REDIS_PORT: 6379
    depends_on:
        postgres:
            condition: service_healthy
        valkey:
            condition: service_healthy
    networks:
        - dismac_lg

services:
    # -------------------- Aplicación PHP-FPM --------------------
    app:
        <<: *php
        container_name: dismac_lg_app
        restart: unless-stopped
        volumes:
            - .:/var/www/html:cached
            - vendor:/var/www/html/vendor
            - composer_cache:/home/logistics/.composer/cache

    # -------------------- Nginx (web server) --------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: dismac_lg_nginx
        restart: unless-stopped
        ports:
            - "${DOCKER_APP_PORT:-8110}:80"
        volumes:
            - .:/var/www/html:cached
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - dismac_lg

    # -------------------- PostgreSQL + PostGIS --------------------
    # PostGIS resuelve zonas de cobertura (polígonos), geocercas y distancias (ADR 003).
    postgres:
        image: postgis/postgis:17-3.5-alpine
        container_name: dismac_lg_postgres
        restart: unless-stopped
        ports:
            - "${DOCKER_DB_PORT:-5442}:5432"
        environment:
            POSTGRES_DB: logistics
            POSTGRES_USER: logistics
            POSTGRES_PASSWORD: logistics
            TZ: America/La_Paz
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./.docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - dismac_lg

    # -------------------- Valkey (cache + colas + locks) --------------------
    valkey:
        image: valkey/valkey:8-alpine
        container_name: dismac_lg_valkey
        restart: unless-stopped
        ports:
            - "${DOCKER_REDIS_PORT:-6409}:6379"
        volumes:
            - valkey_data:/data
        command: valkey-server --appendonly yes
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - dismac_lg

    # -------------------- OSRM (motor de rutas OpenStreetMap, ADR 009) --------------------
    # Sirve las matrices `/table` y las geometrías `/route`/`/trip` para el ruteo de flota.
    # Reemplaza al OSRM demo público (sin cuotas y sin que las coordenadas de clientes salgan
    # a un tercero). Siempre encendido (sin `profiles`): planning y telemetry apuntan aquí vía
    # OSRM_HOST=http://osrm:5000, y el ruteo cae a haversine solo si el servicio está caído.
    #
    # Requiere el extracto de Bolivia preprocesado (osrm-extract/partition/customize) dentro de
    # `.docker/osrm/data`. El preprocesado NO corre aquí (es pesado): ver docs/routing-selfhost.md.
    # Mientras no exista `bolivia-latest.osrm`, el contenedor reinicia en bucle a propósito: es la
    # señal de que falta correr el runbook, no un fallo de configuración.
    osrm:
        image: osrm/osrm-backend:latest
        container_name: dismac_lg_osrm
        restart: unless-stopped
        # Algoritmo MLD (partition + customize): permite actualizar tiempos sin recontraer todo el
        # grafo. `--max-table-size` sube el tope de la matriz /table al volumen diario esperado.
        command: osrm-routed --algorithm mld --max-table-size 10000 /data/bolivia-latest.osrm
        ports:
            - "${DOCKER_OSRM_PORT:-5010}:5000"
        volumes:
            # El extracto OSM de Bolivia y sus artefactos preprocesados viven aquí (fuera de git).
            - ./.docker/osrm/data:/data
        networks:
            - dismac_lg

    # -------------------- VROOM (solver VRP/VRPTW opcional, ADR 009) --------------------
    # Backend de ruteo opt-in para escala y ventanas horarias duras (VRPTW). Se usa solo cuando
    # PLANNING_ROUTING_BACKEND=vroom; con `builtin` (por defecto) queda ocioso pero encendido, así
    # cambiar de backend no exige levantar servicios a mano. Resuelve apoyándose en el OSRM propio.
    # vroom-express expone la API HTTP en :3000; planning lo alcanza vía VROOM_URL=http://vroom:3000.
    vroom:
        image: vroomvrp/vroom-docker:latest
        container_name: dismac_lg_vroom
        restart: unless-stopped
        environment:
            # Deja que vroom-express lea el config montado en lugar de regenerarlo en cada arranque.
            VROOM_ROUTER: osrm
        volumes:
            - ./.docker/vroom/config.yml:/conf/config.yml:ro
        ports:
            - "${DOCKER_VROOM_PORT:-3010}:3000"
        depends_on:
            - osrm
        networks:
            - dismac_lg

    # -------------------- Nominatim (geocoder OpenStreetMap self-host) --------------------
    # Geocoder open-source (OSM) que resuelve direcciones → coordenada. Reemplaza a Google: cero
    # servicios de pago, cero claves, y las direcciones de clientes no salen a un tercero. Siempre
    # encendido (sin `profiles`): shipments apunta aquí vía NOMINATIM_URL=http://nominatim:8080 y, si
    # está caído/sin datos, el geocoder cae al stub neutro (NullGeocoder) sin romper el ingreso.
    #
    # Requiere importar el extracto OSM de Bolivia (bolivia-latest.osm.pbf en `.docker/nominatim/data`).
    # El import es MUY pesado y NO corre aquí automáticamente sin el PBF: ver docs/maps-geocoder-selfhost.md.
    # Mientras no exista el PBF / no termine el import, el contenedor reinicia en bucle a propósito: es la
    # señal de que falta correr el runbook, no un fallo de configuración.
    nominatim:
        image: mediagis/nominatim:4.4
        container_name: dismac_lg_nominatim
        restart: unless-stopped
        environment:
            # Extracto OSM a importar (montado abajo). Geofabrik publica `bolivia-latest.osm.pbf`.
            PBF_PATH: /nominatim/data/bolivia-latest.osm.pbf
            # Actualizaciones incrementales de Bolivia (opcional; el runbook explica cómo activarlas).
            REPLICATION_URL: https://download.geofabrik.de/south-america/bolivia-updates/
            # Contraseña de la base interna de Nominatim (solo dentro del contenedor).
            NOMINATIM_PASSWORD: nominatim
        ports:
            - "${DOCKER_NOMINATIM_PORT:-8081}:8080"
        volumes:
            # Base PostgreSQL del índice de Nominatim (persiste el import, fuera de git).
            - nominatim_data:/var/lib/postgresql/14/main
            # Extracto OSM de Bolivia y artefactos del import (fuera de git).
            - ./.docker/nominatim/data:/nominatim/data
        # El import de Nominatim usa memoria compartida intensiva; sin esto, PostgreSQL falla.
        shm_size: 1g
        networks:
            - dismac_lg

    # -------------------- Tileserver (teselas de mapa OpenStreetMap self-host) --------------------
    # Sirve las teselas raster del estilo osm-bright a los mapas Leaflet (admin + seguimiento público).
    # Reemplaza a tile.openstreetmap.org / tiles de pago: todo OSM self-host. Siempre encendido (sin
    # `profiles`): las vistas apuntan aquí vía MAP_TILE_URL=http://localhost:8082/styles/osm-bright/{z}/{x}/{y}.png
    # (puerto del host, porque las teselas las pide el navegador). Si no hay self-host configurado, las
    # vistas caen al tile público de OSM (solo demo).
    #
    # Requiere el mbtiles/pmtiles de Bolivia y la config del estilo en `.docker/tileserver/data` (config.json
    # + estilo osm-bright + el .mbtiles). La generación es pesada y NO corre aquí: ver
    # docs/maps-geocoder-selfhost.md. Sin esos datos el contenedor reinicia en bucle a propósito.
    tileserver:
        image: maptiler/tileserver-gl:latest
        container_name: dismac_lg_tileserver
        restart: unless-stopped
        command: --config /data/config.json --port 8080
        ports:
            - "${DOCKER_TILESERVER_PORT:-8082}:8080"
        volumes:
            # config.json, estilo osm-bright y el .mbtiles de Bolivia (fuera de git).
            - ./.docker/tileserver/data:/data
        networks:
            - dismac_lg

    # -------------------- Queue worker (siempre encendido) --------------------
    # Sin `profiles` a propósito: en dis-commerce un worker opcional que nadie levantó dejó
    # jobs sin procesar por más de 1 h. `--max-time` recicla el proceso para no correr código viejo.
    queue-worker:
        <<: *php
        container_name: dismac_lg_queue_worker
        restart: unless-stopped
        command: php artisan queue:work redis --sleep=3 --tries=1 --timeout=600 --max-time=3600
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # -------------------- Scheduler (siempre encendido) --------------------
    scheduler:
        <<: *php
        container_name: dismac_lg_scheduler
        restart: unless-stopped
        command: php artisan schedule:work
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'schedule:work' || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # -------------------- Mailpit (email catcher) --------------------
    # El email es canal de notificación al cliente (ADR 006), así que se prueba local.
    mailpit:
        image: axllent/mailpit:latest
        container_name: dismac_lg_mailpit
        restart: unless-stopped
        ports:
            - "${DOCKER_MAILPIT_SMTP:-1055}:1025"
            - "${DOCKER_MAILPIT_UI:-8055}:8025"
        environment:
            MP_MAX_MESSAGES: 5000
            MP_DATABASE: /data/mailpit.db
        volumes:
            - mailpit_data:/data
        networks:
            - dismac_lg

    # -------------------- Node (Vite + npm, bajo demanda) --------------------
    node:
        image: node:22-alpine
        container_name: dismac_lg_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html:cached
            - node_modules:/var/www/html/node_modules
        ports:
            - "${DOCKER_VITE_PORT:-5203}:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - dismac_lg
        profiles:
            - node

    # ============================================================
    # AÑADIDO — frente notificaciones (2026-10): servidor ntfy self-host.
    # ------------------------------------------------------------
    # Push de la app de clientes (UnifiedPush) y, opcionalmente, Web Push (VAPID) del
    # contexto `notifications`. Es 100% open-source y gratis; reemplaza a Firebase/FCM.
    # La plataforma publica con un simple HTTP POST a http://ntfy:80/shipment_<id>.
    #
    # NOTA: este bloque agrega SOLO el servicio `ntfy` (otra oleada también edita este
    # compose). Usa un bind-mount para la caché (no toca el bloque `volumes:`) y la red
    # `dismac_lg` ya existente. Por defecto, anónimo (dev): publicar/suscribir sin auth.
    #
    # Web Push (VAPID) — opcional, para la página de tracking web. ntfy lo soporta nativo
    # pero exige las CUATRO variables juntas (si falta una, el server no arranca), así que
    # queda COMENTADO hasta generar las claves:
    #   docker compose exec ntfy ntfy webpush keys   # imprime VAPID_PUBLIC_KEY/PRIVATE_KEY
    # y luego descomentar las líneas NTFY_WEB_PUSH_* de abajo (con las claves en .env).
    # --------------------------------------------------------------
    ntfy:
        image: binwiederhier/ntfy:latest
        container_name: dismac_lg_ntfy
        restart: unless-stopped
        command: serve
        environment:
            TZ: America/La_Paz
            NTFY_BASE_URL: ${NTFY_URL:-http://ntfy:80}
            NTFY_LISTEN_HTTP: ":80"
            NTFY_BEHIND_PROXY: "true"
            NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
            NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
            # --- Web Push (VAPID): descomentar las cuatro juntas tras generar las claves ---
            # NTFY_WEB_PUSH_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            # NTFY_WEB_PUSH_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
            # NTFY_WEB_PUSH_EMAIL_ADDRESS: ${VAPID_SUBJECT:-mailto:no-reply@dismac.test}
            # NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
        volumes:
            - ./.docker/ntfy/cache:/var/cache/ntfy
        ports:
            - "${DOCKER_NTFY_PORT:-8120}:80"
        networks:
            - dismac_lg

volumes:
    postgres_data:
    valkey_data:
    vendor:
    node_modules:
    composer_cache:
    mailpit_data:
    nominatim_data:

networks:
    dismac_lg:
        driver: bridge
        name: dismac_lg_network
