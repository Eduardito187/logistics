# Contrato OpenAPI de la plataforma logistica Dismac (FUENTE DE VERDAD del API v1).
# Generado por el integrador fusionando openapi/paths/*.yaml. Cada endpoint nuevo se
# agrega en su fragmento de contexto y se re-fusiona aca en el mismo cambio.
openapi: 3.1.0
info:
  title: Dismac Logistics API
  version: 1.0.0
  description: |
    Contrato de la plataforma logística Dismac. Es la FUENTE DE VERDAD entre este backend y la
    app interna (logistics-app), que genera su cliente Dart a partir de este archivo.

    Tres puertas:
      - /api/v1/app/*          → app interna Flutter (tokens por usuario + dispositivo)
      - /api/v1/channels/*     → app de clientes, web, call center (credenciales por canal)
      - /api/v1/integrations/* → SAP, transportistas, webhooks (credenciales de servicio)

    Regla: todo endpoint nuevo se agrega acá en el mismo cambio que lo implementa.
    Un cambio incompatible exige /v2: siempre habrá choferes con una versión vieja de la app.
servers:
- url: http://localhost:8110/api/v1
  description: Desarrollo local (docker compose)
tags:
- name: system
  description: Salud y metadatos de la API
- name: auth
  description: Authentication and device management across the three gates
- name: capacity
  description: Capacity definition and consumption
- name: Carriers
  description: Third-party carriers, tariffs and rating
- name: Sellers
  description: Marketplace sellers (onboarding, settlement terms, SKU catalog)
- name: Payments
  description: Commerce payments (gateway capture webhook, ADR 018)
- name: Inbound
  description: Marketplace inbound (ASN announcement, dock scheduling, goods receipt, labeling)
- name: Inventory
  description: Stock on-hand, available-to-promise and lots with ownership attribution
- name: Settlement
  description: Seller settlement (drafting, confirmation and payment)
- name: coverage
  description: Geographic coverage and serviceability
- name: execution
  description: 'Field execution: scans, reception and proof of delivery'
- name: Fleet
  description: Vehicles, drivers and crews
- name: labels
  description: QR labels emission and verification
- name: network
  description: Network nodes and lanes
- name: notifications
  description: Outbound notifications (push, email, SMS)
- name: planning
  description: Route and load planning
- name: Promise
  description: Delivery promise and slot reservation
- name: sap-connector
  description: SAP integration bridge (outbox)
- name: shipments
  description: Shipment lifecycle
- name: tracking
  description: Shipment tracking and events
- name: telemetry
  description: Vehicle GPS telemetry, live fleet, trips, geofences and misuse alerts
- name: outbox
- name: settings
- name: Access
  description: Identity, dynamic RBAC and integration tokens
- name: Returns
  description: Reverse logistics (customer returns and return-to-vendor, reception and disposition)
- name: SellerPortal
  description: Seller self-service portal (read-only, scoped by integration token)
paths:
  /health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Health of the API and its critical dependencies
      responses:
        '200':
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /app/capacity/available:
    get:
      tags:
      - capacity
      operationId: appGetAvailableCapacity
      summary: Available capacity for a bucket (internal app)
      description: Returns the capacity bucket for a given scope, date, time slot and unit.
      parameters:
      - $ref: '#/components/parameters/CapacityMunicipalityId'
      - $ref: '#/components/parameters/CapacityNodeId'
      - $ref: '#/components/parameters/CapacityZoneId'
      - $ref: '#/components/parameters/CapacityDate'
      - $ref: '#/components/parameters/CapacityTimeSlot'
      - $ref: '#/components/parameters/CapacityUnit'
      responses:
        '200':
          description: The capacity bucket was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityBucketEnvelope'
        '404':
          description: No bucket exists for the requested key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityError'
        '422':
          $ref: '#/components/responses/CapacityValidationError'
      security:
      - appBearer: []
  /app/capacity/calendar:
    get:
      tags:
      - capacity
      operationId: appListCapacityCalendar
      summary: Capacity calendar for a date (internal app)
      description: Lists every capacity bucket of a day across all scopes, slots and units.
      parameters:
      - $ref: '#/components/parameters/CapacityDate'
      - $ref: '#/components/parameters/CapacityMunicipalityId'
      responses:
        '200':
          description: Buckets for the requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityCalendarEnvelope'
        '422':
          $ref: '#/components/responses/CapacityValidationError'
      security:
      - appBearer: []
  /app/capacity/effective:
    get:
      tags:
      - capacity
      operationId: appGetEffectiveCapacity
      summary: Effective capacity for a key (internal app)
      description: 'Returns the effective capacity for a scope/date/slot/unit: the explicit bucket when it exists,
        otherwise the default total from the configurable rules, or zero when neither applies. Never 404s.'
      parameters:
      - $ref: '#/components/parameters/CapacityMunicipalityId'
      - $ref: '#/components/parameters/CapacityNodeId'
      - $ref: '#/components/parameters/CapacityZoneId'
      - $ref: '#/components/parameters/CapacityDate'
      - $ref: '#/components/parameters/CapacityTimeSlot'
      - $ref: '#/components/parameters/CapacityUnit'
      responses:
        '200':
          description: Effective capacity for the requested key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveCapacityEnvelope'
        '422':
          $ref: '#/components/responses/CapacityValidationError'
      security:
      - appBearer: []
  /app/carriers:
    get:
      tags:
      - Carriers
      summary: List carriers
      operationId: listCarriers
      description: >-
        Supports optional offset or cursor pagination (E-02). Without pagination parameters the full
        collection is returned unchanged; otherwise it is sliced and a `meta` object is added.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - suspended
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Carrier list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Carrier'
                  meta:
                    oneOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - $ref: '#/components/schemas/CursorMeta'
      security:
      - appBearer: []
  /app/carriers/assignment:
    get:
      tags:
      - Carriers
      summary: Assign a corridor to a vehicle class by volume
      operationId: assignCarrierForVolume
      description: |
        Devuelve la clase de vehículo que corresponde al volumen (m³) y la tarifa más barata disponible para esa clase en el corredor (consolidación entre departamentos).
      parameters:
      - name: corridor_from
        in: query
        required: true
        schema:
          type: string
      - name: corridor_to
        in: query
        required: true
        schema:
          type: string
      - name: corridor_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CorridorType'
      - name: volume_m3
        in: query
        required: true
        schema:
          type: number
          format: float
          minimum: 0
      responses:
        '200':
          description: Corridor assignment
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Assignment'
      security:
      - appBearer: []
  /app/carriers/settlements:
    get:
      tags:
      - Carriers
      summary: List carrier settlements
      operationId: listCarrierSettlements
      parameters:
      - name: carrier_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SettlementStatus'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Settlement list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settlement'
                  meta:
                    oneOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - $ref: '#/components/schemas/CursorMeta'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}:
    get:
      tags:
      - Carriers
      summary: Get a carrier settlement
      operationId: getCarrierSettlement
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Settlement'
        '404':
          $ref: '#/components/responses/CarriersNotFound'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}/approve:
    post:
      tags:
      - Carriers
      summary: Approve a settlement
      operationId: approveCarrierSettlement
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      responses:
        '202':
          description: Approval accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}/dispute:
    post:
      tags:
      - Carriers
      summary: Dispute a settlement
      operationId: disputeCarrierSettlement
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeSettlementRequest'
      responses:
        '202':
          description: Dispute accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - appBearer: []
  /app/carriers/settlements/{settlementId}/pay:
    post:
      tags:
      - Carriers
      summary: Mark a settlement as paid
      operationId: payCarrierSettlement
      parameters:
      - $ref: '#/components/parameters/SettlementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSettlementPaidRequest'
      responses:
        '202':
          description: Payment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '422':
          $ref: '#/components/responses/DomainError'
      security:
      - appBearer: []
  /app/carriers/tariffs/cheapest:
    get:
      tags:
      - Carriers
      summary: Cheapest tariff for a corridor
      operationId: cheapestCarrierTariff
      parameters:
      - name: corridor_from
        in: query
        required: true
        schema:
          type: string
      - name: corridor_to
        in: query
        required: true
        schema:
          type: string
      - name: corridor_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CorridorType'
      responses:
        '200':
          description: Cheapest tariff
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tariff'
        '404':
          $ref: '#/components/responses/CarriersNotFound'
      security:
      - appBearer: []
  /app/carriers/{carrierId}/tariff:
    get:
      tags:
      - Carriers
      summary: Get a carrier tariff for a corridor and vehicle class
      operationId: getCarrierTariff
      parameters:
      - $ref: '#/components/parameters/CarrierId'
      - name: corridor_from
        in: query
        required: true
        schema:
          type: string
      - name: corridor_to
        in: query
        required: true
        schema:
          type: string
      - name: corridor_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CorridorType'
      - name: vehicle_class
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/VehicleClass'
      responses:
        '200':
          description: Tariff
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tariff'
        '404':
          $ref: '#/components/responses/CarriersNotFound'
      security:
      - appBearer: []
  /app/coverage/zones:
    get:
      tags:
      - coverage
      operationId: listCoverageZones
      summary: List coverage zones
      description: Lista todas las zonas de cobertura con su polígono GeoJSON y reglas (visor de zonas).
      responses:
        '200':
          description: Colección de zonas
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoverageZone'
      security:
      - appBearer: []
  /app/coverage/zones/resolve:
    get:
      tags:
      - coverage
      operationId: resolveCoverageZoneForPoint
      summary: Resolve which coverage zone contains a point
      description: |
        Devuelve la zona de cobertura que contiene el punto (lat, lng) con su nodo de atención y reglas. Responde 404 si ningún polígono contiene el punto.
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: float
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          format: float
          minimum: -180
          maximum: 180
      responses:
        '200':
          description: Zona encontrada
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CoverageZone'
        '404':
          description: Ninguna zona contiene el punto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageError'
        '422':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - appBearer: []
  /app/deliveries/failed:
    post:
      tags:
      - execution
      operationId: recordFailedDelivery
      summary: Record a failed delivery attempt with its typed reason
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailedDeliveryRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/photos:
    post:
      tags:
      - execution
      operationId: uploadDeliveryPhoto
      summary: Upload an evidence photo (proof of delivery or damage) and get its storage reference
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - shipment_id
              - photo
              properties:
                shipment_id:
                  type: string
                  format: uuid
                photo:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum:
                  - pod
                  - damage
                  default: pod
                  description: Tipo de evidencia; elige el disco (pod = prueba de entrega, damage = daños). Por defecto pod.
      responses:
        '201':
          description: The stored evidence reference
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - kind
                    - disk
                    - path
                    - url
                    properties:
                      kind:
                        type: string
                        enum:
                        - pod
                        - damage
                      disk:
                        type: string
                        description: Disco de evidencia donde quedó la foto
                      path:
                        type: string
                        description: Referencia durable (relativa al disco); viaja como photo_path en la prueba de entrega
                      url:
                        type: string
                        format: uri
                        nullable: true
                        description: URL de acceso si el disco la expone; null en discos privados
        '500':
          description: The evidence could not be stored after retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionError'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/proof-of-delivery:
    post:
      tags:
      - execution
      operationId: recordProofOfDelivery
      summary: Record proof of delivery and close the delivery as delivered
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofOfDeliveryRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/scans/load:
    post:
      tags:
      - execution
      operationId: recordLoadScan
      summary: Record a validated load scan of a unit onto the vehicle
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/scans/node-reception:
    post:
      tags:
      - execution
      operationId: recordNodeReception
      summary: Record the reception of a unit at a logistics node
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeReceptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/node-receptions:
    post:
      tags:
      - execution
      operationId: openNodeReception
      summary: Open a node reception for a shipment at a destination node (all internal corridors)
      description: |
        Abre la recepción de un envío que llega a un nodo destino por un corredor interno (CD→CD,
        CD→tienda, tienda→tienda, tienda→CD). Anuncia los bultos esperados. Idempotente por el par
        envío+nodo destino.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenNodeReceptionRequest'
      responses:
        '201':
          $ref: '#/components/responses/NodeReceptionState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/node-receptions/{shipmentId}/{nodeId}:
    get:
      tags:
      - execution
      operationId: getNodeReception
      summary: Current state of a shipment reception at a node (expected, received, discrepancies)
      parameters:
      - $ref: '#/components/parameters/ExecutionShipmentId'
      - name: nodeId
        in: path
        required: true
        description: Destination node UUID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/NodeReceptionState'
        '404':
          description: No reception has been opened for this shipment at this node yet
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    nullable: true
      security:
      - appBearer: []
  /app/node-receptions/units:
    post:
      tags:
      - execution
      operationId: receiveUnitAtNode
      summary: Record the scan of a unit received at a node (immutable, idempotent)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveUnitAtNodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/NodeReceptionState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/node-receptions/reconcile:
    post:
      tags:
      - execution
      operationId: reconcileNodeReception
      summary: Reconcile a node reception (compare received against expected, record missing/surplus)
      description: |
        Cierra la recepción conciliando lo recibido contra lo esperado y graba las discrepancias
        (faltantes/sobrantes). El evento de conciliación alimenta tracking y el conector SAP por el
        outbox. Idempotente: reconciliar dos veces no re-emite el evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileNodeReceptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/NodeReceptionState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/scans/preparation:
    post:
      tags:
      - execution
      operationId: recordPreparationScan
      summary: Record a preparation scan (EAN to label to lane) of a unit
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparationScanRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/scans/unload:
    post:
      tags:
      - execution
      operationId: recordUnloadScan
      summary: Record a guided unload of a unit at a stop (what comes off at each point)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnloadScanRequest'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryState'
        '422':
          $ref: '#/components/responses/ExecutionValidationError'
      security:
      - appBearer: []
  /app/deliveries/{shipmentId}/issues:
    post:
      tags:
      - execution
      operationId: reportDeliveryIssue
      summary: Report an issue during an in-progress delivery (does not close it)
      description: |
        The driver reports an obstacle during a delivery that is still IN PROGRESS. It is distinct from
        a failed delivery (which closes the delivery) and from a vehicle incident (breakdown/accident).
        The delivery is NOT closed: the platform records the issue as an immutable fact and notifies the
        control tower / customer through the outbox. Idempotent by `Idempotency-Key`.
      parameters:
      - $ref: '#/components/parameters/ExecutionShipmentId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Offline-first idempotency key; resending the same report does not duplicate the fact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryIssueRequest'
      responses:
        '202':
          description: Issue accepted and recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - shipment_id
                    - type
                    - status
                    properties:
                      shipment_id:
                        type: string
                        format: uuid
                      type:
                        $ref: '#/components/schemas/DeliveryIssueType'
                      status:
                        type: string
                        enum: [REPORTED]
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionError'
      security:
      - appBearer: []
  /app/deliveries/{shipmentId}:
    get:
      tags:
      - execution
      operationId: getDeliveryState
      summary: Current state of a shipment delivery with its scans
      parameters:
