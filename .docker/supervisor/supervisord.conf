; ============================================================
; supervisord — contenedor de workers de producción (logistics)
; ============================================================
; Un worker por cola (default, outbox, notifications, planning) más el scheduler,
; todos con reinicio automático. En desarrollo estos procesos corren como
; servicios sueltos del docker-compose (`queue-worker`, `scheduler`); en producción
; viven juntos acá, arrancados por un contenedor que ejecuta:
;
;   supervisord -c /etc/supervisor/supervisord.conf -n
;
; Reglas de las colas (ver config/queue.php):
;   - `--timeout` SIEMPRE menor que el `retry_after` de la cola, si no Laravel
;     reencola un job que todavía corre.
;   - `--max-time`/`--max-jobs` reciclan el proceso para no quedar ejecutando
;     código anterior a un deploy ni arrastrar fugas de memoria.
;   - `queue:work` (no `queue:listen`) mantiene el framework en memoria: tras un
;     deploy el entrypoint del web dispara `queue:restart` para que drenen el job
;     en curso y mueran; supervisor los vuelve a levantar con el código nuevo.
; ============================================================

[supervisord]
nodaemon=true
user=logistics
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ------------------------------------------------------------
; Cola default — trabajo general del dominio
; ------------------------------------------------------------
[program:worker-default]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=1 --tries=3 --backoff=5 --timeout=90 --max-time=3600 --max-jobs=1000
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=120
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------
; Cola outbox — relay hacia destinos externos (lento, I/O). Idempotente por
; event_id (ADR 002), así que reintentar es seguro.
; ------------------------------------------------------------
[program:worker-outbox]
command=php /var/www/html/artisan queue:work redis --queue=outbox --sleep=1 --tries=3 --backoff=30 --timeout=600 --max-time=3600 --max-jobs=500
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=630
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------
; Cola notifications — envío al cliente (FCM/email/SMS). Ráfagas cortas.
; ------------------------------------------------------------
[program:worker-notifications]
command=php /var/www/html/artisan queue:work redis --queue=notifications --sleep=1 --tries=3 --backoff=15 --timeout=120 --max-time=3600 --max-jobs=1000
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=150
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------
; Cola planning — generación de planes diarios de ruteo (CPU, pesado). Un solo
; intento: un plan a medias no debe reintentarse ciego, se re-dispara explícito.
; ------------------------------------------------------------
[program:worker-planning]
command=php /var/www/html/artisan queue:work redis --queue=planning --sleep=3 --tries=1 --timeout=1200 --max-time=3600 --max-jobs=100
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=1230
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------
; Scheduler — fuente de verdad del cron (routes/console.php). Una sola instancia.
; ------------------------------------------------------------
[program:scheduler]
command=php /var/www/html/artisan schedule:work
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
