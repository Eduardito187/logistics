# ============================================================
# docker-compose.observability.yml — Ola 5: observabilidad (OPT-IN)
# ============================================================
# Stack de monitoreo: Prometheus + Alertmanager + Grafana + exporters de PostgreSQL y Valkey.
# NUNCA es requisito del stack base: la app funciona igual sin esto. Se SUMA con `-f`:
#
#   docker compose -f docker-compose.yml -f .docker/compose/docker-compose.observability.yml up -d
#
# También corre como proyecto APARTE pegado a una red docker ya existente (así se usa en staging,
# para que el `--remove-orphans` del deploy no lo borre). Ver docs/observability-runbook.md §2:
#
#   OBS_NETWORK=logistics-staging_staging OBS_NETWORK_EXTERNAL=true OBS_CONFIG_DIR=/ruta/absoluta \
#   OBS_METRICS_TARGET=web:8080 docker compose -p logistics-observability \
#       -f .docker/compose/docker-compose.observability.yml up -d
#
# Reglas del proyecto que cumple:
#   - CERO CDN / cero llamadas a terceros: Grafana sin plugins externos, sin telemetría, sin gravatar,
#     sin buscador de actualizaciones; datasources y dashboard provisionados desde archivos del repo.
#   - Funciona en docker nuevo: todo tiene default funcional. Lo ÚNICO que hay que definir es
#     METRICS_TOKEN (el mismo valor lo lee la app y lo usa Prometheus); sin él la app responde 404 en
#     /api/metrics (fail-closed) y salta la alerta LogisticsAppCaida.
#   - Ningún servicio de este archivo depende (`depends_on`) del stack base: se puede levantar y bajar
#     sin tocar la app.
#
# Puertos del host (propios, no chocan con 8110/5442/6432/6409/5010/3010/8081/8082/5203/9010/9011/6001):
#   Prometheus 9190 · Alertmanager 9193 · Grafana 3110. Se publican solo en 127.0.0.1 por defecto
#   (Prometheus y Alertmanager no tienen autenticación propia): para exponerlos, poner un proxy con
#   auth delante o cambiar OBS_BIND_ADDRESS a conciencia.
#
# Config: .docker/observability/ (prometheus.yml, rules.yml, alerts.yml, alertmanager.yml, grafana/).
# Prometheus y Alertmanager NO expanden variables de entorno en su config; por eso el entrypoint de
# cada uno materializa lo que viene por env (token, target de la app, receptores) en su volumen de datos.
# ============================================================

x-obs-logging: &obs-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    # -------------------- Prometheus (métricas + reglas + alertas) --------------------
    prometheus:
        image: prom/prometheus:v3.5.0
        container_name: ${OBS_CONTAINER_PREFIX:-dismac_lg}_prometheus
        restart: unless-stopped
        environment:
            # MISMO valor que lee la app (config/observability.php). Se escribe a un archivo 0600 dentro
            # del volumen y prometheus.yml lo referencia con `credentials_file` (nunca queda en la config).
            METRICS_TOKEN: ${METRICS_TOKEN:-}
            # host:puerto que sirve /api/metrics. Dev: nginx:80. Staging: web:8080.
            OBS_METRICS_TARGET: ${OBS_METRICS_TARGET:-nginx:80}
        entrypoint:
            - /bin/sh
            - -c
            - |
                set -eu
                umask 077
                mkdir -p /prometheus/runtime /prometheus/data
                token="$${METRICS_TOKEN:-}"
                if [ -z "$$token" ]; then
                    echo "[prometheus] AVISO: METRICS_TOKEN vacio. La app responde 404 en /api/metrics (fail-closed) y el job logistics-app quedara DOWN. Definir METRICS_TOKEN en el .env (mismo valor para la app y para este stack)." >&2
                    token="metrics-token-sin-configurar"
                fi
                printf '%s' "$$token" > /prometheus/runtime/metrics_token
                printf '[{"targets":["%s"],"labels":{"service":"logistics"}}]\n' "$$OBS_METRICS_TARGET" > /prometheus/runtime/app-targets.json
                exec /bin/prometheus \
                    --config.file=/etc/logistics-observability/prometheus.yml \
                    --storage.tsdb.path=/prometheus/data \
                    --storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION:-35d} \
                    --web.external-url=${OBS_PROMETHEUS_EXTERNAL_URL:-http://localhost:9190} \
                    --web.route-prefix=/ \
                    --web.enable-lifecycle \
                    --web.enable-remote-write-receiver
        ports:
            - "${OBS_BIND_ADDRESS:-127.0.0.1}:${DOCKER_PROMETHEUS_PORT:-9190}:9090"
        volumes:
            - ${OBS_CONFIG_DIR:-./.docker/observability}:/etc/logistics-observability:ro
            - prometheus_data:/prometheus
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - dismac_lg
        logging: *obs-logging

    # -------------------- Alertmanager (ruteo y envío de alertas) --------------------
    # `alertmanager.yml` del repo es una PLANTILLA con marcadores __ALERT_*__; el entrypoint los
    # reemplaza con las envs y escribe la config final en el volumen. Los valores no deben contener
    # comillas simples (van dentro de strings YAML con comilla simple).
    alertmanager:
        image: prom/alertmanager:v0.28.1
        container_name: ${OBS_CONTAINER_PREFIX:-dismac_lg}_alertmanager
        restart: unless-stopped
        environment:
            # Canal de salida: `webhook` (default) o `email`.
            ALERT_CHANNEL: ${ALERT_CHANNEL:-webhook}
            # Webhook genérico (Slack/Teams/ntfy/Telegram vía puente propio). El default apunta a un
            # puerto cerrado A PROPÓSITO: sin configurar no se notifica a nadie (las alertas igual se ven
            # en Alertmanager y Grafana) y nada sale a un tercero.
            ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/alertas-sin-configurar}
            # Webhook para severidad `page` (guardia). Vacío = usa ALERT_WEBHOOK_URL.
            ALERT_WEBHOOK_URL_PAGE: ${ALERT_WEBHOOK_URL_PAGE:-}
            ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ops@dismac.test}
            # Destinatario para severidad `page`. Vacío = usa ALERT_EMAIL_TO.
            ALERT_EMAIL_TO_PAGE: ${ALERT_EMAIL_TO_PAGE:-}
            ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-localhost:25}
            ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-alertmanager@dismac.test}
            ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
            ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
            ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
        entrypoint:
            - /bin/sh
            - -c
            - |
                set -eu
                umask 077
                mkdir -p /alertmanager/data
                case "$$ALERT_CHANNEL" in
                    webhook|email) ;;
                    *) echo "[alertmanager] ALERT_CHANNEL debe ser webhook o email (vino '$$ALERT_CHANNEL')." >&2; exit 1 ;;
                esac
                case "$$ALERT_SMTP_REQUIRE_TLS" in
                    true|false) ;;
                    *) echo "[alertmanager] ALERT_SMTP_REQUIRE_TLS debe ser true o false." >&2; exit 1 ;;
                esac
                [ -n "$$ALERT_WEBHOOK_URL_PAGE" ] || ALERT_WEBHOOK_URL_PAGE="$$ALERT_WEBHOOK_URL"
                [ -n "$$ALERT_EMAIL_TO_PAGE" ] || ALERT_EMAIL_TO_PAGE="$$ALERT_EMAIL_TO"
                # Escapa lo que sed interpreta en el reemplazo (barra invertida, & y el delimitador |).
                esc() { printf '%s' "$$1" | sed -e 's/[\\&|]/\\&/g'; }
                sed \
                    -e "s|__ALERT_CHANNEL__|$$(esc "$$ALERT_CHANNEL")|g" \
                    -e "s|__ALERT_WEBHOOK_URL_PAGE__|$$(esc "$$ALERT_WEBHOOK_URL_PAGE")|g" \
                    -e "s|__ALERT_WEBHOOK_URL__|$$(esc "$$ALERT_WEBHOOK_URL")|g" \
                    -e "s|__ALERT_EMAIL_TO_PAGE__|$$(esc "$$ALERT_EMAIL_TO_PAGE")|g" \
                    -e "s|__ALERT_EMAIL_TO__|$$(esc "$$ALERT_EMAIL_TO")|g" \
                    -e "s|__ALERT_SMTP_SMARTHOST__|$$(esc "$$ALERT_SMTP_SMARTHOST")|g" \
                    -e "s|__ALERT_SMTP_FROM__|$$(esc "$$ALERT_SMTP_FROM")|g" \
                    -e "s|__ALERT_SMTP_USERNAME__|$$(esc "$$ALERT_SMTP_USERNAME")|g" \
                    -e "s|__ALERT_SMTP_PASSWORD__|$$(esc "$$ALERT_SMTP_PASSWORD")|g" \
                    -e "s|__ALERT_SMTP_REQUIRE_TLS__|$$(esc "$$ALERT_SMTP_REQUIRE_TLS")|g" \
                    /etc/logistics-observability/alertmanager.yml > /alertmanager/alertmanager.rendered.yml
                exec /bin/alertmanager \
                    --config.file=/alertmanager/alertmanager.rendered.yml \
                    --storage.path=/alertmanager/data \
                    --web.external-url=${OBS_ALERTMANAGER_EXTERNAL_URL:-http://localhost:9193} \
                    --web.route-prefix=/
        ports:
            - "${OBS_BIND_ADDRESS:-127.0.0.1}:${DOCKER_ALERTMANAGER_PORT:-9193}:9093"
        volumes:
            - ${OBS_CONFIG_DIR:-./.docker/observability}:/etc/logistics-observability:ro
            - alertmanager_data:/alertmanager
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - dismac_lg
        logging: *obs-logging

    # -------------------- Grafana (dashboards) --------------------
    # Sin plugins externos, sin fuentes remotas, sin telemetría: todo lo que carga el navegador lo
    # sirve este contenedor (regla CERO CDN). Datasources y dashboard se provisionan desde el repo.
    grafana:
        image: grafana/grafana:12.0.2
        container_name: ${OBS_CONTAINER_PREFIX:-dismac_lg}_grafana
        restart: unless-stopped
        environment:
            # Credenciales de DESARROLLO por defecto. En staging/prod definir GRAFANA_ADMIN_PASSWORD.
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3110}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_USERS_DEFAULT_LANGUAGE: ${GRAFANA_DEFAULT_LANGUAGE:-es-ES}
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            # Cero llamadas salientes: sin reporte de uso, sin chequeo de versiones, sin noticias,
            # sin gravatar, sin catálogo/instalación de plugins, sin snapshots externos.
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
            GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
            GF_NEWS_NEWS_FEED_ENABLED: "false"
            GF_SECURITY_DISABLE_GRAVATAR: "true"
            GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
            GF_PLUGINS_PREINSTALL_DISABLED: "true"
            GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
            GF_PUBLIC_DASHBOARDS_ENABLED: "false"
            GF_SUPPORT_BUNDLES_ENABLED: "false"
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/logistics-overview.json
            TZ: America/La_Paz
        ports:
            - "${OBS_BIND_ADDRESS:-127.0.0.1}:${DOCKER_GRAFANA_PORT:-3110}:3000"
        volumes:
            - ${OBS_CONFIG_DIR:-./.docker/observability}/grafana/provisioning:/etc/grafana/provisioning:ro
            - ${OBS_CONFIG_DIR:-./.docker/observability}/grafana/dashboards:/etc/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - dismac_lg
        logging: *obs-logging

    # -------------------- postgres_exporter (PostgreSQL DIRECTO, no PgBouncer) --------------------
    # Va contra postgres:5432 a propósito: las vistas pg_stat_* son por servidor y PgBouncer en
    # transaction pooling no debe cargar sesiones de monitoreo. En prod usar un rol dedicado con
    # `pg_monitor` (OBS_PG_USER/OBS_PG_PASSWORD), no el dueño de la base.
    postgres-exporter:
        image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
        container_name: ${OBS_CONTAINER_PREFIX:-dismac_lg}_postgres_exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_URI: ${OBS_PG_HOST:-postgres}:${OBS_PG_PORT:-5432}/${OBS_PG_DATABASE:-logistics}?sslmode=disable
            DATA_SOURCE_USER: ${OBS_PG_USER:-logistics}
            DATA_SOURCE_PASS: ${OBS_PG_PASSWORD:-logistics}
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9187/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - dismac_lg
        logging: *obs-logging

    # -------------------- redis_exporter (Valkey) --------------------
    # Valkey habla el protocolo de Redis: el exporter funciona sin cambios. La imagen es `scratch`
    # (sin shell), así que no admite healthcheck de contenedor: su salud se ve en Prometheus
    # (`up{job="valkey"}` y `redis_up`).
    valkey-exporter:
        image: oliver006/redis_exporter:v1.67.0
        container_name: ${OBS_CONTAINER_PREFIX:-dismac_lg}_valkey_exporter
        restart: unless-stopped
        environment:
            REDIS_ADDR: ${OBS_REDIS_ADDR:-redis://valkey:6379}
            REDIS_PASSWORD: ${OBS_REDIS_PASSWORD:-}
        networks:
            - dismac_lg
        logging: *obs-logging

volumes:
    prometheus_data:
    alertmanager_data:
    grafana_data:

# Red compartida con el stack base. Apilado sobre docker-compose.yml se FUSIONA con su definición
# (misma clave `dismac_lg`, mismo nombre `dismac_lg_network`). Como proyecto aparte (staging), se
# engancha a una red ya creada: OBS_NETWORK=<nombre real> + OBS_NETWORK_EXTERNAL=true.
networks:
    dismac_lg:
        name: ${OBS_NETWORK:-dismac_lg_network}
        external: ${OBS_NETWORK_EXTERNAL:-false}
