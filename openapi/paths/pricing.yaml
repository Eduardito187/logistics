# Fragmento OpenAPI del contexto commerce/pricing (listas de precio, IVA/IT — ADR 018 / EC-F0-03).
#
# Paths y schemas para fusionar en openapi/v1.yaml. Schemas con prefijo `Commerce`. Montos en centavos.
# channels: lectura del storefront (resolver precio). integrations: gestión PIM de listas (escritura).

paths:
  /channels/pricing/price:
    get:
      tags: [pricing]
      operationId: getPrice
      summary: Resolve the current price of a SKU for a sales channel
      parameters:
      - name: sku
        in: query
        required: true
        schema:
          type: string
          maxLength: 255
      - name: channel
        in: query
        required: false
        description: Sales channel; defaults to retail (B2C storefront).
        schema:
          type: string
          enum: [retail, b2b, c2c]
          default: retail
      responses:
        '200':
          description: The resolved price quote (net + taxes + gross)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommercePriceQuote'
        '404':
          description: No price found for the given SKU and channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - channelApiKey: []

  /channels/pricing/prices:
    get:
      tags: [pricing]
      operationId: listPrices
      summary: List the prices of a price list
      parameters:
      - name: price_list_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Price collection (with pagination meta only when requested)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommercePriceView'
                  meta:
                    oneOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - $ref: '#/components/schemas/CursorMeta'
      security:
      - channelApiKey: []

  /integrations/pricing/price-lists:
    get:
      tags: [pricing]
      operationId: listPriceLists
      summary: List price lists
      parameters:
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum: [retail, b2b, c2c]
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Price list collection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommercePriceList'
                  meta:
                    oneOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - $ref: '#/components/schemas/CursorMeta'
      security:
      - serviceCredential: []
    post:
      tags: [pricing]
      operationId: createPriceList
      summary: Create a price list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceCreatePriceListRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
        '422':
          description: Validation or domain-rule error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - serviceCredential: []

  /integrations/pricing/price-lists/{id}/prices:
    post:
      tags: [pricing]
      operationId: setPrice
      summary: Set the price of a SKU in a price list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceSetPriceRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
        '422':
          description: Validation or domain-rule error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - serviceCredential: []

  /integrations/pricing/price-lists/{id}/activate:
    post:
      tags: [pricing]
      operationId: activatePriceList
      summary: Activate a price list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
      security:
      - serviceCredential: []

  /integrations/pricing/price-lists/{id}/archive:
    post:
      tags: [pricing]
      operationId: archivePriceList
      summary: Archive a price list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceAck'
      security:
      - serviceCredential: []

components:
  schemas:
    CommerceAck:
      type: object
      description: Acknowledgement of an accepted asynchronous write (202).
      required: [accepted]
      properties:
        accepted:
          type: boolean
      additionalProperties: true
    CommercePriceQuote:
      type: object
      required: [sku, channel, net_cents, tax_cents, gross_cents, currency]
      properties:
        sku:
          type: string
        channel:
          type: string
          enum: [retail, b2b, c2c]
        net_cents:
          type: integer
        tax_cents:
          type: integer
          description: Total taxes included in the gross amount.
        gross_cents:
          type: integer
        currency:
          type: string
        tax_breakdown:
          type: object
          properties:
            iva_cents:
              type: integer
            iva_basis_points:
              type: integer
            it_cents:
              type: integer
            it_basis_points:
              type: integer
    CommercePriceView:
      type: object
      required: [price_list_id, sku, gross_amount_cents, currency]
      properties:
        price_list_id:
          type: string
          format: uuid
        sku:
          type: string
        gross_amount_cents:
          type: integer
        currency:
          type: string
    CommercePriceList:
      type: object
      required: [id, name, currency, channel, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        channel:
          type: string
          enum: [retail, b2b, c2c]
        status:
          type: string
          enum: [draft, active, archived]
    CommerceCreatePriceListRequest:
      type: object
      required: [name, channel]
      properties:
        name:
          type: string
          maxLength: 255
        channel:
          type: string
          enum: [retail, b2b, c2c]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217; defaults to BOB when omitted.
    CommerceSetPriceRequest:
      type: object
      required: [sku, gross_amount_cents]
      properties:
        sku:
          type: string
          maxLength: 255
        gross_amount_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
