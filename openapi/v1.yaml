      responses:
        '200':
          description: The seller's settlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerPortalSettlementCollection'
        '401':
          description: Token ausente, inválido o expirado
        '403':
          description: El token no concede sellerportal.read o no identifica a un seller
      security:
      - integrationToken: []

  # ── commerce/catalog (ADR 018, Fase 0) ──
  /channels/catalog/products:
    get:
      tags: [catalog]
      operationId: listCatalogProducts
      summary: List catalog products (storefront browse)
      description: >-
        Returns the catalog products for the storefront. Optional filter by publication `status` and
        optional additive pagination (E-02): without any pagination parameter the full collection is
        returned with no `meta`.
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by publication status.
        schema:
          type: string
          enum: [draft, published, archived]
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Product collection (with pagination meta only when requested)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommerceProduct'
                  meta:
                    oneOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - $ref: '#/components/schemas/CursorMeta'
        '422':
          description: Validation error in the query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - channelApiKey: []

  /channels/catalog/products/{id}:
    get:
      tags: [catalog]
      operationId: getCatalogProduct
      summary: Get a catalog product by id
      parameters:
      - name: id
        in: path
        required: true
        description: Product id.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CommerceProduct'
        '404':
          description: No product found for the given identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - channelApiKey: []

  /channels/catalog/categories:
    get:
      tags: [catalog]
      operationId: listCatalogCategories
      summary: List catalog categories
      responses:
        '200':
          description: Category collection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommerceCategory'
      security:
      - channelApiKey: []


